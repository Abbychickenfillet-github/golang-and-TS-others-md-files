<script src="{{ '/assets/wikilink.js' | relative_url }}" data-root="{{ '/' | relative_url }}"></script>

<style>
.page-heading h1 { font-size: clamp(1.6rem, 4vw, 2.4rem) !important; line-height: 1.3 !important; }
.post-content h1:first-child, .post-content > h1:first-of-type { font-size: clamp(1.4rem, 3.2vw, 2rem) !important; margin-top: .2em !important; }
.auto-toc { background: #FFF5F8; border: 1px solid #F8BBD0; border-radius: 10px; padding: .8em 1.2em; margin: 1em 0 1.4em; }
.auto-toc-title { font-weight: 700; color: #C2185B; margin-bottom: .4em; }
.auto-toc ul { margin: 0; padding-left: 1.2em; }
.auto-toc a { color: #C2185B; text-decoration: none; }
.auto-toc a:hover { text-decoration: underline; }
.mermaid { text-align: center; margin: 1em 0; }
</style>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!window.mermaid) return;
  mermaid.initialize({ startOnLoad: false, theme: 'default' });
  document.querySelectorAll('code.language-mermaid').forEach(function (code) {
    var pre = code.closest('pre') || code.parentElement;
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    (pre.closest('.highlight') || pre).replaceWith(div);
  });
  mermaid.run({ querySelector: '.mermaid' });
});
</script>

<script src="{{ '/assets/toc.js' | relative_url }}"></script>
