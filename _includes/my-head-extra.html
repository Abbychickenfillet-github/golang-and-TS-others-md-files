<script src="{{ '/assets/wikilink.js' | relative_url }}" data-root="{{ '/' | relative_url }}"></script>

<style>
/* 字級總開關（2026-10-06）：想調大小只改這幾行，單位 px。
   beautiful-jekyll 預設：內文 18px、h1 36px、h2 30px、h3 24px、h4 18px，這裡全部覆蓋成較小的值 */
:root {
  --note-body: 13px;
  --note-h1: 17px;
  --note-h2: 16px;
  --note-h3: 14.5px;
  --note-h4: 13px;
  --note-code: 12px;
}
body { font-size: var(--note-body) !important; line-height: 1.7; }
h1, .page-heading h1, .post-content h1:first-child, .post-content > h1:first-of-type { font-size: var(--note-h1) !important; line-height: 1.4 !important; margin-top: .6em !important; }
h2 { font-size: var(--note-h2) !important; line-height: 1.4 !important; margin-top: 1em !important; }
h3 { font-size: var(--note-h3) !important; line-height: 1.4 !important; margin-top: .9em !important; }
h4, h5, h6 { font-size: var(--note-h4) !important; line-height: 1.4 !important; margin-top: .8em !important; }
main p, main li, main td, main th, main blockquote, main blockquote p { font-size: var(--note-body) !important; }
code, pre, pre code, .highlight pre, .highlight code { font-size: var(--note-code) !important; }
.page-subheading, .post-subheading { font-size: var(--note-body) !important; }
.auto-toc { background: #FFF5F8; border: 1px solid #F8BBD0; border-radius: 10px; padding: .8em 1.2em; margin: 1em 0 1.4em; }
.auto-toc-title { font-weight: 700; color: #C2185B; margin-bottom: .4em; }
.auto-toc ul { margin: 0; padding-left: 1.2em; }
.auto-toc a { color: #C2185B; text-decoration: none; }
.auto-toc a:hover { text-decoration: underline; }
.mermaid { text-align: center; margin: 1em 0; }
</style>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!window.mermaid) return;
  mermaid.initialize({ startOnLoad: false, theme: 'default' });
  document.querySelectorAll('code.language-mermaid').forEach(function (code) {
    var pre = code.closest('pre') || code.parentElement;
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    (pre.closest('.highlight') || pre).replaceWith(div);
  });
  mermaid.run({ querySelector: '.mermaid' });
});
</script>

<script src="{{ '/assets/toc.js' | relative_url }}"></script>
