remote_theme: daattali/beautiful-jekyll

title: Abby Notes
plugins:
  - jekyll-remote-theme

navbar-col: "#FFC0CB"
navbar-text-col: "#4A0033"
navbar-children-col: "#F5F5F5"
hover-col: "#FF69B4"
page-col: "#FFF5F8"
link-col: "#C2185B"
footer-col: "#FBE4EC"
footer-text-col: "#6b7280"
footer-link-col: "#C2185B"

defaults:
  - scope:
      path: ""
    values:
      render_with_liquid: false
      head-extra:
        - my-head-extra.html

# ⚠️ 不要發布到公開網站的內容（2026-08-18 新增）
# GitHub Pages 網站是公開的，即使 repo 是 private，這裡沒排除的檔案都會被發布出去
exclude:
  - private/                 # 求職截圖、薪資、履歷等個人資料
  - _to_delete/              # 待刪除的暫存檔
  - 系統維護-C槽清理/          # 含 Cursor 對話備份，可能有專案或帳號細節
  - Git/                     # 含個人 repo 操作紀錄
  - "*.sh"                   # 腳本檔
  - "*.bak"
  - node_modules/
  - vendor/
