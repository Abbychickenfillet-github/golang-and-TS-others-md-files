<svg viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" role="img" aria-label="AES-256-GCM 加密與完整性驗證動畫" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="gcmA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7d8a94"/></marker>
  </defs>

  <rect x="0" y="0" width="860" height="440" rx="10" fill="#fbfaf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1d2b36">AES-256-GCM:一次做到「加密」＋「完整性驗證」</text>

  <!-- 輸入 -->
  <rect x="24" y="110" width="120" height="50" rx="8" fill="#eafaf0" stroke="#4a9b5e" stroke-width="1.6"/>
  <text x="84" y="132" text-anchor="middle" font-size="13" fill="#2f6b43" font-weight="600">明文</text>
  <text x="84" y="150" text-anchor="middle" font-size="11" fill="#2f6b43">(要保護的資料)</text>
  <text x="84" y="192" text-anchor="middle" font-size="12" fill="#6b7b88">🔑 金鑰 256-bit</text>
  <text x="84" y="210" text-anchor="middle" font-size="12" fill="#6b7b88">🔢 計數器 Counter</text>

  <!-- 中央 GCM 盒 -->
  <rect x="250" y="95" width="200" height="150" rx="12" fill="#ffffff" stroke="#3f6f8f" stroke-width="2">
    <animate attributeName="stroke-width" dur="2.4s" repeatCount="indefinite" values="2;3.4;2"/>
    <animate attributeName="stroke" dur="2.4s" repeatCount="indefinite" values="#3f6f8f;#caa500;#3f6f8f"/>
  </rect>
  <text x="350" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2b36">AES-256-GCM</text>
  <line x1="268" y1="142" x2="432" y2="142" stroke="#e4e8ec"/>
  <text x="350" y="166" text-anchor="middle" font-size="11.5" fill="#41525f">① CTR 模式:AES 把計數器</text>
  <text x="350" y="183" text-anchor="middle" font-size="11.5" fill="#41525f">加密成 keystream,再和</text>
  <text x="350" y="200" text-anchor="middle" font-size="11.5" fill="#41525f">明文 XOR → 密文(機密)</text>
  <text x="350" y="224" text-anchor="middle" font-size="11.5" fill="#9c3a55">② GHASH:把密文在 GF(2^128)</text>
  <text x="350" y="240" text-anchor="middle" font-size="11.5" fill="#9c3a55">乘法累加 → 標籤(完整性)</text>

  <!-- 輸入箭頭 + 流動點 -->
  <line x1="146" y1="135" x2="248" y2="135" stroke="#7d8a94" stroke-width="1.6" marker-end="url(#gcmA)"/>
  <circle r="6" fill="#4a9b5e">
    <animateMotion dur="4s" repeatCount="indefinite" keyTimes="0;0.25;1" keyPoints="0;1;1" calcMode="linear" path="M 150 135 L 246 135"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.22;0.26;1" values="1;1;0;0"/>
  </circle>

  <!-- 兩路輸出:密文(上)、標籤(下) -->
  <line x1="452" y1="135" x2="560" y2="110" stroke="#7d8a94" stroke-width="1.6" marker-end="url(#gcmA)"/>
  <line x1="452" y1="205" x2="560" y2="230" stroke="#7d8a94" stroke-width="1.6" marker-end="url(#gcmA)"/>

  <rect x="566" y="86" width="150" height="48" rx="8" fill="#eaf2f7" stroke="#3f6f8f" stroke-width="1.6"/>
  <text x="641" y="108" text-anchor="middle" font-size="13" fill="#1d2b36" font-weight="600">密文 Ciphertext</text>
  <text x="641" y="125" text-anchor="middle" font-size="10.5" fill="#41525f">看不到內容(機密性)</text>

  <rect x="566" y="208" width="150" height="48" rx="8" fill="#fdf0e6" stroke="#b5700f" stroke-width="1.6"/>
  <text x="641" y="230" text-anchor="middle" font-size="13" fill="#7a4a08" font-weight="600">驗證標籤 Tag</text>
  <text x="641" y="247" text-anchor="middle" font-size="10.5" fill="#7a4a08">128-bit 防偽章(完整性)</text>

  <!-- 流動點:密文 -->
  <circle r="5" fill="#3f6f8f" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" keyTimes="0;0.35;0.55;1" keyPoints="0;0;1;1" calcMode="linear" path="M 455 133 L 560 110"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.35;0.4;0.55;0.6;1" values="0;0;1;1;0;0"/>
  </circle>
  <!-- 流動點:標籤 -->
  <circle r="5" fill="#b5700f" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" keyTimes="0;0.35;0.55;1" keyPoints="0;0;1;1" calcMode="linear" path="M 455 207 L 560 230"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.35;0.4;0.55;0.6;1" values="0;0;1;1;0;0"/>
  </circle>

  <!-- 下半:送出 + 接收方驗證 -->
  <text x="430" y="300" text-anchor="middle" font-size="13" fill="#1d2b36" font-weight="600">送出 = 密文 + 標籤(兩個一起走)</text>
  <line x1="430" y1="310" x2="430" y2="338" stroke="#7d8a94" stroke-width="1.6" marker-end="url(#gcmA)"/>

  <rect x="150" y="348" width="560" height="74" rx="10" fill="#ffffff" stroke="#e4e8ec" stroke-width="1.4"/>
  <text x="170" y="372" font-size="12.5" fill="#41525f" font-weight="600">接收方驗證:</text>
  <text x="170" y="392" font-size="12" fill="#41525f">1. 用同一把金鑰,自己對收到的密文「重算一次標籤」。</text>
  <text x="170" y="410" font-size="12" fill="#41525f">2. 和收到的標籤比對 →</text>
  <!-- 一致 ✓ 閃現 -->
  <g>
    <text x="330" y="410" font-size="12.5" font-weight="700" fill="#2f6b43">一致 ✓ 沒被改</text>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.6;0.7;1" values="0;0;1;1"/>
  </g>
  <g>
    <text x="470" y="410" font-size="12.5" font-weight="700" fill="#9c3a55">不一致 ✗ 被竄改 → 拒絕</text>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.75;0.85;1" values="0;0;1;1"/>
  </g>
  <text x="700" y="410" text-anchor="end" font-size="10.5" fill="#9aa8b2"></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
