<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
    <marker id="pd" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#cbd5e1"/></marker>
    <marker id="pg" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker>
  </defs>
  <rect width="1000" height="720" fill="#fafafa"/>

  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">let a = 1; a = 2　到底改了哪一個？</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">「不可變」講的是「值」，不是「變數槽」。賦值只動槽，從來不動值</text>

  <text x="145" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">變數槽（binding）</text>
  <text x="145" y="106" text-anchor="middle" font-size="11.5" fill="#64748b">會被改寫</text>
  <text x="640" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">堆積（heap）</text>
  <text x="640" y="106" text-anchor="middle" font-size="11.5" fill="#64748b">值住的地方</text>

  <!-- 情況 1：小整數 Smi -->
  <rect x="24" y="120" width="952" height="126" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="44" y="144" font-size="14" font-weight="700" fill="#4c1d95">1　小整數（Smi）　let a = 1;　a = 2</text>

  <rect x="60" y="156" width="170" height="42" rx="6" fill="#fff" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="145" y="173" text-anchor="middle" font-size="12" fill="#4c1d95">a　│　1 的編碼位元</text>
  <text x="145" y="190" text-anchor="middle" font-size="11" fill="#6d28d9">整數就住在槽裡</text>

  <rect x="60" y="204" width="170" height="30" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="145" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">a　│　2 的編碼位元</text>

  <text x="252" y="180" font-size="12" fill="#5b21b6">a = 2　→　直接改寫這一格的位元</text>
  <text x="252" y="222" font-size="12" font-weight="600" fill="#6d28d9">被改寫的是「變數槽」，不是「值 1」</text>

  <rect x="540" y="156" width="410" height="78" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="745" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">空的</text>
  <text x="745" y="208" text-anchor="middle" font-size="12" fill="#7c3aed">「儲存 integer 1 的那格記憶體」不存在</text>
  <text x="745" y="226" text-anchor="middle" font-size="11.5" fill="#8b5cf6">實測：一千萬次 a = i，heap 只動 0.02 MB</text>

  <!-- 情況 2：字串 -->
  <rect x="24" y="258" width="952" height="150" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="44" y="282" font-size="14" font-weight="700" fill="#075985">2　字串（也適用浮點數、BigInt）　let s = "hello";　s = "world"</text>

  <rect x="60" y="294" width="170" height="36" rx="6" fill="#fff" stroke="#7dd3fc" stroke-width="1.3"/>
  <text x="145" y="317" text-anchor="middle" font-size="12" fill="#075985">s　│　指標 ●</text>

  <rect x="60" y="340" width="170" height="36" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
  <text x="145" y="363" text-anchor="middle" font-size="12" font-weight="600" fill="#075985">s　│　指標 ●</text>

  <path d="M232 312 L536 312" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#pd)"/>
  <path d="M232 358 L536 372" stroke="#0284c7" stroke-width="1.8" marker-end="url(#p)"/>

  <rect x="540" y="292" width="410" height="42" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="745" y="310" text-anchor="middle" font-size="12.5" fill="#475569">字串物件　"hello"</text>
  <text x="745" y="327" text-anchor="middle" font-size="11.5" fill="#64748b">一個位元都沒被動過　→　沒人指向　→　被 GC 回收</text>

  <rect x="540" y="352" width="410" height="42" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
  <text x="745" y="370" text-anchor="middle" font-size="12.5" font-weight="600" fill="#075985">字串物件　"world"　（新配置）</text>
  <text x="745" y="387" text-anchor="middle" font-size="11.5" fill="#0369a1">實測：500 萬字元字串，rss 各增加 4.88 MB</text>

  <text x="252" y="340" font-size="12" font-weight="600" fill="#0369a1">這一格才是你說的「那格記憶體」，你的講法完全正確</text>

  <!-- 情況 3：物件對比 -->
  <rect x="24" y="420" width="952" height="126" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="44" y="444" font-size="14" font-weight="700" fill="#14532d">3　物件的對比　const obj = &#123; n: 0 &#125;;　obj.n = 2</text>

  <rect x="60" y="456" width="170" height="36" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.3"/>
  <text x="145" y="479" text-anchor="middle" font-size="12" fill="#14532d">obj　│　指標 ●</text>
  <text x="145" y="512" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">槽完全沒動</text>
  <text x="145" y="530" text-anchor="middle" font-size="11.5" fill="#15803d">obj === objBefore → true</text>

  <path d="M232 474 L536 482" stroke="#059669" stroke-width="1.8" marker-end="url(#pg)"/>

  <rect x="540" y="458" width="410" height="72" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
  <text x="745" y="480" text-anchor="middle" font-size="12.5" fill="#14532d">物件　&#123; n: 0 &#125;　→　&#123; n: 2 &#125;</text>
  <text x="745" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">內容被「就地改寫」了</text>
  <text x="745" y="520" text-anchor="middle" font-size="11.5" fill="#15803d">這就是物件可變、primitive 不可變的分界</text>

  <!-- 最深的一層 -->
  <line x1="24" y1="566" x2="976" y2="566" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="24" y="594" font-size="15" font-weight="700" fill="#0f172a">最深的一層：語言根本不讓你問「是不是同一格」</text>

  <rect x="24" y="608" width="465" height="94" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="44" y="630" font-size="12.5" font-weight="600" fill="#334155">物件有 identity（身分），觀察得到</text>
  <text x="44" y="652" font-size="12" fill="#475569">&#123;&#125; === &#123;&#125;　→　false</text>
  <text x="44" y="672" font-size="12" fill="#475569">new Number(1) === new Number(1)　→　false</text>
  <text x="44" y="692" font-size="11.5" fill="#64748b">（包裝物件是 Object，所以才有身分）</text>

  <rect x="511" y="608" width="465" height="94" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="531" y="630" font-size="12.5" font-weight="600" fill="#334155">primitive 沒有 identity，問不出來</text>
  <text x="531" y="652" font-size="12" fill="#475569">1 === 1　→　true　（永遠）</text>
  <text x="531" y="672" font-size="12" fill="#475569">"a" === "a"　→　true　（永遠）</text>
  <text x="531" y="692" font-size="11.5" fill="#64748b">規格只定義「值」與「行為」，不定義記憶體佈局</text>
</svg>
