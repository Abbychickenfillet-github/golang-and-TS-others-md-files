<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">
  <rect width="1100" height="620" fill="#ffffff"/>

  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">CPU怎麼「去抓」指令：Fetch（提取）階段的五個步驟</text>
  <text x="550" y="50" text-anchor="middle" font-size="13" fill="#666">指令本身放在Memory（Code Segment），CPU內部的暫存器只是暫時搬運、加工用的小空間，裝不下整支程式</text>

  <!-- Memory box -->
  <rect x="40" y="90" width="280" height="440" rx="10" fill="#fdf6e3" stroke="#8a6d3b" stroke-width="2.5"/>
  <text x="180" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3b">Memory（主記憶體／Code Segment）</text>
  <text x="180" y="136" text-anchor="middle" font-size="11.5" fill="#8a6d3b">指令真正躺著的地方，執行前就固定了</text>

  <g font-size="13" fill="#333">
    <rect x="60" y="150" width="240" height="30" fill="#cfe3fb" stroke="#1565c0"/>
    <text x="70" y="170">0x0004  mov edi, 3</text>

    <rect x="60" y="180" width="240" height="30" fill="#cfe3fb" stroke="#1565c0"/>
    <text x="70" y="200">0x0009  mov esi, 4</text>

    <rect x="60" y="210" width="240" height="30" fill="#f6c453" stroke="#b8860b" stroke-width="2.5"/>
    <text x="70" y="230">0x000E  call add</text>

    <rect x="60" y="240" width="240" height="30" fill="#cfe3fb" stroke="#1565c0"/>
    <text x="70" y="260">0x0013  mov [0x1234], eax</text>

    <rect x="60" y="270" width="240" height="30" fill="#eeeeee" stroke="#aaa" stroke-dasharray="3,3"/>
    <text x="70" y="290" fill="#999">0x0018~0x001F  （padding）</text>

    <rect x="60" y="300" width="240" height="30" fill="#e7d3f7" stroke="#7b1fa2"/>
    <text x="70" y="320">0x0020  push rbp</text>
  </g>

  <text x="180" y="360" text-anchor="middle" font-size="12" fill="#999">……（其餘指令略）</text>

  <!-- PC arrow pointing at current instruction -->
  <line x1="330" y1="225" x2="305" y2="225" stroke="#c0392b" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="335" y="220" font-size="12" fill="#c0392b" font-weight="bold">PC目前指向這裡</text>
  <text x="335" y="235" font-size="11" fill="#c0392b">（0x000E）</text>

  <!-- CPU box -->
  <rect x="500" y="90" width="560" height="440" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="780" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">CPU內部</text>
  <text x="780" y="136" text-anchor="middle" font-size="11.5" fill="#2e7d32">暫存器只有幾十個Byte，一次只放得下極少量東西</text>

  <!-- PC register -->
  <rect x="530" y="155" width="150" height="46" rx="8" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
  <text x="605" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">PC 程式計數器</text>
  <text x="605" y="191" text-anchor="middle" font-size="11" fill="#e65100">存的是「位址」0x000E</text>

  <!-- MAR -->
  <rect x="530" y="225" width="150" height="46" rx="8" fill="#d1e8ff" stroke="#1565c0" stroke-width="2"/>
  <text x="605" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">MAR 記憶體位址暫存器</text>
  <text x="605" y="261" text-anchor="middle" font-size="10.5" fill="#1565c0">①複製PC的位址過來</text>

  <!-- MDR -->
  <rect x="530" y="295" width="150" height="46" rx="8" fill="#d1e8ff" stroke="#1565c0" stroke-width="2"/>
  <text x="605" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">MDR 記憶體資料暫存器</text>
  <text x="605" y="331" text-anchor="middle" font-size="10.5" fill="#1565c0">③接住記憶體回傳的內容</text>

  <!-- IR -->
  <rect x="530" y="365" width="150" height="46" rx="8" fill="#f8d7da" stroke="#c0392b" stroke-width="2"/>
  <text x="605" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">IR 指令暫存器</text>
  <text x="605" y="401" text-anchor="middle" font-size="10.5" fill="#c0392b">④真正的指令內容放這裡</text>

  <!-- Control Unit -->
  <rect x="730" y="270" width="160" height="70" rx="8" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2"/>
  <text x="810" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#7b1fa2">Control Unit</text>
  <text x="810" y="314" text-anchor="middle" font-size="11" fill="#7b1fa2">解碼＋指揮ALU執行</text>
  <text x="810" y="329" text-anchor="middle" font-size="10.5" fill="#7b1fa2">（見CPU五大單元筆記）</text>

  <!-- ALU / general registers -->
  <rect x="730" y="365" width="160" height="46" rx="8" fill="#fff3a3" stroke="#8a6d00" stroke-width="2"/>
  <text x="810" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d00">ALU／通用暫存器</text>
  <text x="810" y="401" text-anchor="middle" font-size="10.5" fill="#8a6d00">真正做運算的地方</text>

  <!-- arrows: memory -> MAR (step1 conceptual: PC->MAR is internal, shown as loop) -->
  <path d="M 680 178 Q 700 178 700 200 Q 700 225 680 248" fill="none" stroke="#e65100" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="705" y="215" font-size="11" fill="#e65100">①PC→MAR</text>

  <!-- MAR -> memory (step2: read signal) -->
  <path d="M 530 248 Q 420 248 320 225" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowBlue)"/>
  <text x="380" y="245" font-size="11" fill="#1565c0">②CU發出讀取訊號到這個位址</text>

  <!-- memory -> MDR (step3: instruction bytes come back) -->
  <path d="M 300 225 Q 420 225 530 318" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="360" y="290" font-size="11" fill="#1565c0">③記憶體把`e8 0d 00 00 00`送回來</text>

  <!-- MDR -> IR (step4) -->
  <line x1="605" y1="341" x2="605" y2="365" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="612" y="356" font-size="11" fill="#c0392b">④搬進IR</text>

  <!-- IR -> CU (decode) -->
  <line x1="680" y1="388" x2="730" y2="325" stroke="#7b1fa2" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- CU -> ALU -->
  <line x1="810" y1="340" x2="810" y2="365" stroke="#7b1fa2" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- PC increments / jumps -->
  <rect x="900" y="155" width="150" height="60" rx="8" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
  <text x="975" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e65100">⑤PC更新</text>
  <text x="975" y="192" text-anchor="middle" font-size="10.5" fill="#e65100">一般：PC+1（指向下一條）</text>
  <text x="975" y="206" text-anchor="middle" font-size="10.5" fill="#e65100">但這裡是call：PC＝0x0020</text>
  <line x1="900" y1="178" x2="680" y2="178" stroke="#e65100" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>

  <!-- bottom note -->
  <rect x="40" y="545" width="1020" height="60" rx="8" fill="#fff8e1" stroke="#e0c36a"/>
  <text x="60" y="565" font-size="12.5" fill="#444">重點：暫存器（PC／MAR／MDR／IR）裝的是「位址」或「一條指令暫時的內容」，不是整支程式；每次fetch只搬一條指令進來，</text>
  <text x="60" y="583" font-size="12.5" fill="#444">讀完馬上decode／execute，然後PC移動到下一個位址（或因為call/ret被改成別的位址）——這正是本篇筆記(a)、追問五已經講過的執行順序機制的更底層版本。</text>

  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e65100"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7b1fa2"/></marker>
  </defs>
</svg>
