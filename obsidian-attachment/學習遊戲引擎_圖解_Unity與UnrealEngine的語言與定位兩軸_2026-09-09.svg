<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <rect width="760" height="470" fill="#fbfbfd"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2430">Unity 與 Unreal Engine：兩軸定位圖</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#6b7280">橫軸＝主要撰寫方式（純程式碼 ←→ 視覺化腳本）　縱軸＝預設畫質天花板</text>

  <!-- axes -->
  <line x1="90" y1="410" x2="700" y2="410" stroke="#9ca3af" stroke-width="2"/>
  <line x1="90" y1="410" x2="90" y2="90" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="700,410 690,405 690,415" fill="#9ca3af"/>
  <polygon points="90,90 85,100 95,100" fill="#9ca3af"/>
  <text x="700" y="434" text-anchor="end" font-size="13" fill="#6b7280">視覺化腳本比重高</text>
  <text x="112" y="104" font-size="13" fill="#6b7280">預設畫質天花板高</text>

  <!-- quadrant helper lines -->
  <line x1="395" y1="410" x2="395" y2="110" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="90" y1="255" x2="700" y2="255" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- Unity bubble -->
  <circle cx="240" cy="320" r="74" fill="#ADCCFF" fill-opacity="0.55" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="308" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">Unity</text>
  <text x="240" y="330" text-anchor="middle" font-size="13" fill="#1e3a8a">語言：C#</text>
  <text x="240" y="348" text-anchor="middle" font-size="13" fill="#1e3a8a">手遊／2D／獨立遊戲</text>

  <!-- Unreal bubble -->
  <circle cx="545" cy="185" r="86" fill="#D2B3FF" fill-opacity="0.55" stroke="#7c3aed" stroke-width="2"/>
  <text x="545" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#4c1d95">Unreal Engine（UE）</text>
  <text x="545" y="190" text-anchor="middle" font-size="13" fill="#4c1d95">語言：C++ ＋ Blueprints</text>
  <text x="545" y="208" text-anchor="middle" font-size="13" fill="#4c1d95">3A 大作／影視與建築渲染</text>

  <!-- callouts -->
  <rect x="90" y="120" width="270" height="86" rx="10" fill="#FFF3A3" fill-opacity="0.5" stroke="#eab308" stroke-width="1.5"/>
  <text x="104" y="144" font-size="13" font-weight="700" fill="#713f12">翻滾（Roll）要的是什麼</text>
  <text x="104" y="166" font-size="12.5" fill="#713f12">動畫狀態機（State Machine）決定「什麼時候切」，</text>
  <text x="104" y="184" font-size="12.5" fill="#713f12">物理／布娃娃（Ragdoll）決定「翻得像不像真的」。</text>

  <text x="380" y="452" text-anchor="middle" font-size="12" fill="#9ca3af">繪製於 2026-09-09　供 Abby-notes 使用</text>
</svg>
