<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <style>
    .term{fill:#1f2933}
    .box{fill:#ffffff;stroke:#5b6b7c;stroke-width:1.6}
    .proc{fill:#eef4fb;stroke:#4a6fa5;stroke-width:1.6}
    .dec{fill:#fff8e1;stroke:#c99a06;stroke-width:1.6}
    .ok{fill:#e8f8e8;stroke:#2e7d32;stroke-width:1.6}
    .no{fill:#ffeaef;stroke:#c2185b;stroke-width:1.6}
    t{}
    .t{font-size:14px;fill:#1f2933}
    .tb{font-size:15px;font-weight:700;fill:#12212e}
    .lbl{font-size:12.5px;fill:#5b6b7c}
    .cap{font-size:12px;fill:#7a8794}
    .ln{stroke:#5b6b7c;stroke-width:1.5;fill:none;marker-end:url(#ar)}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="24" y="30" class="tb" font-size="17">圖解：configurable 這把鎖，擋住哪幾條路（ISO 5807 流程圖符號）</text>
  <text x="24" y="50" class="cap">起止＝圓角框　處理＝矩形　判斷＝菱形　主軸圖：同主題後續追問請指回本圖的某個方框</text>

  <rect x="300" y="70" width="260" height="42" rx="21" class="box"/>
  <text x="430" y="96" class="tb" text-anchor="middle">你想對某個既有屬性動手</text>

  <path class="ln" d="M430,112 L430,146"/>

  <polygon points="430,146 620,196 430,246 240,196" class="dec"/>
  <text x="430" y="192" class="tb" text-anchor="middle">這個屬性的 configurable</text>
  <text x="430" y="212" class="t" text-anchor="middle">是不是 false ？</text>

  <text x="640" y="190" class="lbl">否（true）</text>
  <path class="ln" d="M620,196 L760,196 L760,300"/>
  <rect x="650" y="300" width="190" height="66" rx="8" class="ok"/>
  <text x="745" y="326" class="t" text-anchor="middle">想刪就刪</text>
  <text x="745" y="348" class="t" text-anchor="middle">想改設定就改</text>

  <text x="352" y="268" class="lbl">是（false）＝上鎖</text>
  <path class="ln" d="M430,246 L430,290"/>

  <rect x="255" y="290" width="350" height="40" rx="8" class="proc"/>
  <text x="430" y="316" class="tb" text-anchor="middle">引擎逐項檢查你要改的是哪一欄</text>

  <path class="ln" d="M330,330 L140,330 L140,388"/>
  <path class="ln" d="M430,330 L430,388"/>
  <path class="ln" d="M530,330 L720,330 L720,388"/>

  <rect x="30" y="388" width="220" height="96" rx="8" class="no"/>
  <text x="140" y="412" class="tb" text-anchor="middle">❌ 全部擋掉</text>
  <text x="140" y="434" class="t" text-anchor="middle">delete obj.a</text>
  <text x="140" y="454" class="t" text-anchor="middle">改 enumerable</text>
  <text x="140" y="474" class="t" text-anchor="middle">data ↔ accessor 互換</text>

  <rect x="310" y="388" width="240" height="96" rx="8" class="ok"/>
  <text x="430" y="412" class="tb" text-anchor="middle">⭕ 例外一：writable</text>
  <text x="430" y="434" class="t" text-anchor="middle">true → false 可以</text>
  <text x="430" y="456" class="t" text-anchor="middle">false → true 不行</text>
  <text x="430" y="476" class="cap" text-anchor="middle">只能往更嚴格的方向走</text>

  <rect x="610" y="388" width="220" height="96" rx="8" class="ok"/>
  <text x="720" y="412" class="tb" text-anchor="middle">⭕ 例外二：value</text>
  <text x="720" y="434" class="t" text-anchor="middle">只要 writable 還是 true</text>
  <text x="720" y="456" class="t" text-anchor="middle">obj.a = 20 照樣成功</text>
  <text x="720" y="476" class="cap" text-anchor="middle">鎖的是結構，不是值</text>

  <path class="ln" d="M140,484 L140,520 L430,520"/>
  <path class="ln" d="M430,484 L430,520"/>
  <path class="ln" d="M720,484 L720,520 L430,520"/>
  <path class="ln" d="M430,520 L430,548"/>

  <rect x="230" y="548" width="400" height="44" rx="22" class="box"/>
  <text x="430" y="568" class="tb" text-anchor="middle">一句話：configurable 鎖的是「屬性的結構與規則」</text>
  <text x="430" y="586" class="cap" text-anchor="middle">要鎖住「值」，要另外把 writable 設成 false</text>
</svg>
