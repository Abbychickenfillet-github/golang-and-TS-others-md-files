<svg xmlns="http://www.w3.org/2000/svg" width="980" height="960" viewBox="0 0 980 960" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="960" fill="#14161c"/>
  <text x="30" y="36" fill="#fff" font-size="19" font-weight="700">x86 八個通用暫存器：3-bit 編號、全名由來、與 Register-in-Opcode 編碼</text>
  <text x="30" y="58" fill="#9aa0ac" font-size="12">3 bits 不是從英文字母算出來的，只是 Intel 從 0～7 分配給這 8 個暫存器的固定編號（跟 hex 的 A-F 無關）。</text>

  <!-- video chronology timeline -->
  <rect x="30" y="68" width="920" height="60" rx="8" fill="#1e2129" stroke="#f472b6" stroke-width="1.5"/>
  <text x="46" y="84" fill="#f9a8d4" font-size="12" font-weight="700">📍 影片章節時間軸（依原影片公開章節＋妳截圖時間點排列，YouTube只公開這6個章節，非逐秒字幕）</text>
  <text x="46" y="102" fill="#9aa0ac" font-size="10.5" font-family="JetBrains Mono, Consolas, monospace">00:00 簡單C程式</text>
  <text x="185" y="102" fill="#9aa0ac" font-size="10.5" font-family="JetBrains Mono, Consolas, monospace">00:34 Stack概念介紹</text>
  <text x="345" y="102" fill="#fde68a" font-size="10.5" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">02:08 逐行講解程式 ← 本圖上半部對應</text>
  <text x="46" y="120" fill="#fdba74" font-size="10.5" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">03:44 Stack Frames（push rbp／call）← 本圖下半部對應</text>
  <text x="440" y="120" fill="#9aa0ac" font-size="10.5" font-family="JetBrains Mono, Consolas, monospace">10:09 Stack Overflow</text>
  <text x="620" y="120" fill="#9aa0ac" font-size="10.5" font-family="JetBrains Mono, Consolas, monospace">12:30 為何Stack上下顛倒（見12篇筆記）</text>

  <!-- register table -->
  <rect x="30" y="136" width="920" height="284" rx="8" fill="#1e2129" stroke="#333747"/>
  <text x="46" y="158" fill="#7dd3fc" font-size="13" font-weight="700">8 個通用暫存器對照表（16-bit ／ 32-bit ／ 64-bit 名稱都用同一組編號）　🕐 02:08 起</text>

  <!-- header row -->
  <text x="46" y="180" fill="#c7cad1" font-size="11" font-weight="700">編號</text>
  <text x="90" y="180" fill="#c7cad1" font-size="11" font-weight="700">16-bit</text>
  <text x="150" y="180" fill="#c7cad1" font-size="11" font-weight="700">32-bit</text>
  <text x="215" y="180" fill="#c7cad1" font-size="11" font-weight="700">64-bit</text>
  <text x="280" y="180" fill="#c7cad1" font-size="11" font-weight="700">英文全名</text>
  <text x="430" y="180" fill="#c7cad1" font-size="11" font-weight="700">歷史／現代用途</text>
  <line x1="46" y1="188" x2="946" y2="188" stroke="#333747"/>

  <!-- rows -->
  <text x="46" y="208" fill="#e5e7eb" font-size="11.5">0</text>
  <text x="90" y="208" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">AX</text>
  <text x="150" y="208" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">EAX</text>
  <text x="215" y="208" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">RAX</text>
  <text x="280" y="208" fill="#fde68a" font-size="11.5">Accumulator（累加器）</text>
  <text x="430" y="208" fill="#9aa0ac" font-size="11">算術結果慣例暫存處；呼叫慣例中＝函式回傳值</text>

  <text x="46" y="230" fill="#e5e7eb" font-size="11.5">1</text>
  <text x="90" y="230" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">CX</text>
  <text x="150" y="230" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">ECX</text>
  <text x="215" y="230" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">RCX</text>
  <text x="280" y="230" fill="#fde68a" font-size="11.5">Counter（計數器）</text>
  <text x="430" y="230" fill="#9aa0ac" font-size="11">迴圈／字串重複指令（REP）的計數器</text>

  <text x="46" y="252" fill="#e5e7eb" font-size="11.5">2</text>
  <text x="90" y="252" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">DX</text>
  <text x="150" y="252" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">EDX</text>
  <text x="215" y="252" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">RDX</text>
  <text x="280" y="252" fill="#fde68a" font-size="11.5">Data（資料）</text>
  <text x="430" y="252" fill="#9aa0ac" font-size="11">常搭配 EAX 做較大範圍的乘／除法運算</text>

  <text x="46" y="274" fill="#e5e7eb" font-size="11.5">3</text>
  <text x="90" y="274" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">BX</text>
  <text x="150" y="274" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">EBX</text>
  <text x="215" y="274" fill="#e5e7eb" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">RBX</text>
  <text x="280" y="274" fill="#fde68a" font-size="11.5">Base（基底）</text>
  <text x="430" y="274" fill="#9aa0ac" font-size="11">早期定址用基底暫存器，現代多當一般用途</text>

  <text x="46" y="296" fill="#fde68a" font-size="11.5" font-weight="700">4</text>
  <text x="90" y="296" fill="#fde68a" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">SP</text>
  <text x="150" y="296" fill="#fde68a" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">ESP</text>
  <text x="215" y="296" fill="#fde68a" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">RSP</text>
  <text x="280" y="296" fill="#fde68a" font-size="11.5" font-weight="700">Stack Pointer（堆疊指標）</text>
  <text x="430" y="296" fill="#c7cad1" font-size="11">指向目前 Stack 最上面（屋頂）——見 12 篇 (ii) 節</text>

  <text x="46" y="318" fill="#fdba74" font-size="11.5" font-weight="700">5</text>
  <text x="90" y="318" fill="#fdba74" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">BP</text>
  <text x="150" y="318" fill="#fdba74" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">EBP</text>
  <text x="215" y="318" fill="#fdba74" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">RBP</text>
  <text x="280" y="318" fill="#fdba74" font-size="11.5" font-weight="700">Base Pointer（基底指標）</text>
  <text x="430" y="318" fill="#c7cad1" font-size="11">指向目前 frame 起始位置（地板）——見 12 篇 (ii) 節</text>

  <text x="46" y="340" fill="#93c5fd" font-size="11.5" font-weight="700">6</text>
  <text x="90" y="340" fill="#93c5fd" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">SI</text>
  <text x="150" y="340" fill="#93c5fd" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">ESI</text>
  <text x="215" y="340" fill="#93c5fd" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">RSI</text>
  <text x="280" y="340" fill="#93c5fd" font-size="11.5" font-weight="700">Source Index（來源索引）</text>
  <text x="430" y="340" fill="#c7cad1" font-size="11">舊：字串搬移指令的來源位址；現代呼叫慣例＝第2個參數</text>

  <text x="46" y="362" fill="#93c5fd" font-size="11.5" font-weight="700">7</text>
  <text x="90" y="362" fill="#93c5fd" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">DI</text>
  <text x="150" y="362" fill="#93c5fd" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">EDI</text>
  <text x="215" y="362" fill="#93c5fd" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">RDI</text>
  <text x="280" y="362" fill="#93c5fd" font-size="11.5" font-weight="700">Destination Index（目的索引）</text>
  <text x="430" y="362" fill="#c7cad1" font-size="11">舊：字串搬移指令的目的位址；現代呼叫慣例＝第1個參數</text>

  <text x="46" y="392" fill="#9aa0ac" font-size="11">⚠️ x86-64（AMD64）把這 8 個都加上 R 字首（RAX…RDI），並新增 R8～R15 共 8 個，總共 16 個通用暫存器，</text>
  <text x="46" y="408" fill="#9aa0ac" font-size="11">需要 4 bits 才能編完（多出的 1 bit 靠 REX 前綴補），但下面的「+rd」老式編碼技巧，是這張圖聚焦的原始 8 個、3-bit 版本。</text>

  <!-- opcode formula -->
  <rect x="30" y="436" width="920" height="110" rx="8" fill="#1e2129" stroke="#4ade80" stroke-width="1.5"/>
  <text x="46" y="458" fill="#86efac" font-size="13" font-weight="700">Register-in-Opcode（+rd）公式：真正的 opcode ＝ 基底 opcode ＋ 暫存器編號　🕐 02:08–03:44</text>
  <text x="46" y="480" fill="#e5e7eb" font-size="13" font-family="JetBrains Mono, Consolas, monospace">最終 opcode（十六進位）＝ 基底 opcode ＋ 暫存器編號（0～7，十進位相加）</text>
  <text x="46" y="502" fill="#c7cad1" font-size="11">「+rd」是 Intel 手冊記法，意思是「把 0～7 的暫存器編號，加到左邊這個 hex 基底 byte 上，組成最終唯一的 opcode byte」。</text>
  <text x="46" y="520" fill="#c7cad1" font-size="11">imm32＝32-bit immediate（32-bit 立即值，直接寫死在指令裡的數字本身，不是從暫存器或記憶體讀來的）。</text>
  <text x="46" y="538" fill="#6b7280" font-size="10">出處：Intel® 64 and IA-32 Architectures SDM, Vol.2（Instruction Set Reference）MOV／PUSH 條目；felixcloutier.com/x86/mov、c-jump.com 對「+rd」記法的整理。</text>

  <!-- worked examples table -->
  <rect x="30" y="560" width="920" height="188" rx="8" fill="#1e2129" stroke="#333747"/>
  <text x="46" y="582" fill="#7dd3fc" font-size="13" font-weight="700">三種常見指令家族的基底 opcode，套用到你截圖裡的三個實例　🕐 02:08–04:34</text>
  <text x="46" y="602" fill="#c7cad1" font-size="11" font-weight="700">暫存器</text>
  <text x="140" y="602" fill="#c7cad1" font-size="11" font-weight="700">mov r32,imm32（基底 B8）</text>
  <text x="360" y="602" fill="#c7cad1" font-size="11" font-weight="700">push r64（基底 50）</text>
  <text x="540" y="602" fill="#c7cad1" font-size="11" font-weight="700">pop r64（基底 58）</text>
  <text x="700" y="602" fill="#c7cad1" font-size="11" font-weight="700">你截圖裡對到的實例</text>
  <line x1="46" y1="610" x2="946" y2="610" stroke="#333747"/>

  <text x="46" y="632" fill="#e5e7eb" font-size="11.5">EDI（7）</text>
  <text x="140" y="632" fill="#4ade80" font-size="11.5" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">B8+7 = BF</text>
  <text x="360" y="632" fill="#9aa0ac" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">50+7 = 57</text>
  <text x="540" y="632" fill="#9aa0ac" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">58+7 = 5F</text>
  <text x="700" y="632" fill="#fde68a" font-size="11">mov edi,3 → bf 03 00 00 00</text>

  <text x="46" y="654" fill="#e5e7eb" font-size="11.5">ESI（6）</text>
  <text x="140" y="654" fill="#4ade80" font-size="11.5" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">B8+6 = BE</text>
  <text x="360" y="654" fill="#9aa0ac" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">50+6 = 56</text>
  <text x="540" y="654" fill="#9aa0ac" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">58+6 = 5E</text>
  <text x="700" y="654" fill="#fde68a" font-size="11">mov esi,4 → be 04 00 00 00</text>

  <text x="46" y="676" fill="#e5e7eb" font-size="11.5">EBP（5）</text>
  <text x="140" y="676" fill="#9aa0ac" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">B8+5 = BD</text>
  <text x="360" y="676" fill="#4ade80" font-size="11.5" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">50+5 = 55</text>
  <text x="540" y="676" fill="#9aa0ac" font-size="11.5" font-family="JetBrains Mono, Consolas, monospace">58+5 = 5D</text>
  <text x="700" y="676" fill="#fde68a" font-size="11">push rbp → 55</text>

  <text x="46" y="706" fill="#9aa0ac" font-size="11">e8（call rel32）不是 +rd 家族：CALL 的目標是「32-bit 相對位移」而非某個暫存器，所以 e8 是單一固定 opcode，</text>
  <text x="46" y="722" fill="#9aa0ac" font-size="11">後面直接接 4-byte 位移量，總長一樣是 5 bytes（1 opcode + 4 位移）——這就是為何 0x000E + 5 = 0x0013。　🕐 約02:00, 04:12–04:34（妳的截圖）</text>
  <text x="46" y="740" fill="#6b7280" font-size="10">出處：felixcloutier.com/x86/call（CALL — E8 cd，Call near, relative）。</text>

  <!-- little-endian illustration -->
  <rect x="30" y="762" width="920" height="130" rx="8" fill="#1e2129" stroke="#f97316" stroke-width="1.5"/>
  <text x="46" y="784" fill="#fdba74" font-size="13" font-weight="700">little-endian：imm32 的數值 3，怎麼變成「03 00 00 00」四個 byte？　🕐 02:08–03:44</text>
  <text x="46" y="804" fill="#c7cad1" font-size="11">數值 3 的完整 32-bit 表示法是 0x00000003；little-endian 規定「最小位（least significant byte）放最前面」：</text>

  <rect x="60" y="818" width="80" height="30" fill="#7c2d12" stroke="#fdba74"/>
  <text x="100" y="838" fill="#fff7ed" font-size="12" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">03</text>
  <rect x="150" y="818" width="80" height="30" fill="#3a3f4c" stroke="#6b7280"/>
  <text x="190" y="838" fill="#c7cad1" font-size="12" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">00</text>
  <rect x="240" y="818" width="80" height="30" fill="#3a3f4c" stroke="#6b7280"/>
  <text x="280" y="838" fill="#c7cad1" font-size="12" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">00</text>
  <rect x="330" y="818" width="80" height="30" fill="#3a3f4c" stroke="#6b7280"/>
  <text x="370" y="838" fill="#c7cad1" font-size="12" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">00</text>
  <text x="100" y="862" fill="#fdba74" font-size="10" text-anchor="middle">最小位元組（先存）</text>
  <text x="280" y="862" fill="#6b7280" font-size="10" text-anchor="middle">高位補零（後存）</text>

  <text x="460" y="838" fill="#9aa0ac" font-size="11">← 排列順序＝記憶體位址由小到大；x86 是 little-endian 架構，大端序（big-endian）則相反。</text>
  <text x="46" y="882" fill="#6b7280" font-size="10">出處：Intel SDM 對 byte ordering 的說明；一般教材通稱 x86／x86-64 為 little-endian。</text>
</svg>
