<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
  <title>Event Loop ＝ Coordinator（協調者）：盯著 Call Stack，空了才從佇列剷一個任務放上去</title>
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#be123c"/></marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker>
  <marker id="arrOr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
  </defs>
  <rect x="2" y="2" width="956" height="388" rx="16" fill="#fffaf0" stroke="#e0b062" stroke-width="2"/>
  <text x="480" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#7a3e00">Coordinator（協調者）— 一個工作極單純的排班機制</text>

  <!-- 左：任務佇列 -->
  <text x="152" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#333">任務佇列（排隊中）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="200" width="112" height="28" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><text x="86" y="219" fill="#14532d">queueMicrotask</text>
    <rect x="30" y="168" width="112" height="28" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><text x="86" y="187" fill="#14532d">Promise.then</text>
    <rect x="30" y="136" width="112" height="28" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><text x="86" y="155" fill="#14532d">Promise.then</text>
    <text x="86" y="248" font-size="13" font-weight="700" fill="#14532d">微任務佇列</text>
    <text x="86" y="264" font-size="11" fill="#555">（全部清光）</text>

    <rect x="162" y="200" width="112" height="28" rx="6" fill="#fecdd3" stroke="#be123c" stroke-width="2"/><text x="218" y="219" fill="#881337">I/O 完成</text>
    <rect x="162" y="168" width="112" height="28" rx="6" fill="#fecdd3" stroke="#be123c" stroke-width="2"/><text x="218" y="187" fill="#881337">click</text>
    <text x="218" y="248" font-size="13" font-weight="700" fill="#881337">巨任務佇列</text>
    <text x="218" y="264" font-size="11" fill="#555">（一次只取一個）</text>
  </g>

  <!-- 被剷起來的任務（放在鏟子上） -->
  <rect x="250" y="134" width="106" height="28" rx="6" fill="#fecdd3" stroke="#be123c" stroke-width="2"/>
  <text x="303" y="153" text-anchor="middle" font-size="12" fill="#881337">setTimeout</text>
  <rect x="244" y="164" width="124" height="7" rx="3" fill="#9ca3af" stroke="#444" stroke-width="1.5"/>

  <!-- 協調者（Event Loop）：臉、眼睛看向右邊的 Call Stack -->
  <circle cx="450" cy="120" r="34" fill="#ffe8c7" stroke="#444" stroke-width="2.5"/>
  <ellipse cx="438" cy="114" rx="8" ry="9" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <ellipse cx="462" cy="114" rx="8" ry="9" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <circle cx="442" cy="115" r="4" fill="#111"/><circle cx="466" cy="115" r="4" fill="#111"/>
  <path d="M439 133 Q450 141 461 133" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round"/>
  <rect x="418" y="156" width="64" height="72" rx="12" fill="#4f6ef7" stroke="#2a3fa8" stroke-width="2.5"/>
  <text x="450" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Event</text>
  <text x="450" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Loop</text>
  <text x="450" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#2a3fa8">協調者（排班員）</text>
  <text x="450" y="266" text-anchor="middle" font-size="11" fill="#555">自己不執行任何 JS</text>

  <!-- 假手：從身體伸向左邊，握著鏟子把任務剷起來 -->
  <line x1="420" y1="172" x2="378" y2="170" stroke="#444" stroke-width="8" stroke-linecap="round"/>
  <circle cx="372" cy="169" r="13" fill="#fff" stroke="#444" stroke-width="2.5"/>
  <circle cx="365" cy="163" r="4" fill="#fff" stroke="#444" stroke-width="1.5"/><circle cx="371" cy="160" r="4" fill="#fff" stroke="#444" stroke-width="1.5"/><circle cx="377" cy="161" r="4" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="372" y="198" text-anchor="middle" font-size="11" fill="#444">假手：剷起來</text>

  <!-- 紅色弧線：把任務從左邊剷起來，往右邊放進 Call Stack -->
  <path d="M330 130 C 420 30, 660 14, 775 50" fill="none" stroke="#be123c" stroke-width="3.5" stroke-dasharray="9 6" marker-end="url(#arrRed)"/>
  <text x="600" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#be123c">剷一個任務 → 放進 Call Stack</text>

  <!-- 藍色虛線：眼睛盯著 Call Stack -->
  <line x1="476" y1="116" x2="688" y2="150" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="3 6" marker-end="url(#arrBlue)"/>
  <text x="592" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">盯著：Stack 空了嗎？</text>

  <!-- 右：Call Stack（開口朝上、底部封閉） -->
  <rect x="700" y="92" width="150" height="140" fill="#eef2ff"/>
  <path d="M700 92 V232 H850 V92" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round"/>
  <rect x="738" y="60" width="74" height="22" rx="5" fill="#fecdd3" stroke="#be123c" stroke-width="2"/>
  <text x="775" y="76" text-anchor="middle" font-size="12" fill="#881337">setTimeout</text>
  <text x="775" y="112" text-anchor="middle" font-size="11" fill="#64748b">開口</text>
  <rect x="712" y="196" width="126" height="26" rx="5" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="775" y="172" text-anchor="middle" font-size="14" fill="#475569">（目前是空的）</text>
  <text x="775" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Call Stack</text>
  <text x="775" y="269" text-anchor="middle" font-size="11" fill="#555">空了才輪到下一個任務上來</text>

  <text x="480" y="376" text-anchor="middle" font-size="13" fill="#444">只做一件事：看 Call Stack 清空了沒 → 空了才從佇列剷一個任務放上去（微任務先全部清光，再取一個巨任務）</text>
  <!-- Web APIs：瀏覽器提供，在 JS 引擎之外計時、等待，完成後把 callback 放進佇列 -->
  <rect x="30" y="296" width="300" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="180" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Web APIs（瀏覽器提供，不是 JS 引擎）</text>
  <text x="180" y="338" text-anchor="middle" font-size="11" fill="#7c2d12">在引擎外計時、等待；完成後把 callback 放進上方佇列</text>
  <line x1="86" y1="294" x2="86" y2="272" stroke="#ea580c" stroke-width="3" marker-end="url(#arrOr)"/>
  <line x1="218" y1="294" x2="218" y2="272" stroke="#ea580c" stroke-width="3" marker-end="url(#arrOr)"/>
  <path d="M775 278 V324 H334" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrOr)"/>
  <text x="560" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Call Stack 呼叫 setTimeout／fetch → 交給 Web APIs 去等</text>
</svg>
