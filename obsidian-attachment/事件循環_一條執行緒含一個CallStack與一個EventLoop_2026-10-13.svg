<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
  <title>一條執行緒 ＝ Call Stack ＋ Heap ＋ Event Loop；Web APIs 由瀏覽器提供，負責計時與等待，完成後把 callback 放進佇列</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#be123c"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
  </defs>
  <rect x="2" y="2" width="956" height="466" rx="16" fill="#fffdf7" stroke="#d6c28a" stroke-width="2"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#7a3e00">一條執行緒（Thread）＝ Call Stack ＋ Heap ＋ Event Loop；Web APIs 在引擎外幫忙等待</text>

  <rect x="12" y="42" width="304" height="258" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 5"/>
  <text x="164" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">主執行緒 Main Thread（網頁 JS）</text>
  <rect x="26" y="96" width="70" height="146" fill="#eef2ff"/>
  <path d="M26 96 V242 H96 V96" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="32" y="184" width="58" height="22" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/><text x="61" y="199" text-anchor="middle" font-size="10.5" fill="#78350f">foo()</text>
  <rect x="32" y="210" width="58" height="22" rx="4" fill="#fcd34d" stroke="#b45309" stroke-width="1.4"/><text x="61" y="225" text-anchor="middle" font-size="10.5" fill="#78350f">main()</text>
  <text x="61" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Call Stack</text>
  <circle cx="164" cy="164" r="27" fill="#fff" stroke="#4f6ef7" stroke-width="6"/>
  <text x="164" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#2a3fa8">Event</text>
  <text x="164" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#2a3fa8">Loop</text>
  <text x="164" y="214" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2a3fa8">Event Loop</text>
  <rect x="116" y="232" width="96" height="56" rx="8" fill="#ecfccb" stroke="#4d7c0f" stroke-width="2"/>
  <text x="164" y="250" text-anchor="middle" font-size="11.5" font-weight="700" fill="#365314">Heap（物件）</text>
  <rect x="126" y="260" width="18" height="18" rx="4" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5"/>
  <rect x="155" y="260" width="18" height="18" rx="4" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5"/>
  <rect x="184" y="260" width="18" height="18" rx="4" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5"/>
  <g font-size="10.5" text-anchor="middle">
    <text x="266" y="92" font-weight="700" fill="#14532d">微任務佇列</text>
    <rect x="226" y="98" width="80" height="20" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/><text x="266" y="112" fill="#14532d">.then</text>
    <rect x="226" y="122" width="80" height="20" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/><text x="266" y="136" fill="#14532d">.then</text>
    <text x="266" y="176" font-weight="700" fill="#881337">巨任務佇列</text>
    <rect x="226" y="182" width="80" height="20" rx="4" fill="#fecdd3" stroke="#be123c" stroke-width="1.6"/><text x="266" y="196" fill="#881337">setTimeout</text>
    <rect x="226" y="206" width="80" height="20" rx="4" fill="#fecdd3" stroke="#be123c" stroke-width="1.6"/><text x="266" y="220" fill="#881337">message</text>
  </g>
  <line x1="223" y1="164" x2="197" y2="164" stroke="#be123c" stroke-width="2.6" marker-end="url(#a)"/>
  <line x1="131" y1="164" x2="102" y2="164" stroke="#be123c" stroke-width="2.6" marker-end="url(#a)"/>
  <text x="116" y="127" text-anchor="middle" font-size="9.5" fill="#be123c">空了才放</text>
  <line x1="61" y1="272" x2="61" y2="316" stroke="#ea580c" stroke-width="2.6" marker-end="url(#o)"/>
  <line x1="266" y1="318" x2="266" y2="246" stroke="#ea580c" stroke-width="2.6" marker-end="url(#o)"/>


  <rect x="328" y="42" width="304" height="258" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 5"/>
  <text x="480" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">Dedicated Worker / Web Worker（專用）</text>
  <rect x="342" y="96" width="70" height="146" fill="#eef2ff"/>
  <path d="M342 96 V242 H412 V96" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="348" y="184" width="58" height="22" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/><text x="377" y="199" text-anchor="middle" font-size="10.5" fill="#78350f">foo()</text>
  <rect x="348" y="210" width="58" height="22" rx="4" fill="#fcd34d" stroke="#b45309" stroke-width="1.4"/><text x="377" y="225" text-anchor="middle" font-size="10.5" fill="#78350f">main()</text>
  <text x="377" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Call Stack</text>
  <circle cx="480" cy="164" r="27" fill="#fff" stroke="#4f6ef7" stroke-width="6"/>
  <text x="480" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#2a3fa8">Event</text>
  <text x="480" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#2a3fa8">Loop</text>
  <text x="480" y="214" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2a3fa8">Event Loop</text>
  <rect x="432" y="232" width="96" height="56" rx="8" fill="#ecfccb" stroke="#4d7c0f" stroke-width="2"/>
  <text x="480" y="250" text-anchor="middle" font-size="11.5" font-weight="700" fill="#365314">Heap（物件）</text>
  <rect x="442" y="260" width="18" height="18" rx="4" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5"/>
  <rect x="471" y="260" width="18" height="18" rx="4" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5"/>
  <rect x="500" y="260" width="18" height="18" rx="4" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5"/>
  <g font-size="10.5" text-anchor="middle">
    <text x="582" y="92" font-weight="700" fill="#14532d">微任務佇列</text>
    <rect x="542" y="98" width="80" height="20" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/><text x="582" y="112" fill="#14532d">.then</text>
    <rect x="542" y="122" width="80" height="20" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/><text x="582" y="136" fill="#14532d">.then</text>
    <text x="582" y="176" font-weight="700" fill="#881337">巨任務佇列</text>
    <rect x="542" y="182" width="80" height="20" rx="4" fill="#fecdd3" stroke="#be123c" stroke-width="1.6"/><text x="582" y="196" fill="#881337">setTimeout</text>
    <rect x="542" y="206" width="80" height="20" rx="4" fill="#fecdd3" stroke="#be123c" stroke-width="1.6"/><text x="582" y="220" fill="#881337">message</text>
  </g>
  <line x1="539" y1="164" x2="513" y2="164" stroke="#be123c" stroke-width="2.6" marker-end="url(#a)"/>
  <line x1="447" y1="164" x2="418" y2="164" stroke="#be123c" stroke-width="2.6" marker-end="url(#a)"/>
  <text x="432" y="127" text-anchor="middle" font-size="9.5" fill="#be123c">空了才放</text>
  <line x1="377" y1="272" x2="377" y2="316" stroke="#ea580c" stroke-width="2.6" marker-end="url(#o)"/>
  <line x1="582" y1="318" x2="582" y2="246" stroke="#ea580c" stroke-width="2.6" marker-end="url(#o)"/>


  <rect x="644" y="42" width="304" height="258" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" stroke-dasharray="9 5"/>
  <text x="796" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Service Worker（網路代理，自己一組）</text>
  <rect x="658" y="96" width="70" height="146" fill="#eef2ff"/>
  <path d="M658 96 V242 H728 V96" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="664" y="184" width="58" height="22" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/><text x="693" y="199" text-anchor="middle" font-size="10.5" fill="#78350f">foo()</text>
  <rect x="664" y="210" width="58" height="22" rx="4" fill="#fcd34d" stroke="#b45309" stroke-width="1.4"/><text x="693" y="225" text-anchor="middle" font-size="10.5" fill="#78350f">main()</text>
  <text x="693" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Call Stack</text>
  <circle cx="796" cy="164" r="27" fill="#fff" stroke="#4f6ef7" stroke-width="6"/>
  <text x="796" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#2a3fa8">Event</text>
  <text x="796" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#2a3fa8">Loop</text>
  <text x="796" y="214" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2a3fa8">Event Loop</text>
  <rect x="748" y="232" width="96" height="56" rx="8" fill="#ecfccb" stroke="#4d7c0f" stroke-width="2"/>
  <text x="796" y="250" text-anchor="middle" font-size="11.5" font-weight="700" fill="#365314">Heap（物件）</text>
  <rect x="758" y="260" width="18" height="18" rx="4" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5"/>
  <rect x="787" y="260" width="18" height="18" rx="4" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5"/>
  <rect x="816" y="260" width="18" height="18" rx="4" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5"/>
  <g font-size="10.5" text-anchor="middle">
    <text x="898" y="92" font-weight="700" fill="#14532d">微任務佇列</text>
    <rect x="858" y="98" width="80" height="20" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/><text x="898" y="112" fill="#14532d">.then</text>
    <rect x="858" y="122" width="80" height="20" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/><text x="898" y="136" fill="#14532d">.then</text>
    <text x="898" y="176" font-weight="700" fill="#881337">巨任務佇列</text>
    <rect x="858" y="182" width="80" height="20" rx="4" fill="#fecdd3" stroke="#be123c" stroke-width="1.6"/><text x="898" y="196" fill="#881337">setTimeout</text>
    <rect x="858" y="206" width="80" height="20" rx="4" fill="#fecdd3" stroke="#be123c" stroke-width="1.6"/><text x="898" y="220" fill="#881337">message</text>
  </g>
  <line x1="855" y1="164" x2="829" y2="164" stroke="#be123c" stroke-width="2.6" marker-end="url(#a)"/>
  <line x1="763" y1="164" x2="734" y2="164" stroke="#be123c" stroke-width="2.6" marker-end="url(#a)"/>
  <text x="748" y="127" text-anchor="middle" font-size="9.5" fill="#be123c">空了才放</text>
  <line x1="693" y1="272" x2="693" y2="316" stroke="#ea580c" stroke-width="2.6" marker-end="url(#o)"/>
  <line x1="898" y1="318" x2="898" y2="246" stroke="#ea580c" stroke-width="2.6" marker-end="url(#o)"/>


  <rect x="12" y="318" width="936" height="62" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="480" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Web APIs（瀏覽器提供，不是 JS 引擎的一部分）：setTimeout／fetch／DOM 事件／postMessage …</text>
  <text x="480" y="364" text-anchor="middle" font-size="12" fill="#7c2d12">由瀏覽器內部的執行緒負責計時、等待網路；完成後把 callback 放進對應執行緒的佇列（向下箭頭＝呼叫它，向上箭頭＝完成後放回佇列）</text>

  <text x="480" y="408" text-anchor="middle" font-size="12.5" fill="#444">三條 JS 執行緒各有自己的 Call Stack、Heap、Event Loop，彼此不共用；只靠 postMessage 傳訊息，資料是複製、不是共用</text>
  <text x="480" y="430" text-anchor="middle" font-size="12.5" fill="#444">收到的訊息會變成對方 Event Loop 裡的一個巨任務；Service Worker 專門攔截網路請求（離線快取、推播），沒有 DOM；Worker 沒有畫面渲染</text>
  <text x="480" y="452" text-anchor="middle" font-size="11.5" fill="#777">（Web Worker 廣義包含三種，狹義就是 Dedicated Worker；Service Worker 是另一種，不是同一個東西；Shared Worker 多頁共用，圖中省略）</text>
</svg>
