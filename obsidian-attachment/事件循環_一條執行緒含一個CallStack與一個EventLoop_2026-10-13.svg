<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
  <title>一條執行緒 ＝ 一個 Call Stack ＋ 一個 Event Loop；多一條執行緒就多一組，彼此只靠 postMessage 傳訊息</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#be123c"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
  </defs>
  <rect x="2" y="2" width="956" height="368" rx="16" fill="#fffdf7" stroke="#d6c28a" stroke-width="2"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#7a3e00">一條執行緒（Thread）＝ 一個 Call Stack ＋ 一個 Event Loop</text>

  <rect x="20" y="48" width="450" height="252" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 5"/>
  <text x="245" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">主執行緒 Main Thread（跑你的網頁 JS）</text>

  <!-- Call Stack -->
  <rect x="45" y="108" width="100" height="152" fill="#eef2ff"/>
  <path d="M45 108 V260 H145 V108" fill="none" stroke="#1e293b" stroke-width="4" stroke-linejoin="round"/>
  <rect x="55" y="204" width="80" height="22" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><text x="95" y="220" text-anchor="middle" font-size="11" fill="#78350f">foo()</text>
  <rect x="55" y="230" width="80" height="22" rx="4" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/><text x="95" y="246" text-anchor="middle" font-size="11" fill="#78350f">main()</text>
  <text x="95" y="125" text-anchor="middle" font-size="11" fill="#64748b">開口</text>
  <text x="95" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Call Stack（1 個）</text>

  <!-- Event Loop -->
  <circle cx="260" cy="184" r="38" fill="#fff" stroke="#4f6ef7" stroke-width="7"/>
  <path d="M290 150 l12 -2 l-4 12 z" fill="#4f6ef7" stroke="#4f6ef7" stroke-width="2" stroke-linejoin="round"/>
  <text x="260" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#2a3fa8">Event</text>
  <text x="260" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#2a3fa8">Loop</text>
  <text x="260" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#2a3fa8">Event Loop（1 個）</text>

  <!-- 佇列 -->
  <g font-size="11" text-anchor="middle">
    <text x="407" y="104" font-size="12" font-weight="700" fill="#14532d">微任務佇列</text>
    <rect x="359" y="112" width="96" height="22" rx="5" fill="#bbf7d0" stroke="#15803d" stroke-width="1.8"/><text x="407" y="127" fill="#14532d">Promise.then</text>
    <rect x="359" y="138" width="96" height="22" rx="5" fill="#bbf7d0" stroke="#15803d" stroke-width="1.8"/><text x="407" y="153" fill="#14532d">Promise.then</text>
    <text x="407" y="190" font-size="12" font-weight="700" fill="#881337">巨任務佇列</text>
    <rect x="359" y="198" width="96" height="22" rx="5" fill="#fecdd3" stroke="#be123c" stroke-width="1.8"/><text x="407" y="213" fill="#881337">setTimeout</text>
    <rect x="359" y="224" width="96" height="22" rx="5" fill="#fecdd3" stroke="#be123c" stroke-width="1.8"/><text x="407" y="239" fill="#881337">click</text>
  </g>

  <!-- 箭頭：佇列 → Event Loop → Call Stack -->
  <line x1="355" y1="184" x2="306" y2="184" stroke="#be123c" stroke-width="3" marker-end="url(#a)"/>
  <line x1="214" y1="184" x2="153" y2="184" stroke="#be123c" stroke-width="3" marker-end="url(#a)"/>
  <text x="184" y="172" text-anchor="middle" font-size="10.5" fill="#be123c">空了才放</text>
  <text x="184" y="214" text-anchor="middle" font-size="10.5" fill="#be123c">一個進去</text>


  <rect x="490" y="48" width="450" height="252" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 5"/>
  <text x="715" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Web Worker 執行緒（另一條，自己一組）</text>

  <!-- Call Stack -->
  <rect x="515" y="108" width="100" height="152" fill="#eef2ff"/>
  <path d="M515 108 V260 H615 V108" fill="none" stroke="#1e293b" stroke-width="4" stroke-linejoin="round"/>
  <rect x="525" y="204" width="80" height="22" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><text x="565" y="220" text-anchor="middle" font-size="11" fill="#78350f">foo()</text>
  <rect x="525" y="230" width="80" height="22" rx="4" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/><text x="565" y="246" text-anchor="middle" font-size="11" fill="#78350f">main()</text>
  <text x="565" y="125" text-anchor="middle" font-size="11" fill="#64748b">開口</text>
  <text x="565" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Call Stack（1 個）</text>

  <!-- Event Loop -->
  <circle cx="730" cy="184" r="38" fill="#fff" stroke="#4f6ef7" stroke-width="7"/>
  <path d="M760 150 l12 -2 l-4 12 z" fill="#4f6ef7" stroke="#4f6ef7" stroke-width="2" stroke-linejoin="round"/>
  <text x="730" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#2a3fa8">Event</text>
  <text x="730" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#2a3fa8">Loop</text>
  <text x="730" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#2a3fa8">Event Loop（1 個）</text>

  <!-- 佇列 -->
  <g font-size="11" text-anchor="middle">
    <text x="877" y="104" font-size="12" font-weight="700" fill="#14532d">微任務佇列</text>
    <rect x="829" y="112" width="96" height="22" rx="5" fill="#bbf7d0" stroke="#15803d" stroke-width="1.8"/><text x="877" y="127" fill="#14532d">Promise.then</text>
    <rect x="829" y="138" width="96" height="22" rx="5" fill="#bbf7d0" stroke="#15803d" stroke-width="1.8"/><text x="877" y="153" fill="#14532d">Promise.then</text>
    <text x="877" y="190" font-size="12" font-weight="700" fill="#881337">巨任務佇列</text>
    <rect x="829" y="198" width="96" height="22" rx="5" fill="#fecdd3" stroke="#be123c" stroke-width="1.8"/><text x="877" y="213" fill="#881337">setTimeout</text>
    <rect x="829" y="224" width="96" height="22" rx="5" fill="#fecdd3" stroke="#be123c" stroke-width="1.8"/><text x="877" y="239" fill="#881337">click</text>
  </g>

  <!-- 箭頭：佇列 → Event Loop → Call Stack -->
  <line x1="825" y1="184" x2="776" y2="184" stroke="#be123c" stroke-width="3" marker-end="url(#a)"/>
  <line x1="684" y1="184" x2="623" y2="184" stroke="#be123c" stroke-width="3" marker-end="url(#a)"/>
  <text x="654" y="172" text-anchor="middle" font-size="10.5" fill="#be123c">空了才放</text>
  <text x="654" y="214" text-anchor="middle" font-size="10.5" fill="#be123c">一個進去</text>

  <!-- 兩條執行緒之間：只傳訊息，不共用 Call Stack -->
  <line x1="300" y1="326" x2="660" y2="326" stroke="#0f766e" stroke-width="3.5" marker-start="url(#m)" marker-end="url(#m)"/>
  <text x="480" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">postMessage（只傳訊息）</text>
  <text x="480" y="350" text-anchor="middle" font-size="12.5" fill="#444">各自有自己的 Call Stack 與 Event Loop，不共用；收到的訊息會變成對方 Event Loop 裡的一個巨任務</text>
</svg>
