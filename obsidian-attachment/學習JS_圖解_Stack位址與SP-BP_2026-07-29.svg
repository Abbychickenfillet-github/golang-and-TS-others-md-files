<svg xmlns="http://www.w3.org/2000/svg" width="920" height="850" viewBox="0 0 920 850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5b301"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="850" fill="#14161c"/>
  <text x="30" y="36" fill="#fff" font-size="19" font-weight="700">組合語言視角：Stack 的記憶體位址、Stack Pointer 與 Base Pointer</text>
  <text x="30" y="58" fill="#9aa0ac" font-size="12">位址一律用 16 進位（hex）表示——每個 hex 位數剛好對應 4 個 bit，比又長又難讀的 binary 位址精簡許多，這是業界通用寫法，不是 JS 專屬的規則。</text>

  <!-- code reference -->
  <rect x="30" y="76" width="190" height="150" rx="8" fill="#1e2129" stroke="#333747"/>
  <text x="46" y="98" fill="#7dd3fc" font-size="12" font-family="JetBrains Mono, Consolas, monospace">function add(a, b) {</text>
  <text x="46" y="118" fill="#e5e7eb" font-size="12" font-family="JetBrains Mono, Consolas, monospace">  const sum = a + b;</text>
  <text x="46" y="138" fill="#e5e7eb" font-size="12" font-family="JetBrains Mono, Consolas, monospace">  return sum;</text>
  <text x="46" y="158" fill="#7dd3fc" font-size="12" font-family="JetBrains Mono, Consolas, monospace">}</text>
  <text x="46" y="178" fill="#7dd3fc" font-size="12" font-family="JetBrains Mono, Consolas, monospace">add(3, 4);</text>
  <text x="46" y="204" fill="#6b7280" font-size="11">右圖是 add(3,4) 執行到</text>
  <text x="46" y="220" fill="#6b7280" font-size="11">「return sum;」的 Stack 快照。</text>

  <!-- legend -->
  <rect x="30" y="236" width="14" height="14" fill="#6b7280"/>
  <text x="50" y="248" fill="#c7cad1" font-size="11">未使用（還沒被 push 過）</text>
  <rect x="30" y="258" width="14" height="14" fill="#2563eb"/>
  <text x="50" y="270" fill="#c7cad1" font-size="11">目前這個 add() frame 使用中</text>
  <rect x="30" y="280" width="14" height="14" fill="#7c3aed"/>
  <text x="50" y="292" fill="#c7cad1" font-size="11">呼叫者 main() 的 frame</text>

  <!-- memory column -->
  <text x="560" y="98" fill="#6b7280" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFF0</text>
  <rect x="620" y="86" width="270" height="26" fill="#2a2e38" stroke="#3a3f4c"/>
  <text x="630" y="103" fill="#6b7280" font-size="11">（未使用）</text>
  <text x="560" y="124" fill="#6b7280" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFF1</text>
  <rect x="620" y="112" width="270" height="26" fill="#2a2e38" stroke="#3a3f4c"/>
  <text x="560" y="150" fill="#6b7280" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFF2</text>
  <rect x="620" y="138" width="270" height="26" fill="#2a2e38" stroke="#3a3f4c"/>
  <text x="560" y="176" fill="#dbeafe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFF3</text>
  <rect x="620" y="164" width="270" height="26" fill="#2563eb" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="630" y="181" fill="#eff6ff" font-size="11">sum = 7（正在寫入的區域變數）</text>
  <text x="560" y="202" fill="#dbeafe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFF4</text>
  <rect x="620" y="190" width="270" height="26" fill="#2563eb" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="630" y="207" fill="#eff6ff" font-size="11">b = 4（參數）</text>
  <text x="560" y="228" fill="#dbeafe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFF5</text>
  <rect x="620" y="216" width="270" height="26" fill="#2563eb" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="630" y="233" fill="#eff6ff" font-size="11">a = 3（參數）</text>
  <text x="560" y="254" fill="#dbeafe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFF6</text>
  <rect x="620" y="242" width="270" height="26" fill="#2563eb" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="630" y="259" fill="#eff6ff" font-size="10">呼叫者（main）的 BP 備份（值 = 0xFFFF）</text>
  <text x="560" y="280" fill="#dbeafe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFF7</text>
  <rect x="620" y="268" width="270" height="26" fill="#2563eb" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="630" y="285" fill="#eff6ff" font-size="10">返回位址（回到 add(3,4) 的下一行）</text>
  <text x="560" y="306" fill="#ddd6fe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFF8</text>
  <rect x="620" y="294" width="270" height="26" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="630" y="311" fill="#eff6ff" font-size="11">main() 的區域變數等</text>
  <text x="560" y="332" fill="#ddd6fe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFF9</text>
  <rect x="620" y="320" width="270" height="26" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="560" y="358" fill="#ddd6fe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFFA</text>
  <rect x="620" y="346" width="270" height="26" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="560" y="384" fill="#ddd6fe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFFB</text>
  <rect x="620" y="372" width="270" height="26" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="560" y="410" fill="#ddd6fe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFFC</text>
  <rect x="620" y="398" width="270" height="26" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="560" y="436" fill="#ddd6fe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFFD</text>
  <rect x="620" y="424" width="270" height="26" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="560" y="462" fill="#ddd6fe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFFE</text>
  <rect x="620" y="450" width="270" height="26" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="560" y="488" fill="#ddd6fe" font-size="11" font-family="JetBrains Mono, Consolas, monospace">0xFFFF</text>
  <rect x="620" y="476" width="270" height="26" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="630" y="493" fill="#eff6ff" font-size="10">main() 的 frame 地板（main 的 BP = 0xFFFF）</text>

  <!-- 開口向上的 Stack 容器：頂端（小位址）是開口，底部（大位址）封閉 -->
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#7f1d1d"/><rect width="4" height="8" fill="#991b1b"/></pattern>
  </defs>
  <path d="M594 64 L612 86 L612 502 L898 502 L898 86 L916 64" fill="none" stroke="#facc15" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="609" y="502" width="292" height="12" rx="3" fill="url(#hatch)" stroke="#ef4444" stroke-width="2"/>
  <text x="755" y="82" text-anchor="middle" fill="#facc15" font-size="20" font-weight="900">開口</text>
  <path d="M690 62 V76" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/><path d="M682 74 L690 85 L698 74 z" fill="#22c55e"/>
  <text x="704" y="82" fill="#22c55e" font-size="12" font-weight="800">進</text>
  <path d="M820 85 V71" stroke="#f97316" stroke-width="4" stroke-linecap="round"/><path d="M812 73 L820 62 L828 73 z" fill="#f97316"/>
  <text x="834" y="82" fill="#f97316" font-size="12" font-weight="800">出</text>
  <text x="755" y="534" text-anchor="middle" fill="#fca5a5" font-size="16" font-weight="900">封閉</text>

  <!-- SP arrow + label -->
  <path d="M 560 177 C 500 175, 470 157, 442 143" fill="none" stroke="#f5b301" stroke-width="2.5" marker-end="url(#arrowY)"/>
  <rect x="230" y="77" width="210" height="64" rx="8" fill="#2a2416" stroke="#f5b301" stroke-width="1.5"/>
  <text x="244" y="99" fill="#fde68a" font-size="13" font-weight="700">🔝 Stack Pointer (SP)：0xFFF3</text>
  <text x="244" y="117" fill="#fde68a" font-size="10.5">CPU 暫存器，永遠指向目前 Stack</text>
  <text x="244" y="130" fill="#fde68a" font-size="10.5">最上面（最後 push 進去）的位址——「屋頂」</text>

  <!-- BP arrow + label -->
  <path d="M 560 255 C 500 257, 470 273, 442 289" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrowO)"/>
  <rect x="230" y="277" width="210" height="96" rx="8" fill="#2a1d12" stroke="#f97316" stroke-width="1.5"/>
  <text x="244" y="297" fill="#fed7aa" font-size="13" font-weight="700">🔻 Base Pointer (BP)：0xFFF6</text>
  <text x="244" y="315" fill="#fed7aa" font-size="10.5">CPU 暫存器，進入函式時 push rbp、</text>
  <text x="244" y="328" fill="#fed7aa" font-size="10.5">mov rbp,rsp 之後指向「存著呼叫者 BP</text>
  <text x="244" y="341" fill="#fed7aa" font-size="10.5">備份」那一格，是這個 frame 的地板；</text>
  <text x="244" y="354" fill="#fed7aa" font-size="10.5">區域變數用 BP 往上的固定 offset 存取</text>
  <text x="244" y="367" fill="#fed7aa" font-size="10.5">（例如 [rbp-4]）</text>

  <!-- bottom note -->
  <rect x="30" y="586" width="860" height="42" rx="8" fill="#1e2129" stroke="#333747"/>
  <text x="46" y="603" fill="#c7cad1" font-size="11.5">⚠️ SP、BP 本身不是 Stack 裡的內容，是 CPU 內部一塊獨立的暫存器（register），只是它們「存的值」剛好是一個指向 Stack 記憶體的 hex 位址。</text>
  <text x="46" y="619" fill="#c7cad1" font-size="11.5">呼叫愈多層函式，SP 會不斷往「數字更小」的方向移動（往上疊）；每進入一個新函式，BP 會被重新設成當時的 SP，標記這一層 frame 的地板。</text>

  <!-- extra panel: why smaller addresses are drawn on top + temporal order -->
  <rect x="30" y="644" width="860" height="190" rx="8" fill="#1e2129" stroke="#f5b301" stroke-width="1.5"/>
  <text x="46" y="666" fill="#fde68a" font-size="13" font-weight="700">🔁 追問：為什麼位址「上面數字比較小」？是先決定上面還是先決定下面？</text>
  <text x="46" y="686" fill="#c7cad1" font-size="11">這張圖刻意把「數字較小的位址」畫在上面、「數字較大的位址」畫在下面，是為了配合「SP＝屋頂」的直覺比喻：</text>
  <text x="46" y="704" fill="#c7cad1" font-size="11">Stack實際上往「數字更小」的方向成長，把小位址畫在上方，push東西的視覺效果才會像疊盤子一樣「往上疊」。</text>
  <text x="46" y="722" fill="#9aa0ac" font-size="11">這只是繪圖時的視覺選擇，不代表RAM實體位置真的有上下之分——位址本身只是數字，沒有物理方向。</text>
  <text x="46" y="744" fill="#fde68a" font-size="11" font-weight="700">真正的時間順序，是「地板（BP）先決定，屋頂（SP）才逐步往上疊」，不是反過來：</text>
  <text x="46" y="762" fill="#c7cad1" font-size="11">進入add()當下，「push rbp」存完呼叫者的 BP 後，「mov rbp,rsp」先把BP釘死在當時位址</text>
  <text x="46" y="780" fill="#c7cad1" font-size="11">（這裡是 0xFFF6，add frame 最底部、存著 BP 備份的那一格）——這是這個frame最早確定、之後都不會變動的基準點；</text>
  <text x="46" y="798" fill="#c7cad1" font-size="11">接著sub rsp,4、以及後續每一次push，才讓SP一步步往「數字更小」的方向移動（圖裡的往上）。</text>
  <text x="46" y="818" fill="#fff7d6" font-size="11" font-weight="700">一句話：先有「地板被釘住」，才有「地板之上的空間逐格被使用」——下面（BP）先固定，上面（使用區）才依序長出來。</text>
</svg>
