<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <style>
    .box{fill:#ffffff;stroke:#5b6b7c;stroke-width:1.6}
    .proc{fill:#eef4fb;stroke:#4a6fa5;stroke-width:1.6}
    .dec{fill:#fff8e1;stroke:#c99a06;stroke-width:1.6}
    .ok{fill:#e8f8e8;stroke:#2e7d32;stroke-width:1.6}
    .no{fill:#ffeaef;stroke:#c2185b;stroke-width:1.6}
    .t{font-size:14px;fill:#1f2933}
    .tb{font-size:15px;font-weight:700;fill:#12212e}
    .lbl{font-size:12.5px;fill:#5b6b7c}
    .cap{font-size:12px;fill:#7a8794}
    .mono{font-size:13px;fill:#1f2933;font-family:'Cascadia Mono',Consolas,monospace}
    .ln{stroke:#5b6b7c;stroke-width:1.5;fill:none;marker-end:url(#ar3)}
  </style>
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <text x="24" y="30" class="tb" font-size="17">圖解：&lt;abbr title="…"&gt; 裡的完整字，要走哪條路才會被看到</text>
  <text x="24" y="50" class="cap">主軸圖：title 的內容不進入版面文字流（layout），只在三個特定出口浮現</text>

  <rect x="290" y="72" width="300" height="44" rx="22" class="box"/>
  <text x="440" y="92" class="mono" text-anchor="middle">&lt;abbr title="HyperText Markup</text>
  <text x="440" y="109" class="mono" text-anchor="middle">Language"&gt;HTML&lt;/abbr&gt;</text>

  <path class="ln" d="M440,116 L440,150"/>

  <rect x="255" y="150" width="370" height="46" rx="8" class="proc"/>
  <text x="440" y="170" class="tb" text-anchor="middle">瀏覽器 parse 成 DOM：文字節點只有「HTML」</text>
  <text x="440" y="189" class="t" text-anchor="middle">title 被存成 attribute，不是子節點</text>

  <path class="ln" d="M440,196 L440,228"/>

  <polygon points="440,228 640,278 440,328 240,278" class="dec"/>
  <text x="440" y="274" class="tb" text-anchor="middle">誰來取用這個 attribute？</text>
  <text x="440" y="294" class="t" text-anchor="middle">（排版引擎不取用它）</text>

  <path class="ln" d="M240,278 L120,278 L120,368"/>
  <path class="ln" d="M440,328 L440,368"/>
  <path class="ln" d="M640,278 L760,278 L760,368"/>

  <rect x="20" y="368" width="200" height="100" rx="8" class="ok"/>
  <text x="120" y="392" class="tb" text-anchor="middle">① 滑鼠 hover</text>
  <text x="120" y="414" class="t" text-anchor="middle">瀏覽器原生 tooltip</text>
  <text x="120" y="434" class="t" text-anchor="middle">停留一兩秒才浮現</text>
  <text x="120" y="456" class="cap" text-anchor="middle">觸控裝置沒有 hover</text>

  <rect x="340" y="368" width="200" height="100" rx="8" class="ok"/>
  <text x="440" y="392" class="tb" text-anchor="middle">② 螢幕閱讀器</text>
  <text x="440" y="414" class="t" text-anchor="middle">可選擇讀出完整字</text>
  <text x="440" y="434" class="t" text-anchor="middle">而不是逐字母唸</text>
  <text x="440" y="456" class="cap" text-anchor="middle">各家軟體行為不一致</text>

  <rect x="660" y="368" width="200" height="100" rx="8" class="ok"/>
  <text x="760" y="392" class="tb" text-anchor="middle">③ 機器讀取</text>
  <text x="760" y="414" class="t" text-anchor="middle">爬蟲與解析工具</text>
  <text x="760" y="434" class="t" text-anchor="middle">拿得到語意資訊</text>
  <text x="760" y="456" class="cap" text-anchor="middle">對 SEO 排名無直接影響</text>

  <path class="ln" d="M120,468 L120,506 L440,506"/>
  <path class="ln" d="M440,468 L440,506"/>
  <path class="ln" d="M760,468 L760,506 L440,506"/>
  <path class="ln" d="M440,506 L440,532"/>

  <rect x="200" y="532" width="480" height="40" rx="20" class="no"/>
  <text x="440" y="557" class="tb" text-anchor="middle">畫面上永遠只看得到「HTML」這四個字</text>
</svg>
