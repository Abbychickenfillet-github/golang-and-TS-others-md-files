<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b5cf6"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#10b981"/></marker>
  </defs>
  <rect width="960" height="560" fill="#fbfbfd"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#111827">靜態方法 vs 實例方法：兩個不同的盒子</text>
  <text x="30" y="58" font-size="12.5" fill="#6b7280">Object 與 Object.prototype 是兩個不同的物件。東西住哪個盒子，就決定了它的身分。</text>

  <!-- 左盒：建構函式 -->
  <rect x="30" y="86" width="330" height="300" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="50" y="114" font-size="14" font-weight="700" fill="#065f46" font-family="monospace">Object</text>
  <text x="50" y="134" font-size="11.5" fill="#047857">建構函式本身｜typeof 是 function</text>
  <text x="50" y="152" font-size="11" fill="#6b7280">共 26 個自有成員</text>
  <line x1="50" y1="162" x2="340" y2="162" stroke="#a7f3d0"/>

  <text x="50" y="186" font-size="12.5" font-weight="700" fill="#065f46">住在這裡的＝靜態方法</text>
  <text x="50" y="210" font-size="11.5" fill="#374151" font-family="monospace">Object.keys(obj)</text>
  <text x="50" y="230" font-size="11.5" fill="#374151" font-family="monospace">Object.assign(t, s)</text>
  <text x="50" y="250" font-size="11.5" fill="#374151" font-family="monospace">Object.hasOwn(obj, key)</text>
  <text x="50" y="270" font-size="11.5" fill="#374151" font-family="monospace">Object.getPrototypeOf(obj)</text>
  <text x="50" y="290" font-size="11.5" fill="#374151" font-family="monospace">Object.create(proto)</text>
  <line x1="50" y1="304" x2="340" y2="304" stroke="#a7f3d0"/>
  <text x="50" y="326" font-size="11.5" fill="#065f46" font-weight="600">怎麼認：物件當「參數」傳進去</text>
  <text x="50" y="346" font-size="11" fill="#6b7280">不吃 this，拆下來單獨呼叫也沒事</text>
  <text x="50" y="366" font-size="11" fill="#6b7280">Object 只是命名空間，不是操作對象</text>

  <!-- 右盒：prototype -->
  <rect x="410" y="86" width="330" height="300" rx="14" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="430" y="114" font-size="14" font-weight="700" fill="#5b21b6" font-family="monospace">Object.prototype</text>
  <text x="430" y="134" font-size="11.5" fill="#6d28d9">原型物件｜typeof 是 object</text>
  <text x="430" y="152" font-size="11" fill="#6b7280">共 12 個自有成員</text>
  <line x1="430" y1="162" x2="720" y2="162" stroke="#ddd6fe"/>

  <text x="430" y="186" font-size="12.5" font-weight="700" fill="#5b21b6">住在這裡的＝實例方法／存取器</text>
  <text x="430" y="210" font-size="11.5" fill="#374151" font-family="monospace">obj.hasOwnProperty(key)</text>
  <text x="430" y="230" font-size="11.5" fill="#374151" font-family="monospace">obj.toString()</text>
  <text x="430" y="250" font-size="11.5" fill="#374151" font-family="monospace">obj.valueOf()</text>
  <text x="430" y="270" font-size="11.5" fill="#374151" font-family="monospace">obj.isPrototypeOf(x)</text>
  <text x="430" y="290" font-size="11.5" fill="#dc2626" font-family="monospace">obj.__proto__  ← 存取器不呼叫</text>
  <line x1="430" y1="304" x2="720" y2="304" stroke="#ddd6fe"/>
  <text x="430" y="326" font-size="11.5" fill="#5b21b6" font-weight="600">怎麼認：物件寫在「點的左邊」</text>
  <text x="430" y="346" font-size="11" fill="#6b7280">那個物件就是 this，方法需要它才知道對誰做</text>
  <text x="430" y="366" font-size="11" fill="#6b7280">拆下來單獨呼叫會爆 TypeError</text>

  <!-- 尺 -->
  <rect x="770" y="86" width="160" height="300" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="788" y="114" font-size="13" font-weight="700" fill="#111827">用哪把尺量</text>
  <text x="788" y="140" font-size="10.5" fill="#374151" font-family="monospace">Object.hasOwn(</text>
  <text x="796" y="156" font-size="10.5" fill="#374151" font-family="monospace">哪個盒子,</text>
  <text x="796" y="172" font-size="10.5" fill="#374151" font-family="monospace">"名字")</text>
  <line x1="788" y1="188" x2="912" y2="188" stroke="#e5e7eb"/>
  <text x="788" y="212" font-size="10.5" fill="#065f46">左盒 true</text>
  <text x="788" y="228" font-size="10.5" fill="#6b7280">→ 靜態方法</text>
  <text x="788" y="256" font-size="10.5" fill="#5b21b6">右盒 true</text>
  <text x="788" y="272" font-size="10.5" fill="#6b7280">→ 實例方法</text>
  <line x1="788" y1="292" x2="912" y2="292" stroke="#e5e7eb"/>
  <text x="788" y="314" font-size="10.5" fill="#374151">hasOwn 本身</text>
  <text x="788" y="330" font-size="10.5" fill="#374151">只是「自有屬性</text>
  <text x="788" y="346" font-size="10.5" fill="#374151">檢查」，不是</text>
  <text x="788" y="362" font-size="10.5" fill="#374151">「測靜態」的工具</text>

  <!-- 底部：Map 例子 -->
  <rect x="30" y="410" width="900" height="118" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="50" y="436" font-size="13" font-weight="700" fill="#111827">同一個判準套到 Map：為什麼是 map.set(...) 不是 Map.set(...)</text>

  <rect x="50" y="450" width="270" height="60" rx="9" fill="#ecfdf5" stroke="#10b981"/>
  <text x="64" y="470" font-size="11.5" font-family="monospace" fill="#065f46">Map 身上（靜態）</text>
  <text x="64" y="488" font-size="11" font-family="monospace" fill="#374151">Map.groupBy(資料, callback)</text>
  <text x="64" y="503" font-size="10.5" fill="#6b7280">資料當參數傳進去</text>

  <rect x="336" y="450" width="270" height="60" rx="9" fill="#faf5ff" stroke="#8b5cf6"/>
  <text x="350" y="470" font-size="11.5" font-family="monospace" fill="#5b21b6">Map.prototype 上（實例）</text>
  <text x="350" y="488" font-size="11" font-family="monospace" fill="#374151">map.set(k, v)　map.get(k)</text>
  <text x="350" y="503" font-size="10.5" fill="#6b7280">map 在點的左邊，它就是 this</text>

  <rect x="622" y="450" width="288" height="60" rx="9" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="636" y="470" font-size="11.5" font-family="monospace" fill="#991b1b">Map.set(m, "a", 1)</text>
  <text x="636" y="488" font-size="11" fill="#dc2626">TypeError: Map.set is not a function</text>
  <text x="636" y="503" font-size="10.5" fill="#6b7280">因為 Map 這個盒子裡根本沒有 set</text>

  <text x="30" y="548" font-size="10.5" fill="#9ca3af">資料來源 MDN Object／Map｜實測環境 Node.js v22 的 V8｜圖 2026-08-19</text>
</svg>
