<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1140" viewBox="0 0 1700 1140" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7a4f"/></marker>
    <style>
      .t{font-size:15px;fill:#1a202c}.tb{font-size:16px;fill:#1a202c;font-weight:700}
      .ts{font-size:12.5px;fill:#4a5568}
      .mono{font-family:'Consolas','Menlo','DejaVu Sans Mono',monospace;font-size:13px;fill:#1a202c}
      .monos{font-family:'Consolas','Menlo','DejaVu Sans Mono',monospace;font-size:11.5px;fill:#4a5568}
      .e{stroke:#4a5568;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .er{stroke:#c53030;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .eg{stroke:#2f7a4f;stroke-width:1.8;fill:none;marker-end:url(#ag)}
      .lbl{font-size:12.5px;fill:#4a5568}.s{stroke-width:1.8}
    </style>
  </defs>
  <rect width="1700" height="1140" fill="#fbfbfa"/>

  <text x="48" y="52" class="tb" font-size="26">Day 29｜本機正常、上線就炸：建置時與執行時是兩個不同的時間點</text>
  <text x="48" y="80" class="ts" font-size="14.5">依 ISO 5807 流程圖符號：圓形＝連接點／端點　直角矩形＝處理　菱形＝判斷　平行四邊形＝資料　雙邊線矩形＝副流程　六邊形＝初始化　　實測環境：Node v22.22.2、esbuild 0.28.2、dotenv 18.0.4</text>
  <line x1="48" y1="98" x2="1652" y2="98" stroke="#cbd5e0" stroke-width="1.5"/>

  <!-- ===== 左：一個環境變數的兩條路 ===== -->
  <text x="48" y="136" class="tb" font-size="19">一、同一個 process.env.XXX，兩條完全不同的路</text>
  <rect x="40" y="150" width="790" height="945" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <path d="M 130 172 L 760 172 L 784 202 L 760 232 L 130 232 L 106 202 Z" fill="#faf5ff" stroke="#6b46c1" class="s"/>
  <text x="445" y="197" class="t" text-anchor="middle">你在 .env 或 Zeabur／Vercel 面板設一個值</text>
  <text x="445" y="219" class="ts" text-anchor="middle">此刻它只是一串字，還不知道自己會走哪一條路</text>
  <path class="e" d="M 445 234 L 445 262"/>

  <path d="M 445 264 L 700 312 L 445 360 L 190 312 Z" fill="#fffaf0" stroke="#b7791f" class="s"/>
  <text x="445" y="304" class="t" text-anchor="middle">名字有沒有這些前綴</text>
  <text x="445" y="326" class="monos" text-anchor="middle">NEXT_PUBLIC_ ／ VITE_ ／ REACT_APP_</text>
  <text x="445" y="346" class="ts" text-anchor="middle">（這是唯一的判準，不是你想不想公開）</text>

  <!-- 左路：建置時 -->
  <path class="er" d="M 190 312 L 110 312 L 110 386"/>
  <text x="148" y="304" class="lbl" text-anchor="middle">有</text>
  <g>
    <rect x="62" y="388" width="330" height="58" fill="#ebf8ff" stroke="#2b6cb0" class="s"/>
    <line x1="78" y1="388" x2="78" y2="446" stroke="#2b6cb0" stroke-width="1.8"/>
    <line x1="376" y1="388" x2="376" y2="446" stroke="#2b6cb0" stroke-width="1.8"/>
    <text x="227" y="410" class="t" text-anchor="middle" font-weight="700">建置時（build time）</text>
    <text x="227" y="432" class="monos" text-anchor="middle">npm run build ／ next build</text>
  </g>
  <path class="er" d="M 227 448 L 227 476"/>
  <rect x="62" y="478" width="330" height="62" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="227" y="500" class="t" text-anchor="middle">被換成字面值，塞進 JS 檔</text>
  <text x="227" y="524" class="monos" text-anchor="middle">var x = "https://build-time..."</text>
  <path class="er" d="M 227 542 L 227 568"/>
  <path d="M 100 570 L 392 570 L 368 618 L 76 618 Z" fill="#f7fafc" stroke="#4a5568" class="s"/>
  <text x="234" y="592" class="mono" text-anchor="middle">dist/bundle.js</text>
  <text x="234" y="610" class="ts" text-anchor="middle">檔案裡已經沒有 process.env 了</text>
  <path class="er" d="M 227 620 L 227 648"/>
  <ellipse cx="227" cy="686" rx="165" ry="36" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="227" y="678" class="t" text-anchor="middle" fill="#9b2c2c">Restart 改不動它</text>
  <text x="227" y="698" class="ts" text-anchor="middle">要按 Redeploy ／ Rebuild</text>

  <rect x="62" y="736" width="330" height="86" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="227" y="758" class="t" text-anchor="middle" fill="#9b2c2c">而且使用者打開 DevTools 就看得到</text>
  <text x="78" y="782" class="ts">所以任何金鑰、密碼、token 都絕對</text>
  <text x="78" y="802" class="ts">不能放這個前綴。前綴的意思就是「我公開」</text>

  <!-- 右路：執行時 -->
  <path class="eg" d="M 700 312 L 780 312 L 780 386"/>
  <text x="742" y="304" class="lbl" text-anchor="middle">沒有</text>
  <rect x="452" y="388" width="326" height="58" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
  <text x="615" y="410" class="t" text-anchor="middle">原封不動留在檔案裡</text>
  <text x="615" y="432" class="monos" text-anchor="middle">process.env.DATABASE_URL</text>
  <path class="eg" d="M 615 448 L 615 476"/>
  <g>
    <rect x="452" y="478" width="326" height="58" fill="#ebf8ff" stroke="#2b6cb0" class="s"/>
    <line x1="468" y1="478" x2="468" y2="536" stroke="#2b6cb0" stroke-width="1.8"/>
    <line x1="762" y1="478" x2="762" y2="536" stroke="#2b6cb0" stroke-width="1.8"/>
    <text x="615" y="500" class="t" text-anchor="middle" font-weight="700">執行時（runtime）</text>
    <text x="615" y="522" class="monos" text-anchor="middle">node server.js 每次讀</text>
  </g>
  <path class="eg" d="M 615 538 L 615 648"/>
  <ellipse cx="615" cy="686" rx="160" ry="36" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
  <text x="615" y="678" class="t" text-anchor="middle" fill="#22543d">Restart 就生效</text>
  <text x="615" y="698" class="ts" text-anchor="middle">使用者也看不到</text>

  <!-- 實測 -->
  <rect x="62" y="844" width="716" height="106" fill="#f7fafc" stroke="#cbd5e0" class="s" rx="4"/>
  <text x="78" y="868" class="tb" font-size="14">實測：同一個已經建好的 bundle，改執行時的環境變數跑兩次</text>
  <text x="78" y="892" class="monos">設 NEXT_PUBLIC_API_URL=runtime-A → 公開的 = https://build-time.example.com　　伺服器的 = db-runtime-A</text>
  <text x="78" y="912" class="monos">設 NEXT_PUBLIC_API_URL=runtime-B → 公開的 = https://build-time.example.com　　伺服器的 = db-runtime-B</text>
  <text x="78" y="938" class="ts">「公開的」兩次都沒變，「伺服器的」每次都跟著變。這就是清了瀏覽器快取也還是舊網址的原因。</text>

  <rect x="62" y="966" width="716" height="112" fill="#fffaf0" stroke="#b7791f" class="s" rx="4"/>
  <text x="78" y="990" class="tb" font-size="14">一句話的判準</text>
  <text x="78" y="1014" class="ts">會壞的每一個部署問題，幾乎都可以先問這一句：</text>
  <text x="78" y="1040" class="t" font-weight="700">「這個值是在 build 的時候決定的，還是在 run 的時候決定的？」</text>
  <text x="78" y="1064" class="ts">答錯這一題，你就會在錯的地方找一整個下午。</text>

  <!-- ===== 右：五個雷 ===== -->
  <text x="866" y="136" class="tb" font-size="19">二、五個只在正式環境炸的雷，以及它們的共同成因</text>
  <rect x="858" y="150" width="794" height="945" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <!-- 雷一 -->
  <text x="884" y="184" class="tb">雷一　引號是誰去掉的？不是 process.env</text>
  <rect x="882" y="196" width="746" height="24" fill="#f7fafc" stroke="#cbd5e0" class="s"/>
  <text x="894" y="213" class="ts">誰在讀那一行　　　　　　　　　　　　　　　　　　　成對引號會怎樣</text>
  <g class="ts">
    <rect x="882" y="220" width="746" height="24" fill="#fff" stroke="#cbd5e0" class="s"/>
    <text x="894" y="237">dotenv ／ Next.js ／ Vite ／ nodemon　　　　　　　　去掉</text>
    <rect x="882" y="244" width="746" height="24" fill="#fff" stroke="#cbd5e0" class="s"/>
    <text x="894" y="261">docker compose（.env 與 env_file）　　　　　　　　 去掉</text>
    <rect x="882" y="268" width="746" height="24" fill="#fff5f5" stroke="#c53030" class="s"/>
    <text x="894" y="285" fill="#9b2c2c">docker run --env-file　　　　　　　　　　　　　　　留著，變成值的一部分</text>
    <rect x="882" y="292" width="746" height="24" fill="#fff5f5" stroke="#c53030" class="s"/>
    <text x="894" y="309" fill="#9b2c2c">Zeabur ／ Vercel 面板的輸入框　　　　　　　　　　 你貼什麼就是什麼</text>
  </g>
  <text x="884" y="338" class="ts">→ .env.development 寫引號（本機沒事）＋ 同一串貼到面板（引號留著）＝ 驗證失敗</text>

  <!-- 雷二 -->
  <text x="884" y="380" class="tb">雷二　沒有引號時，# 之後被當成註解砍掉</text>
  <rect x="882" y="392" width="746" height="76" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="894" y="414" class="monos">DB_PASSWORD=p@ss#w0rd!        → dotenv 解出 "p@ss"　（少了 6 個字元）</text>
  <text x="894" y="436" class="monos">DB_PASSWORD="p@ss#w0rd!"      → dotenv 解出 "p@ss#w0rd!"　正確</text>
  <text x="894" y="460" class="ts">錯誤訊息是 password authentication failed，但密碼其實是對的 —— 是檔案讀到一半就停了</text>

  <!-- 雷三 -->
  <text x="884" y="502" class="tb">雷三　|| 預設值：把「忘了設」翻譯成「連去別的地方」</text>
  <rect x="882" y="514" width="746" height="98" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="894" y="536" class="mono">user: process.env.DB_USER || 'postgres'</text>
  <text x="894" y="558" class="monos">正式環境忘了設 DB_USER → 安靜地連去 postgres</text>
  <text x="894" y="578" class="monos">→ FATAL: password authentication failed for user "postgres"</text>
  <text x="894" y="602" class="ts">錯誤訊息長得像「資料庫的問題」，而不是「你忘了設環境變數」</text>
  <rect x="882" y="618" width="746" height="46" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
  <text x="894" y="640" class="t" fill="#22543d">解法不是換成 ??，是連線設定不該有預設值</text>
  <text x="894" y="658" class="ts">缺了就不要讓服務起來，讓它在部署那一刻炸，不要等到有人按下登入</text>

  <!-- 雷四 -->
  <text x="884" y="700" class="tb">雷四　COPY 順序決定 npm ci 要不要重跑</text>
  <g>
    <rect x="882" y="712" width="366" height="104" fill="#fff5f5" stroke="#c53030" class="s"/>
    <text x="894" y="734" class="ts" fill="#9b2c2c">壞的順序（改一行程式碼 → 3／3 層失效）</text>
    <text x="894" y="756" class="monos">COPY . .</text>
    <text x="894" y="776" class="monos">RUN npm ci</text>
    <text x="894" y="796" class="monos">RUN npm run build</text>
    <rect x="1262" y="712" width="366" height="104" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
    <text x="1274" y="734" class="ts" fill="#22543d">好的順序（改一行程式碼 → 2／4 層失效）</text>
    <text x="1274" y="756" class="monos">COPY package*.json ./</text>
    <text x="1274" y="776" class="monos">RUN npm ci          ← 命中快取</text>
    <text x="1274" y="796" class="monos">COPY . . ；RUN npm run build</text>
  </g>

  <!-- 雷五 -->
  <text x="884" y="854" class="tb">雷五　npm install 會安靜地裝成別的版本</text>
  <rect x="882" y="866" width="746" height="76" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="894" y="888" class="monos">npm error `npm ci` can only install packages when your package.json and</text>
  <text x="894" y="908" class="monos">npm error package-lock.json ... are in sync.</text>
  <text x="894" y="932" class="ts">npm ci 讓 CI 早一步炸給你看；npm install 會安靜地裝一個跟你本機不一樣的版本</text>
  <rect x="882" y="948" width="746" height="46" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
  <text x="894" y="970" class="mono">RUN npm ci --ignore-scripts</text>
  <text x="894" y="988" class="ts">代價：sharp、bcrypt、Playwright 這類需要 postinstall 的套件要個別處理</text>

  <rect x="882" y="1014" width="746" height="64" fill="#fffaf0" stroke="#b7791f" class="s" rx="4"/>
  <text x="896" y="1038" class="tb" font-size="14">五個雷的共同成因</text>
  <text x="896" y="1062" class="ts">全部都是「同一份設定，在兩個不同時間點被兩個不同的人讀了，而規矩不一樣」。</text>
</svg>
