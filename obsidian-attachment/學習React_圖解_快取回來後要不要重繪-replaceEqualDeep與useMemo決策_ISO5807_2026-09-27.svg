<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7a4f"/>
    </marker>
    <style>
      .t    { font-size: 15px; fill: #1a202c; }
      .tb   { font-size: 16px; fill: #1a202c; font-weight: 700; }
      .ts   { font-size: 12.5px; fill: #4a5568; }
      .mono { font-family: 'Consolas','Menlo','DejaVu Sans Mono',monospace; font-size: 13px; fill: #1a202c; }
      .monos{ font-family: 'Consolas','Menlo','DejaVu Sans Mono',monospace; font-size: 11.5px; fill: #4a5568; }
      .e  { stroke:#4a5568; stroke-width:1.8; fill:none; marker-end:url(#a); }
      .er { stroke:#c53030; stroke-width:1.8; fill:none; marker-end:url(#ar); }
      .eg { stroke:#2f7a4f; stroke-width:1.8; fill:none; marker-end:url(#ag); }
      .lbl{ font-size:12.5px; fill:#4a5568; }
      .s  { stroke-width:1.8; }
    </style>
  </defs>

  <rect width="1680" height="1120" fill="#fbfbfa"/>

  <text x="48" y="52" class="tb" font-size="26">Day 26｜快取回來以後，React 到底要不要重繪</text>
  <text x="48" y="80" class="ts" font-size="14.5">依 ISO 5807 流程圖符號：圓形＝連接點／端點　直角矩形＝處理　菱形＝判斷　平行四邊形＝資料　雙邊線矩形＝副流程　六邊形＝初始化　　資料來源：@tanstack/query-core 5.104.0 原始碼與實測</text>
  <line x1="48" y1="98" x2="1632" y2="98" stroke="#cbd5e0" stroke-width="1.5"/>

  <!-- ============ 左：一次 refetch 的完整路徑 ============ -->
  <text x="48" y="136" class="tb" font-size="19">一、一次 refetch 走完的兩道關卡</text>
  <rect x="40" y="150" width="780" height="930" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <ellipse cx="430" cy="194" rx="164" ry="26" fill="#edf2f7" stroke="#4a5568" class="s"/>
  <text x="430" y="192" class="t" text-anchor="middle">refetch 完成</text>
  <text x="430" y="210" class="ts" text-anchor="middle">後端回來一個全新的 JSON 物件</text>
  <path class="e" d="M 430 220 L 430 250"/>

  <!-- 資料 -->
  <path d="M 250 252 L 640 252 L 614 300 L 224 300 Z" fill="#f7fafc" stroke="#4a5568" class="s"/>
  <text x="430" y="274" class="t" text-anchor="middle">新資料 b（參考一定是新的）</text>
  <text x="430" y="292" class="monos" text-anchor="middle">舊資料 a 還在快取裡</text>
  <path class="e" d="M 430 302 L 430 330"/>

  <!-- 初始化 六邊形：hashKey -->
  <path d="M 250 332 L 622 332 L 646 362 L 622 392 L 250 392 L 226 362 Z" fill="#faf5ff" stroke="#6b46c1" class="s"/>
  <text x="436" y="358" class="mono" text-anchor="middle">hashKey(queryKey) → 決定放在哪一格</text>
  <text x="436" y="378" class="ts" text-anchor="middle">JSON.stringify ＋ 物件 key 先 sort()　（Day 25 那個問號的答案）</text>
  <path class="e" d="M 430 394 L 430 424"/>

  <!-- 關卡一 副流程 -->
  <g>
    <rect x="150" y="426" width="560" height="62" fill="#ebf8ff" stroke="#2b6cb0" class="s"/>
    <line x1="166" y1="426" x2="166" y2="488" stroke="#2b6cb0" stroke-width="1.8"/>
    <line x1="694" y1="426" x2="694" y2="488" stroke="#2b6cb0" stroke-width="1.8"/>
    <text x="430" y="450" class="t" text-anchor="middle" font-weight="700">關卡一：structural sharing</text>
    <text x="430" y="472" class="mono" text-anchor="middle">replaceEqualDeep(a, b)</text>
  </g>
  <path class="e" d="M 430 490 L 430 518"/>

  <!-- 判斷一 -->
  <path d="M 430 520 L 646 570 L 430 620 L 214 570 Z" fill="#fffaf0" stroke="#b7791f" class="s"/>
  <text x="430" y="558" class="mono" text-anchor="middle">aSize === bSize</text>
  <text x="430" y="578" class="mono" text-anchor="middle">&amp;&amp; equalItems === aSize</text>
  <text x="430" y="598" class="ts" text-anchor="middle">每一欄都相等嗎</text>

  <!-- 左：相等 -->
  <path class="eg" d="M 214 570 L 130 570 L 130 618"/>
  <text x="172" y="562" class="lbl" text-anchor="middle">是</text>
  <rect x="56" y="620" width="200" height="60" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
  <text x="156" y="644" class="mono" text-anchor="middle">return a</text>
  <text x="156" y="666" class="ts" text-anchor="middle">參考完全沒變，b 被丟掉</text>

  <!-- 右：不相等 -->
  <path class="e" d="M 646 570 L 730 570 L 730 618"/>
  <text x="692" y="562" class="lbl" text-anchor="middle">否</text>
  <rect x="600" y="620" width="200" height="60" fill="#edf2f7" stroke="#4a5568" class="s"/>
  <text x="700" y="644" class="mono" text-anchor="middle">return copy</text>
  <text x="700" y="666" class="ts" text-anchor="middle">沒改的子物件仍然共用</text>

  <path class="eg" d="M 156 682 L 156 712 L 420 712 L 420 740"/>
  <path class="e" d="M 700 682 L 700 712 L 440 712 L 440 740"/>

  <!-- 關卡二 副流程 -->
  <g>
    <rect x="150" y="742" width="560" height="62" fill="#ebf8ff" stroke="#2b6cb0" class="s"/>
    <line x1="166" y1="742" x2="166" y2="804" stroke="#2b6cb0" stroke-width="1.8"/>
    <line x1="694" y1="742" x2="694" y2="804" stroke="#2b6cb0" stroke-width="1.8"/>
    <text x="430" y="766" class="t" text-anchor="middle" font-weight="700">關卡二：tracked properties</text>
    <text x="430" y="788" class="ts" text-anchor="middle">Proxy 記下元件實際讀過哪些屬性</text>
  </g>
  <path class="e" d="M 430 806 L 430 832"/>

  <!-- 判斷二 -->
  <path d="M 430 834 L 640 880 L 430 926 L 220 880 Z" fill="#fffaf0" stroke="#b7791f" class="s"/>
  <text x="430" y="874" class="t" text-anchor="middle">你讀過的那些屬性</text>
  <text x="430" y="894" class="t" text-anchor="middle">有任何一個變了嗎</text>

  <path class="eg" d="M 220 880 L 130 880 L 130 934"/>
  <text x="176" y="872" class="lbl" text-anchor="middle">沒有</text>
  <ellipse cx="156" cy="966" rx="100" ry="26" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
  <text x="156" y="964" class="t" text-anchor="middle" fill="#22543d">不重繪</text>
  <text x="156" y="982" class="ts" text-anchor="middle">畫面安靜</text>

  <path class="er" d="M 640 880 L 730 880 L 730 934"/>
  <text x="688" y="872" class="lbl" text-anchor="middle">有</text>
  <ellipse cx="700" cy="966" rx="100" ry="26" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="700" y="964" class="t" text-anchor="middle" fill="#9b2c2c">重繪一次</text>
  <text x="700" y="982" class="ts" text-anchor="middle">每次 refetch 兩下</text>

  <rect x="60" y="1006" width="740" height="60" fill="#f7fafc" stroke="#cbd5e0" class="s" rx="4"/>
  <text x="76" y="1028" class="ts">兩道關卡是獨立的。只過關卡一（參考穩）但關卡二讀了 isFetching，畫面照樣每次 refetch 閃兩下。</text>
  <text x="76" y="1050" class="ts">實測：只讀 data → 2 次通知；多讀一個 isFetching → 8 次；用 {...rest} 解構 → 8 次（四次 refetch）。</text>

  <!-- ============ 右：兩張決策表 ============ -->
  <text x="856" y="136" class="tb" font-size="19">二、什麼會把最佳化關掉，以及該不該加 useMemo</text>
  <rect x="848" y="150" width="784" height="930" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <text x="874" y="186" class="tb">A. 三種會親手關掉關卡一的寫法</text>

  <rect x="872" y="200" width="736" height="52" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="886" y="222" class="mono">structuralSharing: false</text>
  <text x="886" y="242" class="ts">直接關掉。每次 refetch 都是新參考，下游所有 useMemo 全部失效</text>

  <rect x="872" y="262" width="736" height="52" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="886" y="284" class="mono">select: (d) =&gt; d.list.map(...)</text>
  <text x="886" y="304" class="ts">select 每次產生新陣列。關卡一在 select 之後才比，所以等於被繞過</text>

  <rect x="872" y="324" width="736" height="52" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="886" y="346" class="mono">select: (d) =&gt; ({ ...d, at: new Date(d.at) })</text>
  <text x="886" y="366" class="ts">Date 不是單純物件 → replaceEqualDeep 直接 return b → 一個欄位讓整包破功</text>

  <!-- 型別表 -->
  <text x="874" y="414" class="tb">B. 哪些型別進得了逐欄位比對</text>
  <rect x="872" y="428" width="360" height="30" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
  <text x="888" y="448" class="t">進得去：單純物件、單純陣列</text>
  <rect x="1248" y="428" width="360" height="30" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="1264" y="448" class="t">進不去：Map、Set、Date、class 實例</text>
  <text x="874" y="480" class="monos">if (!array &amp;&amp; !(isPlainObject(a) &amp;&amp; isPlainObject(b))) return b</text>

  <!-- useMemo 決策 -->
  <text x="874" y="524" class="tb">C. useMemo 該不該加：兩個問題就夠了</text>

  <ellipse cx="1240" cy="566" rx="120" ry="24" fill="#edf2f7" stroke="#4a5568" class="s"/>
  <text x="1240" y="572" class="t" text-anchor="middle">想加一個 useMemo</text>
  <path class="e" d="M 1240 590 L 1240 614"/>

  <path d="M 1240 616 L 1470 662 L 1240 708 L 1010 662 Z" fill="#fffaf0" stroke="#b7791f" class="s"/>
  <text x="1240" y="656" class="t" text-anchor="middle">問題一：上游給你的那個</text>
  <text x="1240" y="676" class="t" text-anchor="middle">參考，每次 render 都一樣嗎</text>

  <path class="er" d="M 1470 662 L 1560 662 L 1560 714"/>
  <text x="1516" y="654" class="lbl" text-anchor="middle">不一樣</text>
  <rect x="1404" y="716" width="204" height="78" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="1506" y="740" class="t" text-anchor="middle" fill="#9b2c2c">先去修上游</text>
  <text x="1418" y="762" class="ts">依賴每次都變 → memo 永遠</text>
  <text x="1418" y="780" class="ts">不命中 → 比不加還慢</text>

  <path class="e" d="M 1240 710 L 1240 736"/>
  <text x="1256" y="728" class="lbl">一樣</text>

  <path d="M 1240 738 L 1400 784 L 1240 830 L 1080 784 Z" fill="#fffaf0" stroke="#b7791f" class="s"/>
  <text x="1240" y="778" class="t" text-anchor="middle">問題二：每次 render</text>
  <text x="1240" y="798" class="t" text-anchor="middle">省得下 1 毫秒嗎</text>

  <path class="er" d="M 1080 784 L 960 784 L 960 836"/>
  <text x="1016" y="776" class="lbl" text-anchor="middle">省不到</text>
  <rect x="876" y="838" width="220" height="78" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="986" y="862" class="t" text-anchor="middle" fill="#9b2c2c">不要加</text>
  <text x="890" y="884" class="ts">使用者感覺不到，你只是多</text>
  <text x="890" y="902" class="ts">維護一個依賴陣列</text>

  <path class="eg" d="M 1240 832 L 1240 862"/>
  <text x="1256" y="854" class="lbl">省得到</text>
  <ellipse cx="1240" cy="892" rx="110" ry="26" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
  <text x="1240" y="890" class="t" text-anchor="middle" fill="#22543d">這個 memo 值得</text>
  <text x="1240" y="908" class="ts" text-anchor="middle">實測約要上萬筆才明顯</text>

  <rect x="876" y="944" width="732" height="122" fill="#f7fafc" stroke="#cbd5e0" class="s" rx="4"/>
  <text x="892" y="968" class="ts">實測（2000 筆、300 次 render）：上游穩定＋memo＝1.6 毫秒；上游每次新參考＋memo＝94.1 毫秒；</text>
  <text x="892" y="990" class="ts">完全不用 memo＝85.3 毫秒。中間那個比「不做最佳化」還慢 —— 成因不在 useMemo 那一行，在上游。</text>
  <text x="892" y="1016" class="ts">每次 render 省下的時間：10 筆＝0.4 微秒、100 筆＝7.7 微秒、1000 筆＝128 微秒、10000 筆＝1886 微秒。</text>
  <text x="892" y="1038" class="ts">一格畫面的預算是 16700 微秒（60fps）。所以連一萬筆也只用掉一格的一成多。</text>
  <text x="892" y="1060" class="ts">React 官方原話：「If your code doesn't work without it, find the underlying problem and fix it first.」</text>
</svg>
