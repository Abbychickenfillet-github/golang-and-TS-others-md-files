<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="720" height="470" fill="#fdfdfb"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">WebTransport 的兩個獨立座標軸</text>
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#6b7280">方向性（單向／雙向）跟 可靠性（Stream／Datagram）是兩件事 不要混為一談</text>

  <!-- axes -->
  <line x1="150" y1="390" x2="660" y2="390" stroke="#374151" stroke-width="2"/>
  <line x1="150" y1="390" x2="150" y2="110" stroke="#374151" stroke-width="2"/>
  <text x="410" y="422" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">方向性 →</text>
  <text x="132" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#374151" transform="rotate(-90 132 250)">可靠性 →</text>

  <text x="270" y="412" text-anchor="middle" font-size="13" fill="#6b7280">單向 Unidirectional</text>
  <text x="540" y="412" text-anchor="middle" font-size="13" fill="#6b7280">雙向 Bidirectional</text>
  <text x="140" y="330" text-anchor="end" font-size="13" fill="#6b7280">不可靠</text>
  <text x="140" y="185" text-anchor="end" font-size="13" fill="#6b7280">可靠</text>

  <!-- quadrant boxes -->
  <rect x="175" y="130" width="195" height="110" rx="10" fill="#e8f2ff" stroke="#7ba7e8" stroke-width="1.5"/>
  <text x="272" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Unidirectional Stream</text>
  <text x="272" y="180" text-anchor="middle" font-size="12" fill="#374151">單向 ＋ 可靠 ＋ 保證順序</text>
  <text x="272" y="200" text-anchor="middle" font-size="12" fill="#374151">掉包會自動重傳 有背壓機制</text>
  <text x="272" y="222" text-anchor="middle" font-size="12" fill="#166534">用途 檔案上傳 大型 JSON</text>

  <rect x="440" y="130" width="195" height="110" rx="10" fill="#e6f7ea" stroke="#63b880" stroke-width="1.5"/>
  <text x="537" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Bidirectional Stream</text>
  <text x="537" y="180" text-anchor="middle" font-size="12" fill="#374151">雙向 ＋ 可靠 ＋ 保證順序</text>
  <text x="537" y="200" text-anchor="middle" font-size="12" fill="#374151">行為最接近 TCP／WebSocket</text>
  <text x="537" y="222" text-anchor="middle" font-size="12" fill="#166534">用途 一般請求回應往返</text>

  <rect x="175" y="275" width="460" height="95" rx="10" fill="#ffeef5" stroke="#e884ac" stroke-width="1.5"/>
  <text x="405" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">Datagrams（資料報）</text>
  <text x="405" y="324" text-anchor="middle" font-size="12" fill="#374151">不可靠 ＋ 不保證順序 ＋ 無背壓 ＋ 受 MTU 限制約 1KB</text>
  <text x="405" y="346" text-anchor="middle" font-size="12" fill="#374151">兩端都能各自發送 行為最接近 UDP</text>
  <text x="405" y="364" text-anchor="middle" font-size="12" fill="#9d174d">用途 遊戲座標 語音影音 每 16ms 就有新值 舊值重傳沒意義</text>

  <!-- footer note -->
  <rect x="150" y="82" width="510" height="26" rx="6" fill="#fff8d6" stroke="#e3cf6a"/>
  <text x="405" y="100" text-anchor="middle" font-size="12.5" fill="#78350f">底層是 HTTP/3（QUIC）連線本身永遠雙向 三種模式只是連線上劃分出的傳輸管道</text>
</svg>
