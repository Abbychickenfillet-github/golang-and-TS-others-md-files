<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b5cf6"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="980" height="620" fill="#fbfbfd"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#111827">getPrototypeOf 只往上跳「一階」，不是跳到頂</text>
  <text x="30" y="58" font-size="12.5" fill="#6b7280">這就是為什麼 [] 跟 new Map() 的答案不是 Object.prototype</text>

  <!-- 三條鏈 -->
  <!-- chain 1: {} -->
  <text x="120" y="96" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">plain object</text>
  <rect x="30" y="108" width="180" height="46" rx="9" fill="#ecfdf5" stroke="#10b981"/>
  <text x="120" y="130" font-size="13" text-anchor="middle" fill="#065f46" font-family="monospace">{}</text>
  <text x="120" y="146" font-size="10.5" text-anchor="middle" fill="#6b7280">你自己放的屬性</text>

  <path d="M120,154 L120,196" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a1)"/>
  <text x="130" y="180" font-size="10.5" fill="#8b5cf6" font-weight="700">第 1 階</text>

  <rect x="30" y="198" width="180" height="46" rx="9" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="120" y="220" font-size="12.5" text-anchor="middle" fill="#5b21b6" font-family="monospace">Object.prototype</text>
  <text x="120" y="236" font-size="10.5" text-anchor="middle" fill="#6b7280">12 個成員</text>

  <path d="M120,244 L120,286" stroke="#9ca3af" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="30" y="288" width="180" height="36" rx="9" fill="#111827"/>
  <text x="120" y="311" font-size="12" text-anchor="middle" fill="#f9fafb" font-family="monospace">null</text>

  <!-- chain 2: [] -->
  <text x="370" y="96" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle">陣列 Array</text>
  <rect x="280" y="108" width="180" height="46" rx="9" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="370" y="130" font-size="13" text-anchor="middle" fill="#92400e" font-family="monospace">[]</text>
  <text x="370" y="146" font-size="10.5" text-anchor="middle" fill="#6b7280">元素與 length</text>

  <path d="M370,154 L370,196" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a1)"/>
  <text x="380" y="180" font-size="10.5" fill="#8b5cf6" font-weight="700">第 1 階 ← 停在這</text>

  <rect x="280" y="198" width="180" height="46" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="370" y="220" font-size="12.5" text-anchor="middle" fill="#92400e" font-family="monospace">Array.prototype</text>
  <text x="370" y="236" font-size="10.5" text-anchor="middle" fill="#6b7280">40 個｜push map filter</text>

  <path d="M370,244 L370,286" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a1)"/>
  <text x="380" y="270" font-size="10.5" fill="#8b5cf6">第 2 階</text>

  <rect x="280" y="288" width="180" height="46" rx="9" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="370" y="310" font-size="12.5" text-anchor="middle" fill="#5b21b6" font-family="monospace">Object.prototype</text>
  <text x="370" y="326" font-size="10.5" text-anchor="middle" fill="#6b7280">還是走得到，只是不在第 1 階</text>

  <path d="M370,334 L370,376" stroke="#9ca3af" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="280" y="378" width="180" height="36" rx="9" fill="#111827"/>
  <text x="370" y="401" font-size="12" text-anchor="middle" fill="#f9fafb" font-family="monospace">null</text>

  <!-- chain 3: Map -->
  <text x="620" y="96" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="middle">Map 物件</text>
  <rect x="530" y="108" width="180" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="620" y="130" font-size="13" text-anchor="middle" fill="#1e40af" font-family="monospace">new Map()</text>
  <text x="620" y="146" font-size="10.5" text-anchor="middle" fill="#6b7280">內部插槽存資料</text>

  <path d="M620,154 L620,196" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a1)"/>
  <text x="630" y="180" font-size="10.5" fill="#8b5cf6" font-weight="700">第 1 階 ← 停在這</text>

  <rect x="530" y="198" width="180" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="620" y="220" font-size="12.5" text-anchor="middle" fill="#1e40af" font-family="monospace">Map.prototype</text>
  <text x="620" y="236" font-size="10.5" text-anchor="middle" fill="#6b7280">11 個｜get set has size</text>

  <path d="M620,244 L620,286" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a1)"/>
  <text x="630" y="270" font-size="10.5" fill="#8b5cf6">第 2 階</text>

  <rect x="530" y="288" width="180" height="46" rx="9" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="620" y="310" font-size="12.5" text-anchor="middle" fill="#5b21b6" font-family="monospace">Object.prototype</text>
  <text x="620" y="326" font-size="10.5" text-anchor="middle" fill="#6b7280">還是走得到，只是不在第 1 階</text>

  <path d="M620,334 L620,376" stroke="#9ca3af" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="530" y="378" width="180" height="36" rx="9" fill="#111827"/>
  <text x="620" y="401" font-size="12" text-anchor="middle" fill="#f9fafb" font-family="monospace">null</text>

  <!-- 右側說明 -->
  <rect x="750" y="108" width="200" height="306" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="768" y="134" font-size="13" font-weight="700" fill="#111827">一句話</text>
  <text x="768" y="158" font-size="11.5" fill="#374151">getPrototypeOf 是</text>
  <text x="768" y="176" font-size="11.5" fill="#374151">「上一階是誰」，</text>
  <text x="768" y="194" font-size="11.5" fill="#374151">不是「最上面是誰」。</text>
  <line x1="768" y1="210" x2="932" y2="210" stroke="#e5e7eb"/>
  <text x="768" y="234" font-size="11.5" fill="#dc2626" font-weight="700">三條鏈的終點都一樣</text>
  <text x="768" y="252" font-size="11.5" fill="#6b7280">都是 Object.prototype</text>
  <text x="768" y="270" font-size="11.5" fill="#6b7280">再到 null。差別只在</text>
  <text x="768" y="288" font-size="11.5" fill="#6b7280">中間多不多一層。</text>
  <line x1="768" y1="304" x2="932" y2="304" stroke="#e5e7eb"/>
  <text x="768" y="328" font-size="11.5" fill="#065f46" font-weight="700">所以判準是</text>
  <text x="768" y="346" font-size="11.5" fill="#374151">「第 1 階是不是</text>
  <text x="768" y="364" font-size="11.5" fill="#374151">Object.prototype」，</text>
  <text x="768" y="382" font-size="11.5" fill="#374151">不是「鏈上有沒有它」。</text>

  <!-- 底部對照 -->
  <rect x="30" y="440" width="920" height="130" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="48" y="466" font-size="13" font-weight="700" fill="#111827">那多出來的一層裝了什麼</text>

  <rect x="48" y="480" width="286" height="72" rx="9" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="62" y="500" font-size="11.5" font-family="monospace" fill="#92400e">Array.prototype  40 個自有屬性</text>
  <text x="62" y="518" font-size="11" fill="#6b7280">push｜pop｜map｜filter｜reduce｜length…</text>
  <text x="62" y="538" font-size="11" fill="#dc2626">({}).push 是 undefined，plain object 沒有</text>

  <rect x="346" y="480" width="286" height="72" rx="9" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="360" y="500" font-size="11.5" font-family="monospace" fill="#1e40af">Map.prototype  11 個自有屬性</text>
  <text x="360" y="518" font-size="11" fill="#6b7280">get｜set｜has｜delete｜size｜clear…</text>
  <text x="360" y="538" font-size="11" fill="#dc2626">key 可以是任意型別，物件不行</text>

  <rect x="644" y="480" width="286" height="72" rx="9" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="658" y="500" font-size="11.5" font-family="monospace" fill="#5b21b6">Object.prototype  12 個自有屬性</text>
  <text x="658" y="518" font-size="11" fill="#6b7280">toString｜valueOf｜hasOwnProperty…</text>
  <text x="658" y="538" font-size="11" fill="#059669">三者共用，[] 也拿得到 hasOwnProperty</text>

  <text x="30" y="600" font-size="10.5" fill="#9ca3af">資料來源 MDN Object.getPrototypeOf｜MDN Inheritance and the prototype chain｜實測環境 Node.js v22 的 V8｜圖 2026-08-19</text>
</svg>
