<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#5b4bd6"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#c2255c"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1a7f4b"/></marker>
  </defs>
  <rect width="900" height="620" fill="#faf9f7"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">前端驗證的三條繞過路徑，以及後端這道最後防線</text>
  <text x="450" y="53" text-anchor="middle" font-size="12.5" fill="#6b7280">ISO 5807 流程圖記法：圓角＝起訖，矩形＝處理，菱形＝判斷，平行四邊形＝輸入輸出</text>

  <!-- start -->
  <rect x="60" y="78" width="180" height="40" rx="20" fill="#efeafe" stroke="#c9bdf7"/>
  <text x="150" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#5b4bd6">使用者填完表單</text>

  <!-- normal path -->
  <line x1="150" y1="118" x2="150" y2="146" stroke="#5b4bd6" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="55" y="150" width="190" height="46" rx="6" fill="#fff" stroke="#c9bdf7" stroke-width="1.6"/>
  <text x="150" y="170" text-anchor="middle" font-size="12.5" fill="#2b2b2b">前端即時驗證</text>
  <text x="150" y="188" text-anchor="middle" font-size="11" fill="#6b7280">HTML5 屬性 / JS / Zod</text>
  <text x="258" y="177" font-size="11" fill="#5b4bd6">目的：使用者體驗</text>

  <!-- bypass box -->
  <rect x="470" y="78" width="380" height="150" rx="10" fill="#fdf1f4" stroke="#f3cdd8" stroke-width="1.6"/>
  <text x="660" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#c2255c">攻擊者的三條繞過路徑</text>
  <text x="488" y="126" font-size="12" fill="#444">① 關掉瀏覽器 JavaScript → JS 驗證整組不執行</text>
  <text x="488" y="152" font-size="12" fill="#444">② F12 刪掉 &lt;input required&gt; → HTML5 驗證失效</text>
  <text x="488" y="178" font-size="12" fill="#444">③ 用 Postman / curl 直接打 API → 根本沒經過前端</text>
  <text x="488" y="208" font-size="11.5" font-weight="700" fill="#c2255c">共通點：前端程式碼在使用者的電腦上，他說了算</text>

  <!-- bypass arrow -->
  <path d="M470 150 L300 150" stroke="#c2255c" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <path d="M470 205 C 380 205, 360 260, 330 268" stroke="#c2255c" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
  <text x="392" y="252" font-size="11.5" font-weight="700" fill="#c2255c">直接空降到這裡 ↓</text>

  <!-- server boundary -->
  <rect x="45" y="262" width="560" height="272" rx="12" fill="#fff" stroke="#bfe8cf" stroke-width="2.2"/>
  <rect x="45" y="262" width="560" height="32" rx="12" fill="#eefaf2"/>
  <text x="325" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a7f4b">後端伺服器 — 第一道，也是最後一道防線</text>

  <rect x="80" y="310" width="200" height="44" rx="6" fill="#fff" stroke="#bfe8cf"/>
  <text x="180" y="337" text-anchor="middle" font-size="12.5" fill="#2b2b2b">① 必填與型別檢查</text>
  <line x1="180" y1="354" x2="180" y2="374" stroke="#1a7f4b" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="80" y="378" width="200" height="44" rx="6" fill="#fff" stroke="#bfe8cf"/>
  <text x="180" y="405" text-anchor="middle" font-size="12.5" fill="#2b2b2b">② 格式檢查（正規表示式）</text>
  <line x1="180" y1="422" x2="180" y2="442" stroke="#1a7f4b" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="80" y="446" width="200" height="56" rx="6" fill="#fff" stroke="#bfe8cf"/>
  <text x="180" y="468" text-anchor="middle" font-size="12.5" fill="#2b2b2b">③ 查資料庫比對</text>
  <text x="180" y="488" text-anchor="middle" font-size="10.5" fill="#6b7280">Email 重複？庫存夠？有權限？</text>

  <!-- decision -->
  <polygon points="420,340 500,390 420,440 340,390" fill="#fffbe9" stroke="#f0e0a8" stroke-width="1.8"/>
  <text x="420" y="386" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b5a1e">全部通過？</text>
  <text x="420" y="404" text-anchor="middle" font-size="11" fill="#6b5a1e">驗證結果判斷</text>
  <line x1="280" y1="390" x2="336" y2="390" stroke="#1a7f4b" stroke-width="2" marker-end="url(#a3)"/>

  <!-- fail -->
  <line x1="420" y1="340" x2="420" y2="322" stroke="#c2255c" stroke-width="2"/>
  <line x1="420" y1="322" x2="596" y2="322" stroke="#c2255c" stroke-width="2" marker-end="url(#a2)"/>
  <text x="432" y="316" font-size="11.5" font-weight="700" fill="#c2255c">否</text>
  <polygon points="620,304 830,304 810,340 600,340" fill="#fdf1f4" stroke="#f3cdd8"/>
  <text x="715" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#c2255c">回 HTTP 400 / 422 ＋ 錯誤訊息</text>
  <text x="715" y="360" text-anchor="middle" font-size="11" fill="#6b7280">前端渲染到欄位下方讓使用者修正</text>
  <text x="715" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#c2255c">流程在這裡折返，沒碰到資料庫</text>

  <!-- pass -->
  <line x1="420" y1="440" x2="420" y2="470" stroke="#1a7f4b" stroke-width="2" marker-end="url(#a3)"/>
  <text x="432" y="462" font-size="11.5" font-weight="700" fill="#1a7f4b">是</text>
  <rect x="320" y="474" width="200" height="46" rx="6" fill="#eefaf2" stroke="#bfe8cf"/>
  <text x="420" y="494" text-anchor="middle" font-size="12.5" fill="#2b2b2b">參數化查詢寫入資料庫</text>
  <text x="420" y="512" text-anchor="middle" font-size="10.5" fill="#6b7280">回 200 / 201</text>

  <!-- caution -->
  <rect x="620" y="400" width="240" height="120" rx="10" fill="#f4efff" stroke="#d9cdf9"/>
  <text x="740" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b4bd6">容易混淆的兩件事</text>
  <text x="636" y="450" font-size="11.5" fill="#444">驗證 = 這筆資料「該不該收」</text>
  <text x="636" y="472" font-size="11.5" fill="#444">參數化查詢 / escaping</text>
  <text x="636" y="490" font-size="11.5" fill="#444">= 收下之後「怎麼安全地存與顯示」</text>
  <text x="636" y="512" font-size="11.5" font-weight="700" fill="#c2255c">通過驗證不等於可以省略後者</text>

  <!-- footer -->
  <rect x="45" y="552" width="805" height="48" rx="10" fill="#fffbe9" stroke="#f0e0a8"/>
  <text x="62" y="572" font-size="12" fill="#6b5a1e">心法：前端驗證是為了體驗（即時紅字、少打無效請求），後端驗證是為了安全（擋 SQL Injection、XSS、越權）。</text>
  <text x="62" y="590" font-size="12" fill="#6b5a1e">規則最好只寫一份 schema（Zod / Yup / Pydantic）兩邊共用，避免「前端說可以、後端說不行」。</text>
</svg>
