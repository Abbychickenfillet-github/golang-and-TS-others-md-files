<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="740" height="520" fill="#fdfdfb"/>
  <text x="370" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Node.js 是「執行環境」不是「打包工具」</text>
  <text x="370" y="55" text-anchor="middle" font-size="13" fill="#6b7280">層級關係 以及 npm run serve 為什麼會用到 Node.js</text>

  <!-- layered box -->
  <rect x="40" y="76" width="400" height="210" rx="12" fill="#f6f6f4" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="240" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">你的電腦／本機作業系統</text>

  <rect x="60" y="110" width="360" height="160" rx="10" fill="#e8f2ff" stroke="#7ba7e8" stroke-width="1.5"/>
  <text x="240" y="132" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">Node.js（JavaScript Runtime 執行環境）</text>
  <text x="240" y="151" text-anchor="middle" font-size="11.5" fill="#374151">提供 fs 讀寫檔案 net 網路 環境變數 等瀏覽器沒有的能力</text>

  <rect x="80" y="164" width="320" height="88" rx="10" fill="#e6f7ea" stroke="#63b880" stroke-width="1.5"/>
  <text x="240" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">打包工具（npm 套件 用 JS 寫的）</text>
  <text x="240" y="207" text-anchor="middle" font-size="12" fill="#374151">Webpack ／ Rollup ／ Parcel ／ Babel</text>
  <text x="240" y="228" text-anchor="middle" font-size="11.5" fill="#6b7280">執行方式 node node_modules/webpack/bin/webpack.js</text>
  <text x="240" y="246" text-anchor="middle" font-size="11.5" fill="#6b7280">生態豐富 外掛多 但速度較慢</text>

  <!-- native tools -->
  <rect x="460" y="76" width="240" height="210" rx="12" fill="#fff4e6" stroke="#e0a35c" stroke-width="1.5"/>
  <text x="580" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">不需要 Node.js 的原生打包工具</text>
  <text x="580" y="120" text-anchor="middle" font-size="11.5" fill="#374151">編譯成機器碼 直接跑在作業系統上</text>
  <text x="480" y="146" font-size="12" fill="#374151">・esbuild　→ Go</text>
  <text x="480" y="168" font-size="12" fill="#374151">・SWC　　→ Rust（取代 Babel）</text>
  <text x="480" y="190" font-size="12" fill="#374151">・Rspack　→ Rust（重寫 Webpack）</text>
  <text x="480" y="212" font-size="12" fill="#374151">・Rolldown → Rust（將取代 Rollup）</text>
  <text x="580" y="244" text-anchor="middle" font-size="11.5" fill="#9a3412">效能約快 10～100 倍</text>
  <text x="580" y="266" text-anchor="middle" font-size="11.5" fill="#6b7280">但設定檔與外掛仍是 JS 故仍需 Node 當膠水層</text>

  <!-- dev server flow -->
  <text x="40" y="322" font-size="15" font-weight="700" fill="#1f2937">npm run serve 啟動的 Dev Server 在哪裡</text>

  <rect x="40" y="338" width="180" height="60" rx="10" fill="#e8f2ff" stroke="#7ba7e8" stroke-width="1.5"/>
  <text x="130" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">瀏覽器</text>
  <text x="130" y="382" text-anchor="middle" font-size="11.5" fill="#374151">localhost:8080/api/users</text>

  <rect x="280" y="330" width="200" height="76" rx="10" fill="#e6f7ea" stroke="#63b880" stroke-width="1.5"/>
  <text x="380" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Dev Server（本機 Node.js）</text>
  <text x="380" y="372" text-anchor="middle" font-size="11.5" fill="#374151">webpack-dev-server＝Express</text>
  <text x="380" y="392" text-anchor="middle" font-size="11.5" fill="#374151">＋ http-proxy-middleware</text>

  <rect x="540" y="338" width="160" height="60" rx="10" fill="#fff4e6" stroke="#e0a35c" stroke-width="1.5"/>
  <text x="620" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">真正的後端 API</text>
  <text x="620" y="382" text-anchor="middle" font-size="11.5" fill="#374151">api.example.com</text>

  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker></defs>
  <line x1="222" y1="368" x2="276" y2="368" stroke="#6b7280" stroke-width="2" marker-end="url(#b)"/>
  <line x1="482" y1="368" x2="536" y2="368" stroke="#6b7280" stroke-width="2" marker-end="url(#b)"/>
  <text x="380" y="424" text-anchor="middle" font-size="11.5" fill="#6b7280">同源 不觸發 CORS</text>
  <text x="620" y="424" text-anchor="middle" font-size="11.5" fill="#6b7280">Server 對 Server 不受同源政策管</text>

  <rect x="40" y="440" width="660" height="60" rx="8" fill="#fff8d6" stroke="#e3cf6a"/>
  <text x="370" y="462" text-anchor="middle" font-size="12.5" fill="#78350f">HMR 熱重載走的是 WebSocket 由 Node 端主動通知瀏覽器更新（Node 原生沒有 WebSocket 模組 靠 ws／sockjs 套件）</text>
  <text x="370" y="486" text-anchor="middle" font-size="12.5" fill="#78350f">警告 devServer.proxy 只存在於開發階段 npm run build 之後代理設定不會被打包 正式環境要改用 Nginx 反向代理</text>
</svg>
