<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C2185B"/>
    </marker>
    <marker id="ag" markerWidth="11" markerHeight="11" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00897B"/>
    </marker>
    <marker id="ao" markerWidth="11" markerHeight="11" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#EF6C00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1050" fill="#fffafc"/>
  <text x="410" y="36" font-size="20" font-weight="700" fill="#4A0033" text-anchor="middle">Array.prototype.find() 的真實流程</text>
  <text x="410" y="60" font-size="13" fill="#7B1FA2" text-anchor="middle">重點：它是一個「會回頭」的迴圈，不是一條直線</text>

  <!-- start -->
  <rect x="300" y="82" width="220" height="46" rx="23" fill="#fff" stroke="#C2185B" stroke-width="2.4"/>
  <text x="410" y="111" font-size="15" font-weight="700" fill="#4A0033" text-anchor="middle">呼叫 arr.find(callbackFn)</text>

  <line x1="410" y1="128" x2="410" y2="156" stroke="#C2185B" stroke-width="2.4" marker-end="url(#a)"/>

  <!-- i=0 -->
  <rect x="320" y="158" width="180" height="44" rx="9" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2"/>
  <text x="410" y="186" font-size="15" fill="#4a148c" text-anchor="middle" font-weight="700">index i = 0</text>

  <line x1="410" y1="202" x2="410" y2="232" stroke="#C2185B" stroke-width="2.4" marker-end="url(#a)"/>

  <!-- loop guard diamond -->
  <path d="M410 236 L560 292 L410 348 L260 292 Z" fill="#e3f2fd" stroke="#1565C0" stroke-width="2.4"/>
  <text x="410" y="286" font-size="14" fill="#0d47a1" text-anchor="middle" font-weight="700">i &lt; arr.length ？</text>
  <text x="410" y="306" font-size="11.5" fill="#1565C0" text-anchor="middle">還有元素沒看過嗎</text>
  <text x="575" y="286" font-size="13" fill="#c62828" font-weight="700">否</text>
  <text x="424" y="372" font-size="13" fill="#00897B" font-weight="700">是</text>

  <!-- no -> undefined -->
  <line x1="560" y1="292" x2="668" y2="292" stroke="#C2185B" stroke-width="2.4"/>
  <line x1="668" y1="292" x2="668" y2="858" stroke="#C2185B" stroke-width="2.4" marker-end="url(#a)"/>
  <rect x="588" y="190" width="292" height="84" rx="9" fill="#fff3e0" stroke="#EF6C00" stroke-width="1.8"/>
  <text x="604" y="216" font-size="12.5" fill="#e65100" font-weight="700">走完整個陣列都沒有任何一次</text>
  <text x="604" y="238" font-size="12.5" fill="#e65100" font-weight="700">回傳 truthy</text>
  <text x="604" y="262" font-size="12" fill="#b26a00">→ 這時候才回 undefined</text>

  <line x1="410" y1="348" x2="410" y2="384" stroke="#00897B" stroke-width="2.4" marker-end="url(#ag)"/>

  <!-- call callback -->
  <rect x="248" y="386" width="324" height="96" rx="10" fill="#fff" stroke="#00897B" stroke-width="2.4"/>
  <text x="410" y="412" font-size="14.5" fill="#004d40" text-anchor="middle" font-weight="700">執行 callbackFn(element, index, array)</text>
  <text x="410" y="436" font-size="12.5" fill="#6b7280" text-anchor="middle">element = arr[i]　index = i　array = arr</text>
  <text x="410" y="458" font-size="12.5" fill="#00897B" text-anchor="middle">三個參數都是 find 幫你傳的，你可以只收前面幾個</text>
  <text x="410" y="475" font-size="11.5" fill="#b26a00" text-anchor="middle">（有第二參數 thisArg 時，callback 裡的 this 會被指定）</text>

  <line x1="410" y1="482" x2="410" y2="514" stroke="#00897B" stroke-width="2.4" marker-end="url(#ag)"/>

  <!-- truthy diamond -->
  <path d="M410 518 L588 582 L410 646 L232 582 Z" fill="#fff8e1" stroke="#FF8F00" stroke-width="2.6"/>
  <text x="410" y="574" font-size="14" fill="#e65100" text-anchor="middle" font-weight="700">callbackFn 的回傳值</text>
  <text x="410" y="595" font-size="14" fill="#e65100" text-anchor="middle" font-weight="700">是 truthy 嗎 ？</text>
  <text x="410" y="616" font-size="11" fill="#b26a00" text-anchor="middle">內部做 ToBoolean()</text>
  <text x="200" y="576" font-size="13" fill="#c62828" font-weight="700">falsy</text>
  <text x="604" y="576" font-size="13" fill="#00897B" font-weight="700">truthy</text>

  <!-- falsy -> i++ -> back to guard （這條線就是原稿缺的） -->
  <path d="M232 582 L180 582 L180 696" fill="none" stroke="#EF6C00" stroke-width="3" marker-end="url(#ao)"/>
  <rect x="90" y="700" width="180" height="48" rx="9" fill="#fff3e0" stroke="#EF6C00" stroke-width="2.4"/>
  <text x="180" y="730" font-size="15" fill="#e65100" text-anchor="middle" font-weight="700">i = i + 1</text>
  <path d="M180 748 L180 796 L46 796 L46 292 L256 292" fill="none" stroke="#EF6C00" stroke-width="3" marker-end="url(#ao)"/>
  <text x="60" y="500" font-size="13" fill="#EF6C00" font-weight="700" transform="rotate(-90 60 500)" text-anchor="middle">回頭看下一個元素（這就是迴圈）</text>

  <!-- truthy -> return element -->
  <line x1="588" y1="582" x2="636" y2="582" stroke="#00897B" stroke-width="2.8"/>
  <line x1="636" y1="582" x2="636" y2="700" stroke="#00897B" stroke-width="2.8" marker-end="url(#ag)"/>
  <rect x="470" y="702" width="332" height="86" rx="10" fill="#e0f2f1" stroke="#00897B" stroke-width="2.8"/>
  <text x="636" y="728" font-size="15" fill="#004d40" text-anchor="middle" font-weight="700">回傳 arr[i] —— 那個「元素本身」</text>
  <text x="636" y="750" font-size="12.5" fill="#c62828" text-anchor="middle" font-weight="700">⚠️ 不是回傳 callbackFn 的 truthy 值</text>
  <text x="636" y="772" font-size="12.5" fill="#00695c" text-anchor="middle">立刻停止，後面的元素完全不看（短路 short-circuit）</text>

  <line x1="636" y1="788" x2="636" y2="856" stroke="#00897B" stroke-width="2.8" marker-end="url(#ag)"/>

  <!-- end -->
  <rect x="540" y="858" width="196" height="46" rx="23" fill="#fff" stroke="#4A0033" stroke-width="2.4"/>
  <text x="638" y="887" font-size="15" font-weight="700" fill="#4A0033" text-anchor="middle">結束</text>

  <!-- warning box -->
  <rect x="30" y="828" width="486" height="188" rx="12" fill="#fff0f6" stroke="#C2185B" stroke-width="2"/>
  <text x="48" y="856" font-size="14" fill="#4A0033" font-weight="700">⚠️ 手繪版最容易畫錯的三個地方</text>
  <text x="48" y="886" font-size="12.5" fill="#880e4f" font-weight="700">1. 沒有畫「回頭」的箭頭</text>
  <text x="64" y="906" font-size="12" fill="#6b7280">find 是迴圈，falsy 要回去看下一個，不是直接結束</text>
  <text x="48" y="934" font-size="12.5" fill="#880e4f" font-weight="700">2. falsy 不等於「回傳 undefined」</text>
  <text x="64" y="954" font-size="12" fill="#6b7280">falsy 是「這一格不合格，繼續」；走完全部才回 undefined</text>
  <text x="48" y="982" font-size="12.5" fill="#880e4f" font-weight="700">3. 回傳的是「元素」不是 callback 的回傳值</text>
  <text x="64" y="1002" font-size="12" fill="#6b7280">這正是 find 與 filter / some / map 的分界點</text>
</svg>
