<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5b4bd6"/>
    </marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d1477a"/>
    </marker>
    <marker id="arx" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b9b6b0"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#faf9f7"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">HTTP Headers 的方向性 — 誰產生、送給誰、用完怎麼處理</text>
  <text x="450" y="56" text-anchor="middle" font-size="12.5" fill="#6b7280">一次請求裡有兩包 header，方向剛好相反</text>

  <!-- client box -->
  <rect x="40" y="90" width="230" height="300" rx="12" fill="#fff" stroke="#e7e5e1" stroke-width="2"/>
  <rect x="40" y="90" width="230" height="38" rx="12" fill="#efeafe"/>
  <text x="155" y="115" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b4bd6">Client（瀏覽器）</text>
  <text x="58" y="152" font-size="12.5" fill="#2b2b2b">產生 Request Headers：</text>
  <text x="70" y="176" font-size="12" fill="#444">• User-Agent</text>
  <text x="70" y="196" font-size="12" fill="#444">• Cookie</text>
  <text x="70" y="216" font-size="12" fill="#444">• Accept</text>
  <text x="70" y="236" font-size="12" fill="#444">• Authorization / x-goog-api-key</text>
  <line x1="58" y1="254" x2="252" y2="254" stroke="#e7e5e1"/>
  <text x="58" y="278" font-size="12.5" fill="#2b2b2b">收到 Response Headers 之後：</text>
  <text x="70" y="300" font-size="12" fill="#1a7f4b">✓ 拿來處理「這一次」的回應</text>
  <text x="70" y="320" font-size="12" fill="#c2255c">✗ 不會再回傳給伺服器</text>
  <rect x="62" y="336" width="186" height="38" rx="8" fill="#fdf1f4" stroke="#f3cdd8"/>
  <text x="155" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#c2255c">用完即丟（單向）</text>

  <!-- server box -->
  <rect x="630" y="90" width="230" height="300" rx="12" fill="#fff" stroke="#e7e5e1" stroke-width="2"/>
  <rect x="630" y="90" width="230" height="38" rx="12" fill="#fdeaf2"/>
  <text x="745" y="115" text-anchor="middle" font-size="14.5" font-weight="700" fill="#d1477a">Server（伺服器）</text>
  <text x="648" y="152" font-size="12.5" fill="#2b2b2b">產生 Response Headers：</text>
  <text x="660" y="176" font-size="12" fill="#444">• Content-Type</text>
  <text x="660" y="196" font-size="12" fill="#444">• Content-Encoding: gzip</text>
  <text x="660" y="216" font-size="12" fill="#444">• Cross-Origin-Opener-Policy</text>
  <text x="660" y="236" font-size="12" fill="#444">• Set-Cookie</text>
  <line x1="648" y1="254" x2="842" y2="254" stroke="#e7e5e1"/>
  <text x="648" y="278" font-size="12.5" fill="#2b2b2b">收到 Request Headers 之後：</text>
  <text x="660" y="300" font-size="12" fill="#1a7f4b">✓ 判斷你是誰、要什麼格式</text>
  <text x="660" y="320" font-size="12" fill="#1a7f4b">✓ 驗證 API 金鑰</text>
  <rect x="652" y="336" width="186" height="38" rx="8" fill="#eefaf2" stroke="#bfe8cf"/>
  <text x="745" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7f4b">每個請求各自一包</text>

  <!-- arrows -->
  <line x1="272" y1="170" x2="626" y2="170" stroke="#5b4bd6" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="368" y="140" width="164" height="24" rx="6" fill="#efeafe"/>
  <text x="450" y="157" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b4bd6">① Request Headers ↑</text>

  <line x1="626" y1="230" x2="272" y2="230" stroke="#d1477a" stroke-width="2.5" marker-end="url(#ar2)"/>
  <rect x="362" y="200" width="176" height="24" rx="6" fill="#fdeaf2"/>
  <text x="450" y="217" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d1477a">② Response Headers ↓</text>

  <line x1="272" y1="300" x2="626" y2="300" stroke="#b9b6b0" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arx)"/>
  <rect x="330" y="272" width="240" height="24" rx="6" fill="#f0efec"/>
  <text x="450" y="289" text-anchor="middle" font-size="12" font-weight="700" fill="#8a8781">③ 這條線不存在（常見誤解）</text>
  <text x="450" y="322" text-anchor="middle" font-size="11.5" fill="#8a8781">瀏覽器不會把 Response Headers 原封不動送回去</text>

  <!-- footer note -->
  <rect x="40" y="406" width="820" height="44" rx="10" fill="#fffbe9" stroke="#f0e0a8"/>
  <text x="58" y="425" font-size="12" fill="#6b5a1e">驗證方式：F12 → Network → 點任一列 → Headers 分頁。上半 General，中段 Response Headers，下段 Request Headers。</text>
  <text x="58" y="443" font-size="12" fill="#6b5a1e">同一頁的 CSS 請求與 API 請求，Request Headers 內容不一樣，這就是「每個請求各自一包」。</text>
</svg>
