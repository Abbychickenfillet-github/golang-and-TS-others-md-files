<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1180" height="900" fill="#ffffff"/>

  <text x="590" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">同一個動作「改一個值」，兩條路各自做了什麼</text>
  <text x="590" y="70" text-anchor="middle" font-size="15" fill="#666">ISO 5807 符號：六邊形＝初始化　平行四邊形＝資料　矩形＝處理　菱形＝判斷　雙邊線＝副流程　圓形＝連接點</text>

  <!-- 圖例 -->
  <g transform="translate(40,92)">
    <rect x="0" y="0" width="1100" height="46" rx="6" fill="#f6f7f9" stroke="#d8dce2"/>
    <polygon points="22,10 100,10 92,36 14,36" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
    <text x="57" y="27" text-anchor="middle" font-size="12" fill="#1a1a1a">資料</text>
    <rect x="120" y="10" width="78" height="26" fill="#eef7ee" stroke="#3f8f4a" stroke-width="1.5"/>
    <text x="159" y="27" text-anchor="middle" font-size="12" fill="#1a1a1a">處理</text>
    <polygon points="256,8 300,23 256,38 212,23" fill="#fff6e5" stroke="#c98a12" stroke-width="1.5"/>
    <text x="256" y="27" text-anchor="middle" font-size="12" fill="#1a1a1a">判斷</text>
    <polygon points="330,10 396,10 406,23 396,36 330,36 320,23" fill="#f3ecfb" stroke="#7b4fc0" stroke-width="1.5"/>
    <text x="363" y="27" text-anchor="middle" font-size="12" fill="#1a1a1a">初始化</text>
    <rect x="426" y="10" width="96" height="26" fill="#fdeeee" stroke="#c04141" stroke-width="1.5"/>
    <line x1="432" y1="10" x2="432" y2="36" stroke="#c04141" stroke-width="1.5"/>
    <line x1="516" y1="10" x2="516" y2="36" stroke="#c04141" stroke-width="1.5"/>
    <text x="474" y="27" text-anchor="middle" font-size="12" fill="#1a1a1a">副流程</text>
    <circle cx="556" cy="23" r="13" fill="#eceff3" stroke="#5b6472" stroke-width="1.5"/>
    <text x="556" y="27" text-anchor="middle" font-size="11" fill="#1a1a1a">接點</text>
  </g>

  <!-- 分隔線 -->
  <line x1="590" y1="160" x2="590" y2="862" stroke="#d8dce2" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ================= 左：push ================= -->
  <text x="290" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#2a5fb8">push-based（Vue / Solid / Signals）</text>
  <text x="290" y="210" text-anchor="middle" font-size="13" fill="#666">三個零件都做：攔截 → 收集 → 觸發</text>

  <!-- 六邊形 初始化 -->
  <polygon points="180,228 400,228 418,256 400,284 180,284 162,256" fill="#f3ecfb" stroke="#7b4fc0" stroke-width="2"/>
  <text x="290" y="252" text-anchor="middle" font-size="14" fill="#1a1a1a">初始化：reactive(obj)</text>
  <text x="290" y="272" text-anchor="middle" font-size="12" fill="#555">用 Proxy 在真實物件前面放一個替身</text>
  <path d="M290 284 L290 312" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 處理：首次讀取 -->
  <rect x="162" y="312" width="256" height="52" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="290" y="333" text-anchor="middle" font-size="14" fill="#1a1a1a">零件 a 攔截：get trap 被觸發</text>
  <text x="290" y="353" text-anchor="middle" font-size="12" fill="#555">畫面讀 count 這件事被替身看見了</text>
  <path d="M290 364 L290 392" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="162" y="392" width="256" height="52" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="290" y="413" text-anchor="middle" font-size="14" fill="#1a1a1a">零件 b 收集：track(count)</text>
  <text x="290" y="433" text-anchor="middle" font-size="12" fill="#555">把「畫面 A」記進 count 的訂閱清單</text>
  <path d="M290 444 L290 472" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 資料：寫入 -->
  <polygon points="186,472 418,472 394,524 162,524" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/>
  <text x="290" y="496" text-anchor="middle" font-size="14" fill="#1a1a1a">資料：state.count = 1</text>
  <text x="290" y="515" text-anchor="middle" font-size="12" fill="#555">直接賦值，不需要另外通報</text>
  <path d="M290 524 L290 552" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="162" y="552" width="256" height="46" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="290" y="580" text-anchor="middle" font-size="14" fill="#1a1a1a">零件 c 觸發：trigger(count)</text>
  <path d="M290 598 L290 622" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 菱形 判斷 -->
  <polygon points="290,622 420,672 290,722 160,672" fill="#fff6e5" stroke="#c98a12" stroke-width="2"/>
  <text x="290" y="666" text-anchor="middle" font-size="13" fill="#1a1a1a">count 的訂閱清單</text>
  <text x="290" y="684" text-anchor="middle" font-size="13" fill="#1a1a1a">裡面有人嗎</text>
  <text x="276" y="744" text-anchor="end" font-size="12" fill="#3f8f4a" font-weight="700">有 → 只叫醒清單上的那幾個</text>
  <text x="470" y="668" text-anchor="middle" font-size="12" fill="#c04141" font-weight="700">沒有 → 什麼都不做</text>
  <path d="M420 672 L520 672" stroke="#c04141" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M290 722 L290 752" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="162" y="752" width="256" height="52" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="290" y="773" text-anchor="middle" font-size="14" fill="#1a1a1a">更新 1 個 DOM 節點</text>
  <text x="290" y="793" text-anchor="middle" font-size="12" fill="#555">不需要 diff，因為早就知道是誰</text>
  <path d="M290 804 L290 826" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="290" cy="848" r="20" fill="#eceff3" stroke="#5b6472" stroke-width="2"/>
  <text x="290" y="853" text-anchor="middle" font-size="12" fill="#1a1a1a">完成</text>

  <!-- ================= 右：pull ================= -->
  <text x="885" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#b0521f">pull-based（React）</text>
  <text x="885" y="210" text-anchor="middle" font-size="13" fill="#666">三個零件一個都不做：重跑，然後自己比對</text>

  <polygon points="775,228 995,228 1013,256 995,284 775,284 757,256" fill="#f3ecfb" stroke="#7b4fc0" stroke-width="2"/>
  <text x="885" y="252" text-anchor="middle" font-size="14" fill="#1a1a1a">初始化：useState(0)</text>
  <text x="885" y="272" text-anchor="middle" font-size="12" fill="#555">回傳的是普通值，沒有任何替身</text>
  <path d="M885 284 L885 312" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="757" y="312" width="256" height="52" fill="#fdeeee" stroke="#c04141" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="885" y="333" text-anchor="middle" font-size="14" fill="#c04141" font-weight="700">沒有零件 a：讀 count 沒人知道</text>
  <text x="885" y="353" text-anchor="middle" font-size="12" fill="#555">那只是在讀一個普通區域變數</text>
  <path d="M885 364 L885 392" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="757" y="392" width="256" height="52" fill="#fdeeee" stroke="#c04141" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="885" y="413" text-anchor="middle" font-size="14" fill="#c04141" font-weight="700">沒有零件 b：沒有訂閱清單</text>
  <text x="885" y="433" text-anchor="middle" font-size="12" fill="#555">無從得知哪個節點用到了這個值</text>
  <path d="M885 444 L885 472" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <polygon points="781,472 1013,472 989,524 757,524" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/>
  <text x="885" y="496" text-anchor="middle" font-size="14" fill="#1a1a1a">資料：setCount(1)</text>
  <text x="885" y="515" text-anchor="middle" font-size="12" fill="#555">呼叫本身就是唯一的通報手段</text>
  <path d="M885 524 L885 552" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="757" y="552" width="256" height="46" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="885" y="580" text-anchor="middle" font-size="14" fill="#1a1a1a">整個元件函式從頭跑一次</text>
  <path d="M885 598 L885 622" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <polygon points="885,622 1015,672 885,722 755,672" fill="#fff6e5" stroke="#c98a12" stroke-width="2"/>
  <text x="885" y="666" text-anchor="middle" font-size="13" fill="#1a1a1a">Object.is(舊, 新)</text>
  <text x="885" y="684" text-anchor="middle" font-size="13" fill="#1a1a1a">參考一樣嗎</text>
  <text x="672" y="668" text-anchor="middle" font-size="12" fill="#c04141" font-weight="700">一樣 → 跳過</text>
  <text x="672" y="686" text-anchor="middle" font-size="12" fill="#c04141">（原地改物件就卡在這）</text>
  <path d="M755 672 L710 672" stroke="#c04141" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M885 722 L885 752" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="757" y="752" width="256" height="52" fill="#fdeeee" stroke="#c04141" stroke-width="2"/>
  <line x1="765" y1="752" x2="765" y2="804" stroke="#c04141" stroke-width="2"/>
  <line x1="1005" y1="752" x2="1005" y2="804" stroke="#c04141" stroke-width="2"/>
  <text x="885" y="773" text-anchor="middle" font-size="14" fill="#1a1a1a">副流程：diff 整棵樹</text>
  <text x="885" y="793" text-anchor="middle" font-size="12" fill="#555">200 個節點全部比一次，才知道改哪個</text>
  <path d="M885 804 L885 826" stroke="#5b6472" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="885" cy="848" r="20" fill="#eceff3" stroke="#5b6472" stroke-width="2"/>
  <text x="885" y="853" text-anchor="middle" font-size="12" fill="#1a1a1a">完成</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6472"/>
    </marker>
  </defs>
</svg>
