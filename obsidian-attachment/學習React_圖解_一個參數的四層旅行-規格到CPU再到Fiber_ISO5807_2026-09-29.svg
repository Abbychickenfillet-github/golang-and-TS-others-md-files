<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1010" width="1280" height="1010" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1280" height="1010" fill="#ffffff"/>

  <text x="640" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#1a1a1a">一個參數的四層旅行：從規格書寫到 CPU，再寫回 React</text>
  <text x="640" y="66" text-anchor="middle" font-size="14" fill="#666">ISO 5807 符號：六邊形＝初始化　平行四邊形＝資料　矩形＝處理　菱形＝判斷　雙邊線＝副流程　圓形＝連接點</text>

  <defs>
    <marker id="a28" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6472"/>
    </marker>
  </defs>

  <!-- 起點 -->
  <polygon points="470,88 810,88 828,116 810,144 470,144 452,116" fill="#f3ecfb" stroke="#7b4fc0" stroke-width="2"/>
  <text x="640" y="112" text-anchor="middle" font-size="15" fill="#1a1a1a">初始化：你寫了一行 function greet(name) { ... }</text>
  <text x="640" y="133" text-anchor="middle" font-size="12.5" fill="#555">下面四層，是這個 name 接下來要經過的地方</text>
  <path d="M640 144 L640 168" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <!-- ===== 第 1 層：規格層 ===== -->
  <rect x="24" y="170" width="1232" height="140" rx="8" fill="#fbfaff" stroke="#c9bde0"/>
  <text x="44" y="196" font-size="16" font-weight="700" fill="#7b4fc0">第 1 層　規格層（ECMAScript Spec）</text>
  <text x="44" y="216" font-size="12.5" fill="#777">參數在這裡還只是一個語法符號，連值都還沒有</text>

  <polygon points="150,232 360,232 336,292 126,292" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/>
  <text x="243" y="257" text-anchor="middle" font-size="13.5" fill="#1a1a1a">資料：FormalParameter</text>
  <text x="243" y="277" text-anchor="middle" font-size="12" fill="#555">[Yield, Await] 兩個旗標</text>
  <path d="M360 262 L410 262" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <rect x="412" y="234" width="212" height="56" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="518" y="258" text-anchor="middle" font-size="13.5" fill="#1a1a1a">處理：展開成</text>
  <text x="518" y="278" text-anchor="middle" font-size="13" fill="#1a1a1a">BindingElement[?Yield, ?Await]</text>
  <path d="M624 262 L678 262" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <polygon points="800,232 928,262 800,292 672,262" fill="#fff6e5" stroke="#c98a12" stroke-width="2"/>
  <text x="800" y="258" text-anchor="middle" font-size="12.5" fill="#1a1a1a">判斷：外層的</text>
  <text x="800" y="276" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Yield 旗標開著嗎</text>

  <text x="1090" y="250" text-anchor="middle" font-size="12.5" fill="#c04141" font-weight="700">開著 → 參數預設值裡 yield 是保留字</text>
  <text x="1090" y="272" text-anchor="middle" font-size="12.5" fill="#3f8f4a" font-weight="700">沒開 → yield 可以當普通變數名</text>
  <path d="M928 262 L950 262" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>
  <text x="640" y="305" text-anchor="middle" font-size="11.5" fill="#999">那個 ? 是「繼承父層旗標」的巨集，不是三元運算子</text>

  <path d="M640 310 L640 334" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <!-- ===== 第 2 層：引擎層 ===== -->
  <rect x="24" y="336" width="1232" height="126" rx="8" fill="#f7fbf7" stroke="#bcd9c0"/>
  <text x="44" y="362" font-size="16" font-weight="700" fill="#3f8f4a">第 2 層　引擎層（V8 執行 ECMAScript 抽象操作）</text>
  <text x="44" y="382" font-size="12.5" fill="#777">參數在這裡第一次變成「一個可以被讀寫的綁定」</text>

  
  <rect x="150" y="396" width="256" height="52" fill="#fdeeee" stroke="#c04141" stroke-width="2"/>
  <line x1="157" y1="396" x2="157" y2="448" stroke="#c04141" stroke-width="2"/>
  <line x1="399" y1="396" x2="399" y2="448" stroke="#c04141" stroke-width="2"/>
  <text x="278" y="418" text-anchor="middle" font-size="13" fill="#1a1a1a">副流程：10.2.11</text>
  <text x="278" y="438" text-anchor="middle" font-size="12.5" fill="#1a1a1a">FunctionDeclarationInstantiation</text>
  <path d="M406 422 L456 422" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <rect x="458" y="396" width="248" height="52" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="582" y="418" text-anchor="middle" font-size="13.5" fill="#1a1a1a">處理：在環境紀錄裡</text>
  <text x="582" y="438" text-anchor="middle" font-size="12.5" fill="#555">替每個參數建立一個 binding</text>
  <path d="M706 422 L756 422" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <polygon points="782,396 1010,396 986,448 758,448" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/>
  <text x="884" y="418" text-anchor="middle" font-size="13.5" fill="#1a1a1a">資料：Environment Record</text>
  <text x="884" y="438" text-anchor="middle" font-size="12" fill="#555">閉包抓住的就是這個東西</text>

  <path d="M640 462 L640 486" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <!-- ===== 第 3 層：ABI 層 ===== -->
  <rect x="24" y="488" width="1232" height="216" rx="8" fill="#fffdf6" stroke="#e2cf9a"/>
  <text x="44" y="514" font-size="16" font-weight="700" fill="#b0851f">第 3 層　硬體層（System V ABI，x86-64）</text>
  <text x="44" y="534" font-size="12.5" fill="#777">參數在這裡變成暫存器裡的位元；Windows 用的是另一套 Microsoft x64 慣例</text>

  <polygon points="200,548 340,578 200,608 60,578" fill="#fff6e5" stroke="#c98a12" stroke-width="2"/>
  <text x="200" y="574" text-anchor="middle" font-size="12.5" fill="#1a1a1a">判斷：整數還是</text>
  <text x="200" y="592" text-anchor="middle" font-size="12.5" fill="#1a1a1a">浮點數</text>

  <rect x="386" y="540" width="214" height="46" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="493" y="568" text-anchor="middle" font-size="13" fill="#1a1a1a">整數 → rdi, rsi, rdx, rcx, r8, r9</text>
  <path d="M340 570 L384 552" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <rect x="386" y="596" width="214" height="46" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="493" y="624" text-anchor="middle" font-size="13" fill="#1a1a1a">浮點 → xmm0 ～ xmm7（SIMD）</text>
  <path d="M340 586 L384 616" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <polygon points="720,556 848,586 720,616 592,586" fill="#fff6e5" stroke="#c98a12" stroke-width="2"/>
  <text x="720" y="582" text-anchor="middle" font-size="12.5" fill="#1a1a1a">判斷：暫存器</text>
  <text x="720" y="600" text-anchor="middle" font-size="12.5" fill="#1a1a1a">裝得下嗎</text>
  <path d="M600 563 L618 578" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>
  <path d="M600 619 L618 594" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <rect x="884" y="540" width="330" height="46" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="1049" y="568" text-anchor="middle" font-size="13" fill="#1a1a1a">裝得下 → 直接傳值（By Value）</text>
  <path d="M848 578 L882 562" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <polygon points="908,596 1214,596 1190,648 884,648" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/>
  <text x="1049" y="618" text-anchor="middle" font-size="13" fill="#1a1a1a">裝不下或太大 → 推進 Stack Frame</text>
  <text x="1049" y="638" text-anchor="middle" font-size="12" fill="#555">frame 裡有一格叫 return address</text>
  <path d="M848 594 L882 620" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <text x="640" y="678" text-anchor="middle" font-size="12.5" fill="#c04141" font-weight="700">關鍵限制：這個 call stack 你沒有辦法從外面暫停它 —— 它會一路跑到堆疊清空為止</text>
  <path d="M640 686 L640 714" stroke="#c04141" stroke-width="2.5" marker-end="url(#a28)"/>

  <!-- ===== 第 4 層：Fiber 層 ===== -->
  <rect x="24" y="716" width="1232" height="236" rx="8" fill="#fdf7f4" stroke="#e0bfae"/>
  <text x="44" y="742" font-size="16" font-weight="700" fill="#b0521f">第 4 層　框架層（React Fiber）</text>
  <text x="44" y="762" font-size="12.5" fill="#777">因為上面那個限制，React 把 stack frame 從 CPU 手上搶過來自己重寫了一份</text>

  <polygon points="176,776 470,776 446,832 152,832" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/>
  <text x="311" y="800" text-anchor="middle" font-size="13.5" fill="#1a1a1a">資料：一個 fiber 物件</text>
  <text x="311" y="820" text-anchor="middle" font-size="12" fill="#555">官方說法：a virtual stack frame</text>
  <path d="M470 804 L520 804" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <rect x="522" y="776" width="240" height="56" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="642" y="798" text-anchor="middle" font-size="13" fill="#1a1a1a">處理：pendingProps ＝ 參數</text>
  <text x="642" y="820" text-anchor="middle" font-size="13" fill="#1a1a1a">return ＝ return address</text>
  <path d="M762 804 L812 804" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <polygon points="960,772 1116,804 960,836 804,804" fill="#fff6e5" stroke="#c98a12" stroke-width="2"/>
  <text x="960" y="799" text-anchor="middle" font-size="12.5" fill="#1a1a1a">判斷：Object.is(</text>
  <text x="960" y="817" text-anchor="middle" font-size="12.5" fill="#1a1a1a">pendingProps, memoizedProps)</text>

  <text x="1196" y="808" text-anchor="middle" font-size="12.5" fill="#3f8f4a" font-weight="700">一樣 → 重用</text>
  <path d="M1116 804 L1140 804" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <rect x="782" y="862" width="356" height="46" fill="#eef7ee" stroke="#3f8f4a" stroke-width="2"/>
  <text x="960" y="890" text-anchor="middle" font-size="13" fill="#1a1a1a">不一樣 → 重新算這個 fiber 的輸出</text>
  <path d="M960 836 L960 860" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <rect x="152" y="862" width="480" height="46" fill="#fdeeee" stroke="#c04141" stroke-width="2"/>
  <line x1="159" y1="862" x2="159" y2="908" stroke="#c04141" stroke-width="2"/>
  <line x1="625" y1="862" x2="625" y2="908" stroke="#c04141" stroke-width="2"/>
  <text x="392" y="890" text-anchor="middle" font-size="13" fill="#1a1a1a">副流程：走完一格就檢查時間預算，超過就讓出主執行緒</text>
  <path d="M392 832 L392 860" stroke="#5b6472" stroke-width="2" marker-end="url(#a28)"/>

  <circle cx="640" cy="930" r="18" fill="#eceff3" stroke="#5b6472" stroke-width="2"/>
  <text x="640" y="935" text-anchor="middle" font-size="11.5" fill="#1a1a1a">完成</text>
  <path d="M632 908 L638 910" stroke="#5b6472" stroke-width="2"/>

  <text x="640" y="982" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">同一個「參數」，四層各有一套規則；React 的 props 不是比喻成參數，它在實作上就是參數</text>
</svg>
