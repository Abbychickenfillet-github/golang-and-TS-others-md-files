<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="900" height="400" fill="#fbfbfd"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">HTML 在哪一刻長出來 — CSR / SSR / SSG</text>

  <!-- 時間軸分區背景 -->
  <rect x="120" y="52" width="230" height="330" fill="#fff3a3" opacity="0.28" rx="8"/>
  <rect x="350" y="52" width="270" height="330" fill="#bbfabb" opacity="0.28" rx="8"/>
  <rect x="620" y="52" width="255" height="330" fill="#adccff" opacity="0.28" rx="8"/>
  <text x="235" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#7c6f10">Build Time（建置期，只發生一次）</text>
  <text x="485" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#1e6b2e">Runtime — 伺服器（每個請求一次）</text>
  <text x="747" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4e89">Runtime — 瀏覽器</text>

  <!-- CSR -->
  <text x="20" y="128" font-size="15" font-weight="700" fill="#374151">CSR</text>
  <rect x="132" y="105" width="206" height="42" rx="7" fill="#fff" stroke="#d4c53a" stroke-width="1.5"/>
  <text x="235" y="122" text-anchor="middle" font-size="12" fill="#374151">打包 JS bundle</text>
  <text x="235" y="139" text-anchor="middle" font-size="12" fill="#b91c1c">＋空的 index.html（無內容）</text>
  <rect x="362" y="105" width="246" height="42" rx="7" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="485" y="131" text-anchor="middle" font-size="12" fill="#9ca3af">（只當靜態檔伺服器，不渲染）</text>
  <rect x="632" y="105" width="231" height="42" rx="7" fill="#fff" stroke="#5b8dd6" stroke-width="2"/>
  <text x="747" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4e89">執行 JS → 動態建 DOM</text>
  <text x="747" y="139" text-anchor="middle" font-size="12" fill="#374151">★ HTML 在這裡才長出來</text>

  <!-- SSR -->
  <text x="20" y="218" font-size="15" font-weight="700" fill="#374151">SSR</text>
  <rect x="132" y="195" width="206" height="42" rx="7" fill="#fff" stroke="#d4c53a" stroke-width="1.5"/>
  <text x="235" y="212" text-anchor="middle" font-size="12" fill="#374151">打包 server bundle</text>
  <text x="235" y="229" text-anchor="middle" font-size="12" fill="#b91c1c">＋client bundle（仍無頁面 HTML）</text>
  <rect x="362" y="195" width="246" height="42" rx="7" fill="#fff" stroke="#3f9c50" stroke-width="2"/>
  <text x="485" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1e6b2e">抓資料 → renderToString</text>
  <text x="485" y="229" text-anchor="middle" font-size="12" fill="#374151">★ 每個請求現拼一份 HTML</text>
  <rect x="632" y="195" width="231" height="42" rx="7" fill="#fff" stroke="#5b8dd6" stroke-width="1.5"/>
  <text x="747" y="212" text-anchor="middle" font-size="12" fill="#374151">Paint（看得到）</text>
  <text x="747" y="229" text-anchor="middle" font-size="12" fill="#1d4e89">→ hydrateRoot（能互動）</text>

  <!-- SSG -->
  <text x="20" y="308" font-size="15" font-weight="700" fill="#374151">SSG</text>
  <rect x="132" y="285" width="206" height="42" rx="7" fill="#fff" stroke="#d4a017" stroke-width="2"/>
  <text x="235" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#7c6f10">抓資料 → 產出靜態 HTML</text>
  <text x="235" y="319" text-anchor="middle" font-size="12" fill="#374151">★ HTML 在這裡就固定了</text>
  <rect x="362" y="285" width="246" height="42" rx="7" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="485" y="311" text-anchor="middle" font-size="12" fill="#9ca3af">直接回傳建好的檔案（不重算）</text>
  <rect x="632" y="285" width="231" height="42" rx="7" fill="#fff" stroke="#5b8dd6" stroke-width="1.5"/>
  <text x="747" y="311" text-anchor="middle" font-size="12" fill="#374151">Paint → Hydration（同 SSR）</text>

  <!-- 更正提示 -->
  <rect x="20" y="345" width="855" height="38" rx="7" fill="#ffe4ec" stroke="#ff5582" stroke-width="1.5"/>
  <text x="34" y="362" font-size="12.5" font-weight="700" fill="#b91c1c">⚠️ 常見混淆：</text>
  <text x="122" y="362" font-size="12.5" fill="#374151">把「build time 先產好 HTML、runtime 直接回傳」說成 SSR — 那是 SSG。</text>
  <text x="34" y="378" font-size="12.5" fill="#374151">SSR 的關鍵字是 per-request（每個請求現算），所以才能顯示購物車、未讀通知這類即時資料。</text>
</svg>
