<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560"><style>
text{font-family:'Segoe UI','Noto Sans TC','Microsoft JhengHei',Helvetica,Arial,sans-serif}
.mono{font-family:Consolas,'JetBrains Mono',monospace}
#scene{animation:sceneFade 10s infinite}
@keyframes sceneFade{0%{opacity:0}3%{opacity:1}95%{opacity:1}99%{opacity:0}100%{opacity:0}}
@keyframes g13{0%{fill:#2563eb}20%{fill:#2563eb}25%{fill:#3a3f4c}45%{fill:#3a3f4c}50%{fill:#3a3f4c}70%{fill:#3a3f4c}75%{fill:#3a3f4c}99%{fill:#3a3f4c}100%{fill:#2563eb}}
@keyframes g4{0%{fill:#2563eb}20%{fill:#2563eb}25%{fill:#2563eb}45%{fill:#2563eb}50%{fill:#3a3f4c}70%{fill:#3a3f4c}75%{fill:#3a3f4c}99%{fill:#3a3f4c}100%{fill:#2563eb}}
@keyframes g5{0%{fill:#2563eb}20%{fill:#2563eb}25%{fill:#2563eb}45%{fill:#2563eb}50%{fill:#2563eb}70%{fill:#2563eb}75%{fill:#3a3f4c}99%{fill:#3a3f4c}100%{fill:#2563eb}}
@keyframes spmove{0%{transform:translateY(0px)}20%{transform:translateY(0px)}25%{transform:translateY(102px)}45%{transform:translateY(102px)}50%{transform:translateY(136px)}70%{transform:translateY(136px)}75%{transform:translateY(170px)}99%{transform:translateY(170px)}100%{transform:translateY(0px)}}
@keyframes bpmove{0%{transform:translateY(0px)}20%{transform:translateY(0px)}25%{transform:translateY(0px)}45%{transform:translateY(0px)}50%{transform:translateY(102px)}70%{transform:translateY(102px)}75%{transform:translateY(102px)}99%{transform:translateY(102px)}100%{transform:translateY(0px)}}
@keyframes sp0{0%{opacity:1}20%{opacity:1}25%{opacity:0}45%{opacity:0}50%{opacity:0}70%{opacity:0}75%{opacity:0}99%{opacity:0}100%{opacity:1}}
@keyframes sp1{0%{opacity:0}20%{opacity:0}25%{opacity:1}45%{opacity:1}50%{opacity:0}70%{opacity:0}75%{opacity:0}99%{opacity:0}100%{opacity:0}}
@keyframes sp2{0%{opacity:0}20%{opacity:0}25%{opacity:0}45%{opacity:0}50%{opacity:1}70%{opacity:1}75%{opacity:0}99%{opacity:0}100%{opacity:0}}
@keyframes sp3{0%{opacity:0}20%{opacity:0}25%{opacity:0}45%{opacity:0}50%{opacity:0}70%{opacity:0}75%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes bpA{0%{opacity:1}20%{opacity:1}25%{opacity:1}45%{opacity:1}50%{opacity:0}70%{opacity:0}75%{opacity:0}99%{opacity:0}100%{opacity:1}}
@keyframes bpB{0%{opacity:0}20%{opacity:0}25%{opacity:0}45%{opacity:0}50%{opacity:1}70%{opacity:1}75%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes cap0{0%{opacity:1}20%{opacity:1}25%{opacity:0}45%{opacity:0}50%{opacity:0}70%{opacity:0}75%{opacity:0}99%{opacity:0}100%{opacity:1}}
@keyframes cap1{0%{opacity:0}20%{opacity:0}25%{opacity:1}45%{opacity:1}50%{opacity:0}70%{opacity:0}75%{opacity:0}99%{opacity:0}100%{opacity:0}}
@keyframes cap2{0%{opacity:0}20%{opacity:0}25%{opacity:0}45%{opacity:0}50%{opacity:1}70%{opacity:1}75%{opacity:0}99%{opacity:0}100%{opacity:0}}
@keyframes cap3{0%{opacity:0}20%{opacity:0}25%{opacity:0}45%{opacity:0}50%{opacity:0}70%{opacity:0}75%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes idle0{0%{opacity:1}20%{opacity:1}25%{opacity:0}45%{opacity:0}50%{opacity:0}70%{opacity:0}75%{opacity:0}99%{opacity:0}100%{opacity:1}}
</style>
<rect width="920" height="560" fill="#14161c"/>
<text x="30" y="36" fill="#fff" font-size="19" font-weight="700">return 時 Stack Pointer（SP）與 Base Pointer（BP）怎麼移動</text>
<text x="30" y="58" fill="#9aa0ac" font-size="12">以 add(3, 4) 執行到 return sum; 為例（x86-64 的函式結尾：mov rsp, rbp → pop rbp → ret），每 2 秒一步，循環播放</text>
<g id="scene">
<rect x="730" y="80" width="14" height="14" fill="#2563eb"/><text x="750" y="92" fill="#c7cad1" font-size="11">add() 的 Frame</text>
<rect x="730" y="102" width="14" height="14" fill="#a855f7"/><text x="750" y="114" fill="#c7cad1" font-size="11">main() 的 Frame</text>
<rect x="730" y="124" width="14" height="14" fill="#3a3f4c"/><text x="750" y="136" fill="#c7cad1" font-size="11">已釋放（資料還在）</text>
<text x="250" y="118" fill="#9aa0ac" font-size="12" class="mono">0xFFF8</text>
<rect x="320" y="96" width="380" height="30" rx="4" fill="#2a2e38" stroke="#14161c"/>
<text x="330" y="117" fill="#fff" font-size="12">（未使用）</text>
<text x="250" y="152" fill="#9aa0ac" font-size="12" class="mono">0xFFF9</text>
<rect x="320" y="130" width="380" height="30" rx="4" fill="#2563eb" stroke="#14161c" style="animation:g13 10s infinite;"/>
<text x="330" y="151" fill="#fff" font-size="12">sum = 7</text>
<text x="250" y="186" fill="#9aa0ac" font-size="12" class="mono">0xFFFA</text>
<rect x="320" y="164" width="380" height="30" rx="4" fill="#2563eb" stroke="#14161c" style="animation:g13 10s infinite;"/>
<text x="330" y="185" fill="#fff" font-size="12">b = 4</text>
<text x="250" y="220" fill="#9aa0ac" font-size="12" class="mono">0xFFFB</text>
<rect x="320" y="198" width="380" height="30" rx="4" fill="#2563eb" stroke="#14161c" style="animation:g13 10s infinite;"/>
<text x="330" y="219" fill="#fff" font-size="12">a = 3</text>
<text x="250" y="254" fill="#9aa0ac" font-size="12" class="mono">0xFFFC</text>
<rect x="320" y="232" width="380" height="30" rx="4" fill="#2563eb" stroke="#14161c" style="animation:g4 10s infinite;"/>
<text x="330" y="253" fill="#fff" font-size="12">呼叫者（main）的 BP 備份 ＝ 0xFFFF</text>
<text x="250" y="288" fill="#9aa0ac" font-size="12" class="mono">0xFFFD</text>
<rect x="320" y="266" width="380" height="30" rx="4" fill="#2563eb" stroke="#14161c" style="animation:g5 10s infinite;"/>
<text x="330" y="287" fill="#fff" font-size="12">返回位址（回到 main 呼叫 add 的下一行）</text>
<text x="250" y="322" fill="#9aa0ac" font-size="12" class="mono">0xFFFE</text>
<rect x="320" y="300" width="380" height="30" rx="4" fill="#a855f7" stroke="#14161c"/>
<text x="330" y="321" fill="#fff" font-size="12">main 的區域變數</text>
<text x="250" y="356" fill="#9aa0ac" font-size="12" class="mono">0xFFFF</text>
<rect x="320" y="334" width="380" height="30" rx="4" fill="#a855f7" stroke="#14161c"/>
<text x="330" y="355" fill="#fff" font-size="12">main 的 frame 地板（main 的 BP）</text>
<g style="animation:spmove 10s infinite;"><g>
<path d="M240 145.0 h0" />
<text x="120" y="139.0" fill="#f97316" font-size="13" font-weight="700">SP ＝ Stack Pointer</text>
<path d="M120 149.0 L222 149.0" stroke="#f97316" stroke-width="3" fill="none"/><path d="M232 149.0 l-10 -6 v12 z" fill="#f97316"/>
<text x="120" y="167.0" fill="#fdba74" font-size="13" class="mono" style="animation:sp0 10s infinite;">＝ 0xFFF9</text>
<text x="120" y="167.0" fill="#fdba74" font-size="13" class="mono" style="animation:sp1 10s infinite;">＝ 0xFFFC</text>
<text x="120" y="167.0" fill="#fdba74" font-size="13" class="mono" style="animation:sp2 10s infinite;">＝ 0xFFFD</text>
<text x="120" y="167.0" fill="#fdba74" font-size="13" class="mono" style="animation:sp3 10s infinite;">＝ 0xFFFE</text>
</g></g>
<g style="animation:bpmove 10s infinite;">
<path d="M790 251.0 L708 251.0" stroke="#22c55e" stroke-width="3" fill="none"/><path d="M708 251.0 l10 -6 v12 z" fill="#22c55e"/>
<text x="714" y="235.0" fill="#22c55e" font-size="13" font-weight="700">BP ＝ Base Pointer</text>
<text x="714" y="273.0" fill="#86efac" font-size="13" class="mono" style="animation:bpA 10s infinite;">＝ 0xFFFC</text>
<text x="714" y="273.0" fill="#86efac" font-size="13" class="mono" style="animation:bpB 10s infinite;">＝ 0xFFFF</text>
</g>
<g style="animation:cap0 10s infinite;"><rect x="30" y="398" width="860" height="120" rx="10" fill="#1e2129" stroke="#333747"/><text x="48" y="430" fill="#7dd3fc" font-size="17" font-weight="700" class="mono">return sum; 之前</text><text x="48" y="458" fill="#e5e7eb" font-size="14">SP 在 add frame 最上面（0xFFF9）。</text><text x="48" y="480" fill="#e5e7eb" font-size="14">BP 在 add frame 的地板（0xFFFC），那一格存著 main 的 BP 備份 0xFFFF。</text></g>
<g style="animation:cap1 10s infinite;"><rect x="30" y="398" width="860" height="120" rx="10" fill="#1e2129" stroke="#333747"/><text x="48" y="430" fill="#7dd3fc" font-size="17" font-weight="700" class="mono">① mov rsp, rbp</text><text x="48" y="458" fill="#e5e7eb" font-size="14">SP 直接移到 BP 的位置（0xFFFC）。</text><text x="48" y="480" fill="#e5e7eb" font-size="14">sum、b、a 那幾格瞬間掉出 Stack 範圍。</text></g>
<g style="animation:cap2 10s infinite;"><rect x="30" y="398" width="860" height="120" rx="10" fill="#1e2129" stroke="#333747"/><text x="48" y="430" fill="#7dd3fc" font-size="17" font-weight="700" class="mono">② pop rbp</text><text x="48" y="458" fill="#e5e7eb" font-size="14">取出 SP 指的那一格（main 的 BP 備份 0xFFFF）放回 BP。</text><text x="48" y="480" fill="#e5e7eb" font-size="14">SP 往下移一格（0xFFFD），BP 回到 main 的地板。</text></g>
<g style="animation:cap3 10s infinite;"><rect x="30" y="398" width="860" height="120" rx="10" fill="#1e2129" stroke="#333747"/><text x="48" y="430" fill="#7dd3fc" font-size="17" font-weight="700" class="mono">③ ret</text><text x="48" y="458" fill="#e5e7eb" font-size="14">取出返回位址，CPU 跳回 main 呼叫 add 的下一行。</text><text x="48" y="480" fill="#e5e7eb" font-size="14">SP 來到 main 的最上緣（0xFFFE），add 的 Frame 全部釋放。</text><text x="48" y="502" fill="#e5e7eb" font-size="14">只移動了指標，沒有清除任何資料。</text></g>
</g></svg>