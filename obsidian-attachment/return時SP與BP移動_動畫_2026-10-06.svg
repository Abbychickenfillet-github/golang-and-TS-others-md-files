<svg xmlns="http://www.w3.org/2000/svg" width="920" height="622" viewBox="0 0 920 622"><style>text{font-family:'Segoe UI','Noto Sans TC','Microsoft JhengHei',Helvetica,Arial,sans-serif}
.mono{font-family:Consolas,'JetBrains Mono',monospace}
#scene{animation:sceneFade 10s infinite}
@keyframes sceneFade{0%{opacity:0}3%{opacity:1}95%{opacity:1}99%{opacity:0}100%{opacity:0}}
@keyframes g13{0%{fill:#2563eb}20%{fill:#2563eb}25%{fill:#3a3f4c}45%{fill:#3a3f4c}50%{fill:#3a3f4c}70%{fill:#3a3f4c}75%{fill:#3a3f4c}99%{fill:#3a3f4c}100%{fill:#2563eb}}
@keyframes g4{0%{fill:#2563eb}20%{fill:#2563eb}25%{fill:#2563eb}45%{fill:#2563eb}50%{fill:#3a3f4c}70%{fill:#3a3f4c}75%{fill:#3a3f4c}99%{fill:#3a3f4c}100%{fill:#2563eb}}
@keyframes g5{0%{fill:#2563eb}20%{fill:#2563eb}25%{fill:#2563eb}45%{fill:#2563eb}50%{fill:#2563eb}70%{fill:#2563eb}75%{fill:#3a3f4c}99%{fill:#3a3f4c}100%{fill:#2563eb}}
@keyframes spmove{0%{transform:translateY(0px)}20%{transform:translateY(0px)}25%{transform:translateY(102px)}45%{transform:translateY(102px)}50%{transform:translateY(136px)}70%{transform:translateY(136px)}75%{transform:translateY(170px)}99%{transform:translateY(170px)}100%{transform:translateY(0px)}}
@keyframes bpmove{0%{transform:translateY(0px)}20%{transform:translateY(0px)}25%{transform:translateY(0px)}45%{transform:translateY(0px)}50%{transform:translateY(136px)}70%{transform:translateY(136px)}75%{transform:translateY(136px)}99%{transform:translateY(136px)}100%{transform:translateY(0px)}}
@keyframes sp0{0%{opacity:1}20%{opacity:1}25%{opacity:0}45%{opacity:0}50%{opacity:0}70%{opacity:0}75%{opacity:0}99%{opacity:0}100%{opacity:1}}
@keyframes cap0{0%{opacity:1}24%{opacity:1}24.5%{opacity:0}100%{opacity:0}}
@keyframes sp1{0%{opacity:0}20%{opacity:0}25%{opacity:1}45%{opacity:1}50%{opacity:0}70%{opacity:0}75%{opacity:0}99%{opacity:0}100%{opacity:0}}
@keyframes cap1{0%{opacity:0}24.5%{opacity:0}25%{opacity:1}49%{opacity:1}49.5%{opacity:0}100%{opacity:0}}
@keyframes sp2{0%{opacity:0}20%{opacity:0}25%{opacity:0}45%{opacity:0}50%{opacity:1}70%{opacity:1}75%{opacity:0}99%{opacity:0}100%{opacity:0}}
@keyframes cap2{0%{opacity:0}49.5%{opacity:0}50%{opacity:1}74%{opacity:1}74.5%{opacity:0}100%{opacity:0}}
@keyframes sp3{0%{opacity:0}20%{opacity:0}25%{opacity:0}45%{opacity:0}50%{opacity:0}70%{opacity:0}75%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes cap3{0%{opacity:0}74.5%{opacity:0}75%{opacity:1}99%{opacity:1}99.5%{opacity:0}100%{opacity:0}}
@keyframes bpA{0%{opacity:1}20%{opacity:1}25%{opacity:1}45%{opacity:1}50%{opacity:0}70%{opacity:0}75%{opacity:0}99%{opacity:0}100%{opacity:1}}
@keyframes bpB{0%{opacity:0}20%{opacity:0}25%{opacity:0}45%{opacity:0}50%{opacity:1}70%{opacity:1}75%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes outPulse{0%{opacity:.25}20%{opacity:.25}25%{opacity:1}95%{opacity:1}99%{opacity:.25}100%{opacity:.25}}
@keyframes inDim{0%{opacity:1}20%{opacity:1}25%{opacity:.25}99%{opacity:.25}100%{opacity:1}}
</style>
<rect width="920" height="622" fill="#14161c"/>
<text x="30" y="36" fill="#fff" font-size="19" font-weight="700">return 時 Stack Pointer（SP）與 Base Pointer（BP）怎麼移動</text>
<text x="30" y="58" fill="#9aa0ac" font-size="12">以 add(3, 4) 執行到 return sum; 為例（x86-64 的函式結尾：mov rsp, rbp → pop rbp → ret），每 2 秒一步，循環播放</text>
<g id="scene" transform="translate(0,46)">

<defs>
 <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#7f1d1d"/><rect width="4" height="8" fill="#991b1b"/></pattern>
 <marker id="inArr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/></marker>
 <marker id="outArr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f97316"/></marker>
</defs>
<path d="M284 68 L306 94 L306 404 L714 404 L714 94 L736 68" fill="none" stroke="#facc15" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="303" y="404" width="414" height="12" rx="3" fill="url(#hatch)" stroke="#ef4444" stroke-width="2"/>
<text x="510" y="78" text-anchor="middle" fill="#facc15" font-size="24" font-weight="900">開口</text>
<text x="722" y="428" fill="#fca5a5" font-size="15" font-weight="800">◀ 封閉</text>
<g style="animation:inDim 10s infinite">
 <path d="M410 48 L410 88" stroke="#22c55e" stroke-width="7" stroke-linecap="round" fill="none" marker-end="url(#inArr)"/>
 <text x="346" y="76" fill="#22c55e" font-size="14" font-weight="800">IN 進</text>
</g>
<g style="animation:outPulse 10s infinite">
 <path d="M610 88 L610 32" stroke="#f97316" stroke-width="7" stroke-linecap="round" fill="none" marker-end="url(#outArr)"/>
 <text x="624" y="76" fill="#f97316" font-size="14" font-weight="800">OUT 出</text>
</g>
<rect x="730" y="80" width="14" height="14" fill="#2563eb"/><text x="750" y="92" fill="#c7cad1" font-size="11">add() 的 Frame</text>
<rect x="730" y="102" width="14" height="14" fill="#a855f7"/><text x="750" y="114" fill="#c7cad1" font-size="11">main() 的 Frame</text>
<rect x="730" y="124" width="14" height="14" fill="#3a3f4c"/><text x="750" y="136" fill="#c7cad1" font-size="11">已釋放（資料還在）</text>
<text x="250" y="118" fill="#9aa0ac" font-size="12" class="mono">0xFFF2</text>
<rect x="320" y="96" width="380" height="30" rx="4" fill="#2a2e38" stroke="#14161c"/>
<text x="330" y="117" fill="#fff" font-size="12">（未使用）</text>
<text x="250" y="152" fill="#9aa0ac" font-size="12" class="mono">0xFFF3</text>
<rect x="320" y="130" width="380" height="30" rx="4" fill="#2563eb" stroke="#14161c" style="animation:g13 10s infinite;"/>
<text x="330" y="151" fill="#fff" font-size="12">sum = 7</text>
<text x="250" y="186" fill="#9aa0ac" font-size="12" class="mono">0xFFF4</text>
<rect x="320" y="164" width="380" height="30" rx="4" fill="#2563eb" stroke="#14161c" style="animation:g13 10s infinite;"/>
<text x="330" y="185" fill="#fff" font-size="12">b = 4</text>
<text x="250" y="220" fill="#9aa0ac" font-size="12" class="mono">0xFFF5</text>
<rect x="320" y="198" width="380" height="30" rx="4" fill="#2563eb" stroke="#14161c" style="animation:g13 10s infinite;"/>
<text x="330" y="219" fill="#fff" font-size="12">a = 3</text>
<text x="250" y="254" fill="#9aa0ac" font-size="12" class="mono">0xFFF6</text>
<rect x="320" y="232" width="380" height="30" rx="4" fill="#2563eb" stroke="#14161c" style="animation:g4 10s infinite;"/>
<text x="330" y="253" fill="#fff" font-size="12">呼叫者（main）的 BP 備份（值 ＝ 0xFFFF）</text>
<text x="250" y="288" fill="#9aa0ac" font-size="12" class="mono">0xFFF7</text>
<rect x="320" y="266" width="380" height="30" rx="4" fill="#2563eb" stroke="#14161c" style="animation:g5 10s infinite;"/>
<text x="330" y="287" fill="#fff" font-size="12">返回位址（回到 add(3,4) 的下一行）</text>
<text x="250" y="322" fill="#9aa0ac" font-size="12" class="mono">0xFFF8</text>
<rect x="320" y="300" width="380" height="30" rx="4" fill="#a855f7" stroke="#14161c"/>
<text x="330" y="321" fill="#fff" font-size="12">main 的區域變數等</text>
<text x="250" y="356" fill="#9aa0ac" font-size="12" class="mono">　⋮</text>
<text x="330" y="355" fill="#6b7280" font-size="12">（main 的其他區域）</text>
<text x="250" y="390" fill="#9aa0ac" font-size="12" class="mono">0xFFFF</text>
<rect x="320" y="368" width="380" height="30" rx="4" fill="#a855f7" stroke="#14161c"/>
<text x="330" y="389" fill="#fff" font-size="12">main 的 frame 地板（main 的 BP）</text>
<g style="animation:spmove 10s infinite;">
<text x="120" y="139.0" fill="#f97316" font-size="13" font-weight="700">SP ＝ Stack Pointer</text>
<path d="M120 149.0 L222 149.0" stroke="#f97316" stroke-width="3" fill="none"/><path d="M232 149.0 l-10 -6 v12 z" fill="#f97316"/>
<text x="120" y="167.0" fill="#fdba74" font-size="13" class="mono" style="animation:sp0 10s infinite;">＝ 0xFFF3</text>
<text x="120" y="167.0" fill="#fdba74" font-size="13" class="mono" style="animation:sp1 10s infinite;">＝ 0xFFF6</text>
<text x="120" y="167.0" fill="#fdba74" font-size="13" class="mono" style="animation:sp2 10s infinite;">＝ 0xFFF7</text>
<text x="120" y="167.0" fill="#fdba74" font-size="13" class="mono" style="animation:sp3 10s infinite;">＝ 0xFFF8</text>
</g>
<g style="animation:bpmove 10s infinite;">
<path d="M790 251.0 L718 251.0" stroke="#22c55e" stroke-width="3" fill="none"/><path d="M708 251.0 l10 -6 v12 z" fill="#22c55e"/>
<text x="714" y="235.0" fill="#22c55e" font-size="13" font-weight="700">BP ＝ Base Pointer</text>
<text x="714" y="273.0" fill="#86efac" font-size="13" class="mono" style="animation:bpA 10s infinite;">＝ 0xFFF6</text>
<text x="714" y="273.0" fill="#86efac" font-size="13" class="mono" style="animation:bpB 10s infinite;">＝ 0xFFFF</text>
</g>
<g style="animation:cap0 10s infinite;"><rect x="30" y="436" width="860" height="120" rx="10" fill="#1e2129" stroke="#333747"/><text x="48" y="468" fill="#7dd3fc" font-size="17" font-weight="700" class="mono">return sum; 之前</text><text x="48" y="496" fill="#e5e7eb" font-size="14">SP 在 add frame 最上面（0xFFF3）。</text><text x="48" y="518" fill="#e5e7eb" font-size="14">BP 在 add frame 的地板（0xFFF6），那一格存著 main 的 BP 備份 0xFFFF。</text></g>
<g style="animation:cap1 10s infinite;"><rect x="30" y="436" width="860" height="120" rx="10" fill="#1e2129" stroke="#333747"/><text x="48" y="468" fill="#7dd3fc" font-size="17" font-weight="700" class="mono">① mov rsp, rbp</text><text x="48" y="496" fill="#e5e7eb" font-size="14">SP 直接移到 BP 的位置（0xFFF6）。</text><text x="48" y="518" fill="#e5e7eb" font-size="14">sum、b、a 那幾格瞬間掉出 Stack 範圍。</text></g>
<g style="animation:cap2 10s infinite;"><rect x="30" y="436" width="860" height="120" rx="10" fill="#1e2129" stroke="#333747"/><text x="48" y="468" fill="#7dd3fc" font-size="17" font-weight="700" class="mono">② pop rbp</text><text x="48" y="496" fill="#e5e7eb" font-size="14">取出 SP 指的那一格（main 的 BP 備份 0xFFFF）放回 BP。</text><text x="48" y="518" fill="#e5e7eb" font-size="14">SP 往下移一格（0xFFF7），BP 回到 main 的地板。</text></g>
<g style="animation:cap3 10s infinite;"><rect x="30" y="436" width="860" height="120" rx="10" fill="#1e2129" stroke="#333747"/><text x="48" y="468" fill="#7dd3fc" font-size="17" font-weight="700" class="mono">③ ret</text><text x="48" y="496" fill="#e5e7eb" font-size="14">取出返回位址，CPU 跳回 main 呼叫 add 的下一行。</text><text x="48" y="518" fill="#e5e7eb" font-size="14">SP 來到 main 的最上緣（0xFFF8），add 的 Frame 全部釋放。</text><text x="48" y="540" fill="#e5e7eb" font-size="14">只移動了指標，沒有清除任何資料。</text></g>
</g></svg>