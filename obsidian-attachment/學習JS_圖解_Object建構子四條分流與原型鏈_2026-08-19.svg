<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="940" height="620" fill="#fbfbfd"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#111827">Object() 建構子的四條分流</text>
  <text x="30" y="60" font-size="12.5" fill="#6b7280">主軸圖｜之後所有 Object 相關的問題都回頭指這張圖的編號</text>

  <!-- input box -->
  <rect x="30" y="90" width="180" height="70" rx="10" fill="#111827"/>
  <text x="120" y="118" font-size="14" fill="#f9fafb" text-anchor="middle" font-family="monospace">Object(value)</text>
  <text x="120" y="140" font-size="11.5" fill="#9ca3af" text-anchor="middle">加不加 new 結果相同</text>

  <!-- branch lines -->
  <path d="M210,125 C250,125 250,140 285,140" stroke="#6b7280" fill="none" marker-end="url(#ar)"/>
  <path d="M210,125 C250,125 250,240 285,240" stroke="#6b7280" fill="none" marker-end="url(#ar)"/>
  <path d="M210,125 C250,125 250,340 285,340" stroke="#6b7280" fill="none" marker-end="url(#ar)"/>
  <path d="M210,125 C250,125 250,440 285,440" stroke="#6b7280" fill="none" marker-end="url(#ar)"/>

  <!-- 1 -->
  <rect x="290" y="108" width="250" height="64" rx="9" fill="#ecfdf5" stroke="#10b981"/>
  <circle cx="308" cy="126" r="10" fill="#10b981"/><text x="308" y="130" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">1</text>
  <text x="326" y="130" font-size="13" fill="#065f46" font-weight="600">null｜undefined｜不傳</text>
  <text x="304" y="152" font-size="12" fill="#047857" font-family="monospace">→ 全新空 plain object {}</text>
  <text x="304" y="167" font-size="11" fill="#6b7280">原型是 Object.prototype</text>

  <!-- 2 -->
  <rect x="290" y="208" width="250" height="64" rx="9" fill="#fff7ed" stroke="#f59e0b"/>
  <circle cx="308" cy="226" r="10" fill="#f59e0b"/><text x="308" y="230" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">2</text>
  <text x="326" y="230" font-size="13" fill="#92400e" font-weight="600">原始型別 primitive</text>
  <text x="304" y="252" font-size="12" fill="#b45309" font-family="monospace">→ 包裹物件 wrapper object</text>
  <text x="304" y="267" font-size="11" fill="#6b7280">Object(1) 是 Number 物件不是數字</text>

  <!-- 3 -->
  <rect x="290" y="308" width="250" height="64" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <circle cx="308" cy="326" r="10" fill="#3b82f6"/><text x="308" y="330" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">3</text>
  <text x="326" y="330" font-size="13" fill="#1e40af" font-weight="600">本來就是物件</text>
  <text x="304" y="352" font-size="12" fill="#1d4ed8" font-family="monospace">→ 原封不動回傳同一個參考</text>
  <text x="304" y="367" font-size="11" fill="#6b7280">不複製 Object(o) === o 為 true</text>

  <!-- 4 -->
  <rect x="290" y="408" width="250" height="70" rx="9" fill="#faf5ff" stroke="#8b5cf6"/>
  <circle cx="308" cy="426" r="10" fill="#8b5cf6"/><text x="308" y="430" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">4</text>
  <text x="326" y="430" font-size="13" fill="#5b21b6" font-weight="600">super() 且 new.target 不是 Object</text>
  <text x="304" y="452" font-size="12" fill="#6d28d9" font-family="monospace">→ 用 new.target.prototype 建物件</text>
  <text x="304" y="468" font-size="11" fill="#6b7280">傳進去的參數會被完全忽略</text>

  <!-- prototype chain panel -->
  <rect x="600" y="90" width="310" height="290" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="620" y="118" font-size="13.5" font-weight="700" fill="#111827">plain object 的原型鏈</text>

  <rect x="640" y="136" width="230" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="755" y="154" font-size="12" text-anchor="middle" fill="#111827" font-family="monospace">const o = new Object()</text>
  <text x="755" y="170" font-size="10.5" text-anchor="middle" fill="#6b7280">自己的屬性 own property</text>

  <path d="M755,178 L755,212" stroke="#8b5cf6" marker-end="url(#arp)"/>
  <text x="765" y="200" font-size="10.5" fill="#8b5cf6">[[Prototype]]</text>

  <rect x="640" y="214" width="230" height="42" rx="8" fill="#faf5ff" stroke="#8b5cf6"/>
  <text x="755" y="232" font-size="12" text-anchor="middle" fill="#5b21b6" font-family="monospace">Object.prototype</text>
  <text x="755" y="248" font-size="10.5" text-anchor="middle" fill="#6b7280">toString｜hasOwnProperty｜valueOf</text>

  <path d="M755,256 L755,290" stroke="#8b5cf6" marker-end="url(#arp)"/>
  <rect x="640" y="292" width="230" height="34" rx="8" fill="#111827"/>
  <text x="755" y="314" font-size="12" text-anchor="middle" fill="#f9fafb" font-family="monospace">null  ← 鏈的終點</text>

  <text x="620" y="352" font-size="11" fill="#6b7280">Object.create(null) 直接從這裡開始，</text>
  <text x="620" y="368" font-size="11" fill="#6b7280">所以連 toString 都沒有，樣板字串會爆 TypeError。</text>

  <!-- comparison strip -->
  <rect x="600" y="400" width="310" height="180" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="620" y="428" font-size="13.5" font-weight="700" fill="#111827">三種寫法都是 plain object</text>
  <text x="620" y="452" font-size="12" fill="#374151" font-family="monospace">new Object()</text>
  <text x="620" y="472" font-size="12" fill="#374151" font-family="monospace">Object()</text>
  <text x="620" y="492" font-size="12" fill="#374151" font-family="monospace">{}            ← MDN 建議日常用這個</text>
  <line x1="620" y1="506" x2="890" y2="506" stroke="#e5e7eb"/>
  <text x="620" y="528" font-size="11.5" fill="#dc2626">但三者互相 === 永遠是 false</text>
  <text x="620" y="546" font-size="11.5" fill="#6b7280">因為物件比較的是參考位址不是內容</text>
  <text x="620" y="566" font-size="11.5" fill="#6b7280">Object.is({}, {}) 一樣是 false</text>

  <text x="30" y="600" font-size="10.5" fill="#9ca3af">資料來源 MDN Object() constructor（2025-07-10 更新）｜MDN Object（2026-05-22 更新）｜圖 2026-08-19</text>
</svg>
