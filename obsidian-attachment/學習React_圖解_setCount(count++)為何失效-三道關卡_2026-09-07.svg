<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#fafafa"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">setCount(count++) 要闖過的三道關卡</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#64748b">三關全部擋下，所以只能寫 setCount(count + 1)</text>

  <!-- 起點 -->
  <rect x="30" y="100" width="180" height="76" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">React 元件 render</text>
  <text x="120" y="150" text-anchor="middle" font-size="12" fill="#3730a3">const [count, setCount]</text>
  <text x="120" y="167" text-anchor="middle" font-size="12" fill="#3730a3">= useState(0)</text>

  <line x1="210" y1="138" x2="256" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 關卡 1 -->
  <rect x="260" y="96" width="200" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="360" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">關卡 1　綁定是 const</text>
  <text x="360" y="141" text-anchor="middle" font-size="12" fill="#991b1b">count++ 內含一次賦值</text>
  <text x="360" y="159" text-anchor="middle" font-size="12" fill="#991b1b">count = 舊值 + 1</text>
  <text x="360" y="175" text-anchor="middle" font-size="11" fill="#b91c1c">→ TypeError 直接中斷</text>

  <line x1="460" y1="138" x2="506" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 關卡 2 -->
  <rect x="510" y="96" width="200" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="610" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">關卡 2　postfix 回傳舊值</text>
  <text x="610" y="141" text-anchor="middle" font-size="12" fill="#92400e">就算硬改成 let</text>
  <text x="610" y="159" text-anchor="middle" font-size="12" fill="#92400e">setCount 收到的是舊值</text>
  <text x="610" y="175" text-anchor="middle" font-size="11" fill="#b45309">→ 畫面數字不動</text>

  <line x1="710" y1="138" x2="756" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 關卡 3 -->
  <rect x="760" y="96" width="170" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="845" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">關卡 3　快照</text>
  <text x="845" y="141" text-anchor="middle" font-size="12" fill="#5b21b6">count 是這次 render</text>
  <text x="845" y="159" text-anchor="middle" font-size="12" fill="#5b21b6">的一份靜態拷貝</text>
  <text x="845" y="175" text-anchor="middle" font-size="11" fill="#6d28d9">→ 改它不會通知 React</text>

  <!-- 分隔線 -->
  <line x1="30" y1="212" x2="930" y2="212" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 正確路徑 -->
  <text x="30" y="248" font-size="15" font-weight="700" fill="#065f46">正確路徑：setCount(count + 1)</text>

  <rect x="30" y="266" width="170" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="115" y="292" text-anchor="middle" font-size="12.5" fill="#065f46">count + 1</text>
  <text x="115" y="312" text-anchor="middle" font-size="11.5" fill="#047857">純運算式，沒有</text>
  <text x="115" y="328" text-anchor="middle" font-size="11.5" fill="#047857">動到任何綁定</text>

  <line x1="200" y1="301" x2="246" y2="301" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="250" y="266" width="170" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="335" y="292" text-anchor="middle" font-size="12.5" fill="#065f46">setCount(新值)</text>
  <text x="335" y="312" text-anchor="middle" font-size="11.5" fill="#047857">把更新排進</text>
  <text x="335" y="328" text-anchor="middle" font-size="11.5" fill="#047857">React 的佇列</text>

  <line x1="420" y1="301" x2="466" y2="301" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="470" y="266" width="170" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="555" y="292" text-anchor="middle" font-size="12.5" fill="#065f46">事件處理器跑完</text>
  <text x="555" y="312" text-anchor="middle" font-size="11.5" fill="#047857">React 結算佇列</text>
  <text x="555" y="328" text-anchor="middle" font-size="11.5" fill="#047857">得到新的 state</text>

  <line x1="640" y1="301" x2="686" y2="301" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="690" y="266" width="170" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="775" y="292" text-anchor="middle" font-size="12.5" fill="#065f46">重新 render</text>
  <text x="775" y="312" text-anchor="middle" font-size="11.5" fill="#047857">元件函式再跑一次</text>
  <text x="775" y="328" text-anchor="middle" font-size="11.5" fill="#047857">拿到新的快照</text>

  <!-- 快照陷阱 -->
  <line x1="30" y1="368" x2="930" y2="368" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="30" y="400" font-size="15" font-weight="700" fill="#0c4a6e">同一輪連呼叫兩次的差別</text>

  <rect x="30" y="416" width="430" height="112" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="48" y="440" font-size="12.5" font-weight="600" fill="#075985">setCount(count + 1) 兩次　→ 只加 1</text>
  <text x="48" y="462" font-size="12" fill="#0c4a6e">count 是快照 3　→ 排入 4</text>
  <text x="48" y="482" font-size="12" fill="#0c4a6e">count 還是快照 3　→ 又排入 4</text>
  <text x="48" y="502" font-size="12" fill="#0c4a6e">佇列 [4, 4] 依序套用，最後是 4</text>
  <text x="48" y="520" font-size="11.5" fill="#0369a1">兩次都拿同一份靜態拷貝去算</text>

  <rect x="490" y="416" width="440" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="508" y="440" font-size="12.5" font-weight="600" fill="#14532d">setCount(prev =&gt; prev + 1) 兩次　→ 加 2</text>
  <text x="508" y="462" font-size="12" fill="#166534">排入函式 f1，結算時 prev = 3 → 4</text>
  <text x="508" y="482" font-size="12" fill="#166534">排入函式 f2，結算時 prev = 4 → 5</text>
  <text x="508" y="502" font-size="12" fill="#166534">佇列 [f1, f2] 串接計算，最後是 5</text>
  <text x="508" y="520" font-size="11.5" fill="#15803d">prev 拿的是佇列裡最新值，不是快照</text>
</svg>
