<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1130" viewBox="0 0 1700 1130" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7a4f"/></marker>
    <style>
      .t{font-size:15px;fill:#1a202c}.tb{font-size:16px;fill:#1a202c;font-weight:700}
      .ts{font-size:12.5px;fill:#4a5568}
      .mono{font-family:'Consolas','Menlo','DejaVu Sans Mono',monospace;font-size:13px;fill:#1a202c}
      .monos{font-family:'Consolas','Menlo','DejaVu Sans Mono',monospace;font-size:11.5px;fill:#4a5568}
      .e{stroke:#4a5568;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .er{stroke:#c53030;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .eg{stroke:#2f7a4f;stroke-width:1.8;fill:none;marker-end:url(#ag)}
      .lbl{font-size:12.5px;fill:#4a5568}.s{stroke-width:1.8}
    </style>
  </defs>
  <rect width="1700" height="1130" fill="#fbfbfa"/>

  <text x="48" y="52" class="tb" font-size="26">Day 27｜key 不是效能設定，是身分證</text>
  <text x="48" y="80" class="ts" font-size="14.5">依 ISO 5807 流程圖符號：圓形＝連接點／端點　直角矩形＝處理　菱形＝判斷　平行四邊形＝資料　雙邊線矩形＝副流程　六邊形＝初始化　　資料來源：facebook/react v19.3.0 ReactChildFiber.js</text>
  <line x1="48" y1="98" x2="1652" y2="98" stroke="#cbd5e0" stroke-width="1.5"/>

  <!-- ===== 左：兩段式比對 ===== -->
  <text x="48" y="136" class="tb" font-size="19">一、reconcileChildrenArray 的兩段式比對</text>
  <rect x="40" y="150" width="770" height="940" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <ellipse cx="425" cy="192" rx="150" ry="24" fill="#edf2f7" stroke="#4a5568" class="s"/>
  <text x="425" y="198" class="t" text-anchor="middle">資料變了，開始比對子節點</text>
  <path class="e" d="M 425 216 L 425 244"/>

  <path d="M 250 246 L 626 246 L 600 292 L 224 292 Z" fill="#f7fafc" stroke="#4a5568" class="s"/>
  <text x="425" y="268" class="t" text-anchor="middle">舊 fiber 串列（current）＋ 新元素陣列</text>
  <text x="425" y="286" class="ts" text-anchor="middle">newIdx = 0　lastPlacedIndex = 0</text>
  <path class="e" d="M 425 294 L 425 322"/>

  <g>
    <rect x="150" y="324" width="550" height="58" fill="#ebf8ff" stroke="#2b6cb0" class="s"/>
    <line x1="166" y1="324" x2="166" y2="382" stroke="#2b6cb0" stroke-width="1.8"/>
    <line x1="684" y1="324" x2="684" y2="382" stroke="#2b6cb0" stroke-width="1.8"/>
    <text x="425" y="346" class="t" text-anchor="middle" font-weight="700">第一段（快路徑）：同位置逐格 updateSlot</text>
    <text x="425" y="368" class="monos" text-anchor="middle">Update the fiber if the keys match, otherwise return null.</text>
  </g>
  <path class="e" d="M 425 384 L 425 412"/>

  <path d="M 425 414 L 640 462 L 425 510 L 210 462 Z" fill="#fffaf0" stroke="#b7791f" class="s"/>
  <text x="425" y="452" class="mono" text-anchor="middle">newChild.key === oldFiber.key</text>
  <text x="425" y="474" class="ts" text-anchor="middle">這一格的 key 對得上嗎</text>

  <path class="eg" d="M 210 462 L 120 462 L 120 512"/>
  <text x="166" y="454" class="lbl" text-anchor="middle">對得上</text>
  <rect x="50" y="514" width="200" height="72" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
  <text x="150" y="538" class="mono" text-anchor="middle">useFiber()</text>
  <text x="64" y="558" class="ts">重用同一個 fiber，</text>
  <text x="64" y="576" class="ts">DOM 節點原封不動</text>
  <path class="eg" d="M 150 588 L 150 612 L 380 612 L 380 636"/>
  <text x="266" y="606" class="lbl" text-anchor="middle">newIdx++ 繼續</text>

  <path class="er" d="M 640 462 L 720 462 L 720 512"/>
  <text x="682" y="454" class="lbl" text-anchor="middle">對不上</text>
  <rect x="620" y="514" width="180" height="72" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="710" y="538" class="mono" text-anchor="middle">break</text>
  <text x="634" y="558" class="ts">快路徑結束，</text>
  <text x="634" y="576" class="ts">轉入慢路徑</text>
  <path class="er" d="M 710 588 L 710 612 L 470 612 L 470 636"/>

  <g>
    <rect x="150" y="638" width="550" height="58" fill="#ebf8ff" stroke="#2b6cb0" class="s"/>
    <line x1="166" y1="638" x2="166" y2="696" stroke="#2b6cb0" stroke-width="1.8"/>
    <line x1="684" y1="638" x2="684" y2="696" stroke="#2b6cb0" stroke-width="1.8"/>
    <text x="425" y="660" class="t" text-anchor="middle" font-weight="700">第二段（慢路徑）：mapRemainingChildren</text>
    <text x="425" y="682" class="mono" text-anchor="middle">Map&lt;key 或 index, Fiber&gt;</text>
  </g>
  <path class="e" d="M 425 698 L 425 724"/>

  <path d="M 425 726 L 640 772 L 425 818 L 210 772 Z" fill="#fffaf0" stroke="#b7791f" class="s"/>
  <text x="425" y="766" class="t" text-anchor="middle">Map 裡撈得到</text>
  <text x="425" y="786" class="t" text-anchor="middle">這個 key 嗎</text>

  <path class="eg" d="M 210 772 L 118 772 L 118 822"/>
  <text x="162" y="764" class="lbl" text-anchor="middle">撈得到</text>
  <rect x="48" y="824" width="204" height="76" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
  <text x="150" y="848" class="mono" text-anchor="middle">placeChild()</text>
  <text x="62" y="868" class="ts">oldIndex &lt; lastPlacedIndex</text>
  <text x="62" y="886" class="ts">→ 標記移動，否則留原地</text>

  <path class="er" d="M 640 772 L 722 772 L 722 822"/>
  <text x="684" y="764" class="lbl" text-anchor="middle">撈不到</text>
  <rect x="620" y="824" width="180" height="76" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="710" y="848" class="t" text-anchor="middle" fill="#9b2c2c">新建一個</text>
  <text x="634" y="868" class="ts">新 fiber ＋ 新 DOM，</text>
  <text x="634" y="886" class="ts">元件狀態從零開始</text>

  <path class="eg" d="M 150 902 L 150 926 L 400 926 L 400 950"/>
  <path class="er" d="M 710 902 L 710 926 L 450 926 L 450 950"/>

  <rect x="200" y="952" width="450" height="52" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="425" y="974" class="t" text-anchor="middle">第三段：Map 裡沒被撈走的 → 刪除</text>
  <text x="425" y="994" class="monos" text-anchor="middle">existingChildren.forEach(child =&gt; deleteChild(...))</text>

  <rect x="60" y="1020" width="730" height="56" fill="#f7fafc" stroke="#cbd5e0" class="s" rx="4"/>
  <text x="76" y="1042" class="ts">為什麼要分兩段：第一段 O(n) 且不配置 Map，只改內容或在尾端 append 都走得完。</text>
  <text x="76" y="1062" class="ts">只有順序真的變了才付 Map 的成本。實測：只改內容 → 沒進慢路徑；最後一筆搬到最前 → 第 0 格就跳出。</text>

  <!-- ===== 右：index vs id ===== -->
  <text x="856" y="136" class="tb" font-size="19">二、刪掉第一筆：兩種 key 各配到誰</text>
  <rect x="848" y="150" width="804" height="940" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <path d="M 900 172 L 1600 172 L 1624 202 L 1600 232 L 900 232 L 876 202 Z" fill="#faf5ff" stroke="#6b46c1" class="s"/>
  <text x="1250" y="198" class="monos" text-anchor="middle">// Implicit (null) keys get added to this set with their index instead.</text>
  <text x="1250" y="220" class="ts" text-anchor="middle">mapRemainingChildren 的註解原文 —— 不給 key 不是沒有 key，是 key = index</text>

  <!-- index key 版 -->
  <text x="876" y="272" class="tb" fill="#9b2c2c">A. key={index}　使用者在「夏季展」那行打了字</text>
  <text x="900" y="300" class="ts">刪除前</text>
  <text x="1310" y="300" class="ts">刪除後</text>

  <g class="mono" font-size="12.5">
    <rect x="876" y="310" width="330" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="890" y="332">key 0  春季展   input=「」</text>
    <rect x="876" y="348" width="330" height="34" fill="#fffaf0" stroke="#b7791f" class="s"/>
    <text x="890" y="370">key 1  夏季展   input=「要訂便當」</text>
    <rect x="876" y="386" width="330" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="890" y="408">key 2  秋季展   input=「」</text>
    <rect x="876" y="424" width="330" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="890" y="446">key 3  冬季展   input=「」</text>
    <rect x="876" y="462" width="330" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="890" y="484">key 4  年度展   input=「」</text>

    <rect x="1290" y="310" width="342" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="1304" y="332">key 0  夏季展   input=「」</text>
    <rect x="1290" y="348" width="342" height="34" fill="#fff5f5" stroke="#c53030" class="s"/>
    <text x="1304" y="370" fill="#9b2c2c">key 1  秋季展   input=「要訂便當」</text>
    <rect x="1290" y="386" width="342" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="1304" y="408">key 2  冬季展   input=「」</text>
    <rect x="1290" y="424" width="342" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="1304" y="446">key 3  年度展   input=「」</text>
  </g>
  <path class="er" d="M 1212 365 L 1284 365"/>
  <text x="1248" y="356" class="lbl" text-anchor="middle">錯位</text>
  <path class="e" d="M 1212 327 L 1284 327"/>
  <text x="1420" y="484" class="ts" fill="#9b2c2c">文字往上移了一格，input 裡的字沒有跟著移</text>

  <!-- id key 版 -->
  <text x="876" y="536" class="tb" fill="#22543d">B. key={row.id}　同一個操作</text>
  <g class="mono" font-size="12.5">
    <rect x="876" y="548" width="330" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="890" y="570">key "a"  春季展   input=「」</text>
    <rect x="876" y="586" width="330" height="34" fill="#fffaf0" stroke="#b7791f" class="s"/>
    <text x="890" y="608">key "b"  夏季展   input=「要訂便當」</text>
    <rect x="876" y="624" width="330" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="890" y="646">key "c"  秋季展   input=「」</text>

    <rect x="1290" y="548" width="342" height="34" fill="#f0fff4" stroke="#2f7a4f" class="s"/>
    <text x="1304" y="570" fill="#22543d">key "b"  夏季展   input=「要訂便當」</text>
    <rect x="1290" y="586" width="342" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="1304" y="608">key "c"  秋季展   input=「」</text>
    <rect x="1290" y="624" width="342" height="34" fill="#edf2f7" stroke="#4a5568" class="s"/>
    <text x="1304" y="646">key "d"  冬季展   input=「」</text>
  </g>
  <path class="eg" d="M 1212 603 L 1284 603 L 1284 567"/>
  <text x="1248" y="594" class="lbl" text-anchor="middle">跟著搬</text>

  <!-- 錯的那一刻 -->
  <text x="876" y="704" class="tb">C. 錯的那一刻在哪一行</text>
  <rect x="876" y="716" width="756" height="86" fill="#fff5f5" stroke="#c53030" class="s"/>
  <text x="890" y="740" class="monos">// createWorkInProgress()</text>
  <text x="890" y="762" class="mono">workInProgress.stateNode = current.stateNode</text>
  <text x="890" y="788" class="ts">fiber 被重用 → DOM 節點被原封不動沿用 → 使用者打的字留在原地，資料卻換人了</text>

  <text x="876" y="842" class="tb">D. 實測：新建 DOM 的數量（5 筆列表）</text>
  <g class="ts">
    <rect x="876" y="854" width="756" height="28" fill="#f7fafc" stroke="#cbd5e0" class="s"/>
    <text x="890" y="873">操作　　　　　　　index key 新建 DOM　　　id key 新建 DOM　　　差別在哪</text>
    <rect x="876" y="882" width="756" height="28" fill="#fff" stroke="#cbd5e0" class="s"/>
    <text x="890" y="901">刪掉第一筆　　　　0 個　　　　　　　　　0 個　　　　　　　　index 版重用到錯的節點上</text>
    <rect x="876" y="910" width="756" height="28" fill="#fff" stroke="#cbd5e0" class="s"/>
    <text x="890" y="929">在最前面插一筆　　1 個　　　　　　　　　1 個　　　　　　　　同上</text>
    <rect x="876" y="938" width="756" height="28" fill="#fff" stroke="#cbd5e0" class="s"/>
    <text x="890" y="957">整個反轉　　　　　0 個（0 次移動）　　　0 個（4 次移動）　　　index 版根本沒在追蹤身分</text>
  </g>

  <rect x="876" y="986" width="756" height="90" fill="#f7fafc" stroke="#cbd5e0" class="s" rx="4"/>
  <text x="892" y="1008" class="ts">結論一：index key 的問題不是效能。它新建的 DOM 數量跟 id key 一樣，甚至更少。</text>
  <text x="892" y="1030" class="ts">結論二：出事的是「哪個 DOM 節點被配給哪一筆資料」。使用者打的字、scroll 位置、</text>
  <text x="892" y="1052" class="ts">　　　　video 播放進度、進行到一半的 CSS 動畫，全部黏在 DOM 節點上，不在 props 裡。</text>
  <text x="892" y="1070" class="ts">結論三：key={index} 跟不寫 key 行為一樣，但它把開發模式的警告關掉了 —— 更危險。</text>
</svg>
