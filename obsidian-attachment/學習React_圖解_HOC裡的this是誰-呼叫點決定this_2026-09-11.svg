<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#6b7b88"/>
  </marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3f8f6f"/>
  </marker>
</defs>
<rect width="1060" height="760" fill="#fbfaf7"/>

<text x="530" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1d2b36">this 由「呼叫那一刻前面有沒有接收者」決定，不是由「寫在哪個檔案」決定</text>
<text x="530" y="62" text-anchor="middle" font-size="13.5" fill="#6b7b88">學習React_圖解_HOC裡的this是誰-呼叫點決定this_2026-09-11</text>

<!-- lane headers -->
<rect x="24" y="82" width="320" height="40" rx="9" fill="#eaf2f7" stroke="#cfe0ea"/>
<text x="184" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#2c4a5e">A. class 的 render()</text>
<rect x="370" y="82" width="320" height="40" rx="9" fill="#fff1f4" stroke="#f3a8b9"/>
<text x="530" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#8a2440">B. class 的事件處理器</text>
<rect x="716" y="82" width="320" height="40" rx="9" fill="#f3f0f8" stroke="#cbbde3"/>
<text x="876" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#5b4a80">C. function component</text>

<!-- row1: who calls -->
<text x="14" y="150" font-size="12.5" font-weight="700" fill="#6b7b88">① 誰呼叫、怎麼呼叫</text>
<rect x="24" y="160" width="320" height="74" rx="10" fill="#fff" stroke="#e4e8ec"/>
<text x="184" y="184" text-anchor="middle" font-size="13" fill="#23303b">React reconciler 拿到實例後呼叫</text>
<text x="184" y="207" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas,monospace" fill="#1d2b36">instance.render()</text>
<text x="184" y="226" text-anchor="middle" font-size="12" fill="#3f8f6f">點號左邊有東西 → 有 receiver</text>

<rect x="370" y="160" width="320" height="74" rx="10" fill="#fff" stroke="#e4e8ec"/>
<text x="530" y="182" text-anchor="middle" font-size="12.5" fill="#23303b">你寫 onClick={this.handleClick} 時</text>
<text x="530" y="200" text-anchor="middle" font-size="12.5" fill="#23303b">函式被「取下來」變裸函式，事件系統呼叫</text>
<text x="530" y="221" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas,monospace" fill="#1d2b36">handler(event)</text>

<rect x="716" y="160" width="320" height="74" rx="10" fill="#fff" stroke="#e4e8ec"/>
<text x="876" y="184" text-anchor="middle" font-size="13" fill="#23303b">React 直接把它當普通函式呼叫</text>
<text x="876" y="207" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas,monospace" fill="#1d2b36">MyComp(props)</text>
<text x="876" y="226" text-anchor="middle" font-size="12" fill="#8a2440">從頭到尾沒有 new 出任何實例</text>

<line x1="184" y1="234" x2="184" y2="268" stroke="#6b7b88" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="530" y1="234" x2="530" y2="268" stroke="#6b7b88" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="876" y1="234" x2="876" y2="268" stroke="#6b7b88" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- row2: decision diamond -->
<text x="14" y="292" font-size="12.5" font-weight="700" fill="#6b7b88">② 判定</text>
<polygon points="184,272 324,312 184,352 44,312" fill="#FFF3A3" stroke="#d9c463"/>
<text x="184" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#4a4020">呼叫時有 receiver 嗎</text>
<text x="184" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b3f">有</text>

<polygon points="530,272 670,312 530,352 390,312" fill="#FFF3A3" stroke="#d9c463"/>
<text x="530" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#4a4020">呼叫時有 receiver 嗎</text>
<text x="530" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#8a2440">沒有</text>

<polygon points="876,272 1016,312 876,352 736,312" fill="#FFF3A3" stroke="#d9c463"/>
<text x="876" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#4a4020">呼叫時有 receiver 嗎</text>
<text x="876" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#8a2440">沒有</text>

<line x1="184" y1="352" x2="184" y2="390" stroke="#3f8f6f" stroke-width="1.8" marker-end="url(#arg)"/>
<line x1="530" y1="352" x2="530" y2="390" stroke="#6b7b88" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="876" y1="352" x2="876" y2="390" stroke="#6b7b88" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- strict mode band -->
<rect x="370" y="366" width="666" height="30" rx="7" fill="#ADCCFF" opacity="0.45" stroke="#8fb4e8"/>
<text x="703" y="386" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5e">關卡：class body 與 ESM 模組永遠是 strict mode，沒有 receiver 時不會 fallback 成 globalThis</text>

<!-- row3: result -->
<text x="14" y="422" font-size="12.5" font-weight="700" fill="#6b7b88">③ 結果</text>
<rect x="24" y="398" width="320" height="86" rx="10" fill="#eefaf1" stroke="#9fd8ab"/>
<text x="184" y="424" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2f6b3f">this === 那個組件實例</text>
<text x="184" y="446" text-anchor="middle" font-size="12.5" fill="#3d5567">所以 this.props 讀得到</text>
<text x="184" y="468" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6b3f">← 你問的那句 if (!this.props.isAllowed) 走這條</text>

<rect x="370" y="398" width="320" height="86" rx="10" fill="#ffeef2" stroke="#f3a8b9"/>
<text x="530" y="424" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8a2440">this === undefined</text>
<text x="530" y="446" text-anchor="middle" font-size="12.5" fill="#3d5567">讀 this.props 會直接丟 TypeError</text>
<text x="530" y="468" text-anchor="middle" font-size="12.5" fill="#3d5567">解法：constructor 裡 bind，或用箭頭函式 class field</text>

<rect x="716" y="398" width="320" height="86" rx="10" fill="#f5f2fa" stroke="#cbbde3"/>
<text x="876" y="424" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b4a80">this === undefined</text>
<text x="876" y="446" text-anchor="middle" font-size="12.5" fill="#3d5567">但你根本不需要它</text>
<text x="876" y="468" text-anchor="middle" font-size="12.5" fill="#3d5567">資料走參數 props，狀態走 useState</text>

<text x="530" y="508" text-anchor="middle" font-size="13" fill="#6b7b88">你記得的「React 的 this 是 undefined」沒有錯，它講的是 B 與 C 這兩條；A 這條一直都有 this</text>

<!-- bottom: prototype chain -->
<rect x="24" y="528" width="1012" height="210" rx="12" fill="#fff" stroke="#e4e8ec"/>
<text x="44" y="556" font-size="14.5" font-weight="700" fill="#1d2b36">放大 A 這條：反向繼承 HOC 裡，this 指的到底是哪一顆物件</text>
<text x="44" y="578" font-size="12.5" fill="#6b7b88">整棵樹只有「一個」實例。匿名 class extends WrappedComponent，所以這一個實例同時是兩者的 instance。</text>

<rect x="44" y="594" width="176" height="52" rx="9" fill="#BBFABB" stroke="#7fc48f"/>
<text x="132" y="616" text-anchor="middle" font-size="13" font-weight="700" fill="#20502f">this（唯一實例）</text>
<text x="132" y="636" text-anchor="middle" font-size="11.5" fill="#20502f">React new 出來的</text>

<line x1="220" y1="620" x2="258" y2="620" stroke="#6b7b88" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="262" y="596" width="178" height="48" rx="9" fill="#f7f9fb" stroke="#d5dde3"/>
<text x="351" y="616" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#23303b">匿名class.prototype</text>
<text x="351" y="634" text-anchor="middle" font-size="11.5" fill="#6b7b88">你覆寫的 render 在這</text>

<line x1="440" y1="620" x2="478" y2="620" stroke="#6b7b88" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="482" y="596" width="196" height="48" rx="9" fill="#f7f9fb" stroke="#d5dde3"/>
<text x="580" y="616" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#23303b">WrappedComponent.prototype</text>
<text x="580" y="634" text-anchor="middle" font-size="11.5" fill="#6b7b88">super.render() 找到這一層</text>

<line x1="678" y1="620" x2="716" y2="620" stroke="#6b7b88" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="720" y="596" width="186" height="48" rx="9" fill="#f7f9fb" stroke="#d5dde3"/>
<text x="813" y="616" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#23303b">React.Component.prototype</text>
<text x="813" y="634" text-anchor="middle" font-size="11.5" fill="#6b7b88">setState / forceUpdate</text>

<line x1="906" y1="620" x2="936" y2="620" stroke="#6b7b88" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="940" y="596" width="76" height="48" rx="9" fill="#f7f9fb" stroke="#d5dde3"/>
<text x="978" y="624" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#23303b">Object</text>

<rect x="44" y="662" width="972" height="60" rx="9" fill="#FFF3A3" opacity="0.5" stroke="#d9c463"/>
<text x="60" y="684" font-size="12.5" font-weight="700" fill="#4a4020">props 不在原型鏈上：它是 React 直接寫在「實例自己身上」的 own property。</text>
<text x="60" y="706" font-size="12.5" fill="#4a4020">首次掛載走 super(props) → React.Component 的建構式做 this.props = props；之後每次更新，reconciler 在呼叫 render 之前先做 instance.props = newProps。</text>
</svg>
