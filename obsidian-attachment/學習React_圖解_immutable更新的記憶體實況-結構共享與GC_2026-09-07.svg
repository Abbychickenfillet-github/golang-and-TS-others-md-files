<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="980" height="640" fill="#fafafa"/>

  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">immutable 更新的記憶體實況</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#64748b">setTodos(prev =&gt; prev.map(t =&gt; t.id === 2 ? &#123;...t, done:true&#125; : t))</text>

  <!-- 舊外殼 -->
  <rect x="30" y="92" width="150" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="105" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">舊陣列外殼</text>
  <text x="105" y="133" text-anchor="middle" font-size="11" fill="#991b1b">4 個指標 = 32 bytes</text>
  <text x="105" y="152" text-anchor="middle" font-size="11" fill="#991b1b">沒有人再指向它</text>
  <text x="105" y="171" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">→ unreachable</text>
  <text x="105" y="190" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">→ 下次 minor GC 回收</text>

  <!-- 新外殼 -->
  <rect x="30" y="256" width="150" height="96" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="105" y="280" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">新陣列外殼</text>
  <text x="105" y="300" text-anchor="middle" font-size="11" fill="#047857">4 個指標 = 32 bytes</text>
  <text x="105" y="319" text-anchor="middle" font-size="11" fill="#047857">state 現在指向它</text>
  <text x="105" y="338" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">Object.is 比得出不同</text>

  <!-- 堆積中的元素物件 -->
  <text x="560" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">堆積（heap）裡實際的元素物件</text>

  <g>
    <rect x="380" y="100" width="180" height="46" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="470" y="120" text-anchor="middle" font-size="12" fill="#075985">todo #1　物件 A</text>
    <text x="470" y="137" text-anchor="middle" font-size="11" fill="#0369a1">共用，完全沒被複製</text>

    <rect x="380" y="164" width="180" height="46" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
    <text x="470" y="184" text-anchor="middle" font-size="12" fill="#78350f">todo #2　物件 B（舊）</text>
    <text x="470" y="201" text-anchor="middle" font-size="11" fill="#92400e">被取代，也會被 GC</text>

    <rect x="640" y="164" width="180" height="46" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="730" y="184" text-anchor="middle" font-size="12" fill="#14532d">todo #2'　物件 B'（新）</text>
    <text x="730" y="201" text-anchor="middle" font-size="11" fill="#166534">唯一真正新配置的物件</text>

    <rect x="380" y="228" width="180" height="46" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="470" y="248" text-anchor="middle" font-size="12" fill="#075985">todo #3　物件 C</text>
    <text x="470" y="265" text-anchor="middle" font-size="11" fill="#0369a1">共用，完全沒被複製</text>

    <rect x="380" y="292" width="180" height="46" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
    <text x="470" y="312" text-anchor="middle" font-size="12" fill="#075985">todo #4　物件 D</text>
    <text x="470" y="329" text-anchor="middle" font-size="11" fill="#0369a1">共用，完全沒被複製</text>
  </g>

  <!-- 舊外殼的指標 -->
  <path d="M180 120 L376 122" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arR)"/>
  <path d="M180 136 L376 184" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arR)"/>
  <path d="M180 152 L376 248" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arR)"/>
  <path d="M180 168 L376 310" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arR)"/>

  <!-- 新外殼的指標 -->
  <path d="M180 276 L376 130" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#arG)"/>
  <path d="M180 292 C 300 292, 320 190, 636 187" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#arG)"/>
  <path d="M180 308 L376 256" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#arG)"/>
  <path d="M180 324 L376 318" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#arG)"/>

  <text x="235" y="240" font-size="11" fill="#dc2626">虛線＝舊外殼的指標</text>
  <text x="235" y="378" font-size="11" fill="#059669">實線＝新外殼的指標</text>

  <!-- 帳單 -->
  <line x1="30" y1="400" x2="950" y2="400" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="30" y="430" font-size="15" font-weight="700" fill="#0f172a">這一次更新的實際帳單</text>

  <rect x="30" y="446" width="290" height="106" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="48" y="470" font-size="12.5" font-weight="600" fill="#334155">新配置</text>
  <text x="48" y="492" font-size="12" fill="#475569">1 個新外殼　32 bytes</text>
  <text x="48" y="512" font-size="12" fill="#475569">1 個新物件　約 48 bytes</text>
  <text x="48" y="534" font-size="12" font-weight="600" fill="#0f172a">合計約 80 bytes</text>

  <rect x="345" y="446" width="290" height="106" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="363" y="470" font-size="12.5" font-weight="600" fill="#334155">沒有被複製的</text>
  <text x="363" y="492" font-size="12" fill="#475569">物件 A、C、D 原封不動</text>
  <text x="363" y="512" font-size="12" fill="#475569">深拷貝的話要多花 3 × 48</text>
  <text x="363" y="534" font-size="12" font-weight="600" fill="#0f172a">省下約 144 bytes</text>

  <rect x="660" y="446" width="290" height="106" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="678" y="470" font-size="12.5" font-weight="600" fill="#334155">舊的去哪了</text>
  <text x="678" y="492" font-size="12" fill="#475569">舊外殼 + 物件 B 不可達</text>
  <text x="678" y="512" font-size="12" fill="#475569">minor GC 掃描的是「存活者」</text>
  <text x="678" y="534" font-size="12" font-weight="600" fill="#0f172a">短命垃圾幾乎零成本</text>

  <!-- 何時真的會漲 -->
  <rect x="30" y="570" width="920" height="52" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="48" y="592" font-size="12.5" font-weight="700" fill="#7f1d1d">記憶體真的會漲的唯一原因：你自己把舊值抓住不放</text>
  <text x="48" y="612" font-size="12" fill="#991b1b">沒有上限的 undo 堆疊　／　全域快取　／　閉包意外捕獲大物件　／　把每一版都 push 進陣列（O(n²)）</text>
</svg>
