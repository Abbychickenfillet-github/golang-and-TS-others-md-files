<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <style>
      .t{fill:#1f2937}
      .mono{font-family:'Cascadia Code','Consolas','Menlo',monospace}
      .hd{font-size:15px;font-weight:700}
      .cell{font-size:14px}
      .yes{fill:#15803d;font-weight:700}
      .no{fill:#b91c1c;font-weight:700}
      .note{font-size:12.5px;fill:#475569}
    </style>
  </defs>
  <rect width="1000" height="620" fill="#fbfcfe"/>
  <text x="34" y="46" font-size="24" font-weight="700" class="t">JavaScript 四種相等演算法</text>
  <text x="34" y="72" class="note">依 ECMAScript 規範命名：IsLooselyEqual／IsStrictlyEqual／SameValue／SameValueZero</text>

  <g transform="translate(34,96)">
    <rect x="0" y="0" width="932" height="48" fill="#0f172a" rx="8"/>
    <text x="18"  y="26" class="hd" fill="#f8fafc">比較的情境</text>
    <text x="290" y="26" class="hd" fill="#f8fafc" text-anchor="middle">==</text>
    <text x="440" y="26" class="hd" fill="#f8fafc" text-anchor="middle">===</text>
    <text x="610" y="26" class="hd" fill="#f8fafc" text-anchor="middle">Object.is</text>
    <text x="800" y="26" class="hd" fill="#f8fafc" text-anchor="middle">SameValueZero</text>
    <text x="290" y="41" font-size="10" fill="#94a3b8" text-anchor="middle">IsLooselyEqual</text>
    <text x="440" y="41" font-size="10" fill="#94a3b8" text-anchor="middle">IsStrictlyEqual</text>
    <text x="610" y="41" font-size="10" fill="#94a3b8" text-anchor="middle">SameValue</text>
    <text x="800" y="41" font-size="10" fill="#94a3b8" text-anchor="middle">includes / Map / Set</text>

    <g>
      <rect x="0" y="56"  width="932" height="42" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
      <text x="18"  y="83" class="cell mono">1 == "1"　（不同型別）</text>
      <text x="290" y="83" class="cell yes" text-anchor="middle">true</text>
      <text x="440" y="83" class="cell no"  text-anchor="middle">false</text>
      <text x="610" y="83" class="cell no"  text-anchor="middle">false</text>
      <text x="800" y="83" class="cell no"  text-anchor="middle">false</text>

      <rect x="0" y="104" width="932" height="42" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
      <text x="18"  y="131" class="cell mono">null == undefined</text>
      <text x="290" y="131" class="cell yes" text-anchor="middle">true</text>
      <text x="440" y="131" class="cell no"  text-anchor="middle">false</text>
      <text x="610" y="131" class="cell no"  text-anchor="middle">false</text>
      <text x="800" y="131" class="cell no"  text-anchor="middle">false</text>

      <rect x="0" y="152" width="932" height="46" fill="#fff7ed" stroke="#fdba74" stroke-width="2" rx="6"/>
      <text x="18"  y="181" class="cell mono" font-weight="700">NaN 與 NaN</text>
      <text x="290" y="181" class="cell no"  text-anchor="middle">false</text>
      <text x="440" y="181" class="cell no"  text-anchor="middle">false</text>
      <text x="610" y="181" class="cell yes" text-anchor="middle">true</text>
      <text x="800" y="181" class="cell yes" text-anchor="middle">true</text>

      <rect x="0" y="204" width="932" height="46" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" rx="6"/>
      <text x="18"  y="233" class="cell mono" font-weight="700">+0 與 -0</text>
      <text x="290" y="233" class="cell yes" text-anchor="middle">true</text>
      <text x="440" y="233" class="cell yes" text-anchor="middle">true</text>
      <text x="610" y="233" class="cell no"  text-anchor="middle">false</text>
      <text x="800" y="233" class="cell yes" text-anchor="middle">true</text>

      <rect x="0" y="256" width="932" height="42" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
      <text x="18"  y="283" class="cell mono">{} 與 {}　（兩個不同物件）</text>
      <text x="290" y="283" class="cell no" text-anchor="middle">false</text>
      <text x="440" y="283" class="cell no" text-anchor="middle">false</text>
      <text x="610" y="283" class="cell no" text-anchor="middle">false</text>
      <text x="800" y="283" class="cell no" text-anchor="middle">false</text>
    </g>
  </g>

  <g transform="translate(34,416)">
    <rect x="0" y="0" width="452" height="168" fill="#fff7ed" stroke="#fb923c" rx="10"/>
    <text x="18" y="30" font-size="16" font-weight="700" fill="#9a3412">橘色列：NaN</text>
    <text x="18" y="58" font-size="13.5" fill="#7c2d12">a. IEEE 754 規定 NaN 不等於任何值</text>
    <text x="18" y="82" font-size="13.5" fill="#7c2d12">b. 所以 == 與 === 都判 false</text>
    <text x="18" y="106" font-size="13.5" fill="#7c2d12">c. SameValue 與 SameValueZero 都特別</text>
    <text x="34" y="128" font-size="13.5" fill="#7c2d12">把 NaN 視為與自己相同</text>
    <text x="18" y="152" font-size="13.5" fill="#7c2d12" font-weight="700">→ 這一列 Object.is 與 SameValueZero 一致</text>
  </g>
  <g transform="translate(514,416)">
    <rect x="0" y="0" width="452" height="168" fill="#eff6ff" stroke="#3b82f6" rx="10"/>
    <text x="18" y="30" font-size="16" font-weight="700" fill="#1e40af">藍色列：+0 與 -0</text>
    <text x="18" y="58" font-size="13.5" fill="#1e3a8a">a. 這是 SameValue 與 SameValueZero</text>
    <text x="34" y="80" font-size="13.5" fill="#1e3a8a" font-weight="700">唯一的差別</text>
    <text x="18" y="104" font-size="13.5" fill="#1e3a8a">b. Object.is 分得出來（false）</text>
    <text x="18" y="128" font-size="13.5" fill="#1e3a8a">c. includes／Map／Set 分不出來（true）</text>
    <text x="18" y="152" font-size="13.5" fill="#1e3a8a" font-weight="700">→ 記法：名字多了 Zero＝把兩個零併起來</text>
  </g>

  <text x="34" y="606" font-size="11.5" fill="#94a3b8">資料來源：MDN「Equality comparisons and sameness」（2026-07-20 更新）與 MDN「Object.is()」（2025-07-10 更新）　繪製 2026-08-06</text>
</svg>
