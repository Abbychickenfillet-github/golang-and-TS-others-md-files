<svg xmlns="http://www.w3.org/2000/svg" width="700" height="810" viewBox="0 0 700 810">
<rect width="700" height="810" rx="10" fill="#0b1020"/>
<path d="M0,10 a10,10 0 0 1 10,-10 h680 a10,10 0 0 1 10,10 v24 h-700 z" fill="#1b2440"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/>
<circle cx="38" cy="17" r="6" fill="#febc2e"/>
<circle cx="56" cy="17" r="6" fill="#28c840"/>
<text x="82" y="22" font-family="Consolas,Menlo,monospace" font-size="12" fill="#93a4c8">node verify.js — Object.is / SameValueZero / pass-by-value</text>
<text x="24" y="62" font-family="Consolas,Menlo,monospace" font-size="13.5" font-weight="700" fill="#7dd3fc" xml:space="preserve">=== Node v22.22.2 實際執行 ===</text>
<text x="24" y="93" font-family="Consolas,Menlo,monospace" font-size="13.5" font-weight="700" fill="#fbbf24" xml:space="preserve">--- A. NaN：=== 與 Object.is 的分歧 ---</text>
<text x="24" y="114" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  NaN === NaN                    <tspan fill="#64748b">-&gt; </tspan><tspan fill="#f87171" font-weight="700">false</tspan></text>
<text x="24" y="135" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  NaN == NaN                     <tspan fill="#64748b">-&gt; </tspan><tspan fill="#f87171" font-weight="700">false</tspan></text>
<text x="24" y="156" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  Object.is(NaN, NaN)            <tspan fill="#64748b">-&gt; </tspan><tspan fill="#4ade80" font-weight="700">true</tspan></text>
<text x="24" y="177" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  [NaN].indexOf(NaN)             <tspan fill="#64748b">-&gt; </tspan><tspan fill="#e2e8f0" font-weight="700">-1</tspan></text>
<text x="24" y="198" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  [NaN].includes(NaN)            <tspan fill="#64748b">-&gt; </tspan><tspan fill="#4ade80" font-weight="700">true</tspan></text>
<text x="24" y="219" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  new Set([NaN, NaN]).size       <tspan fill="#64748b">-&gt; </tspan><tspan fill="#e2e8f0" font-weight="700">1</tspan></text>
<text x="24" y="240" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  Number.isNaN(NaN)              <tspan fill="#64748b">-&gt; </tspan><tspan fill="#4ade80" font-weight="700">true</tspan></text>
<text x="24" y="271" font-family="Consolas,Menlo,monospace" font-size="13.5" font-weight="700" fill="#fbbf24" xml:space="preserve">--- B. +0 / -0：SameValue 與 SameValueZero 的唯一差別 ---</text>
<text x="24" y="292" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  0 === -0                       <tspan fill="#64748b">-&gt; </tspan><tspan fill="#4ade80" font-weight="700">true</tspan></text>
<text x="24" y="313" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  Object.is(0, -0)               <tspan fill="#64748b">-&gt; </tspan><tspan fill="#f87171" font-weight="700">false</tspan></text>
<text x="24" y="334" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  Object.is(-0, -0)              <tspan fill="#64748b">-&gt; </tspan><tspan fill="#4ade80" font-weight="700">true</tspan></text>
<text x="24" y="355" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  [-0].includes(0)               <tspan fill="#64748b">-&gt; </tspan><tspan fill="#4ade80" font-weight="700">true</tspan></text>
<text x="24" y="376" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  new Set([0, -0]).size          <tspan fill="#64748b">-&gt; </tspan><tspan fill="#e2e8f0" font-weight="700">1</tspan></text>
<text x="24" y="397" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  new Map([[0,&#x27;a&#x27;]]).get(-0)     <tspan fill="#64748b">-&gt; </tspan><tspan fill="#e2e8f0" font-weight="700">a</tspan></text>
<text x="24" y="418" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  1/0                            <tspan fill="#64748b">-&gt; </tspan><tspan fill="#e2e8f0" font-weight="700">Infinity</tspan></text>
<text x="24" y="439" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  1/-0                           <tspan fill="#64748b">-&gt; </tspan><tspan fill="#e2e8f0" font-weight="700">-Infinity</tspan></text>
<text x="24" y="470" font-family="Consolas,Menlo,monospace" font-size="13.5" font-weight="700" fill="#fbbf24" xml:space="preserve">--- C. 其他情況 Object.is 等同 === ---</text>
<text x="24" y="491" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  Object.is(1, &#x27;1&#x27;)              <tspan fill="#64748b">-&gt; </tspan><tspan fill="#f87171" font-weight="700">false</tspan></text>
<text x="24" y="512" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  1 == &#x27;1&#x27;                       <tspan fill="#64748b">-&gt; </tspan><tspan fill="#4ade80" font-weight="700">true</tspan></text>
<text x="24" y="533" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  Object.is(null, undefined)     <tspan fill="#64748b">-&gt; </tspan><tspan fill="#f87171" font-weight="700">false</tspan></text>
<text x="24" y="554" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  null == undefined              <tspan fill="#64748b">-&gt; </tspan><tspan fill="#4ade80" font-weight="700">true</tspan></text>
<text x="24" y="575" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  Object.is({}, {})              <tspan fill="#64748b">-&gt; </tspan><tspan fill="#f87171" font-weight="700">false</tspan></text>
<text x="24" y="606" font-family="Consolas,Menlo,monospace" font-size="13.5" font-weight="700" fill="#fbbf24" xml:space="preserve">--- D. 傳值 / 傳址判定實驗 ---</text>
<text x="24" y="627" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  改屬性後 a.name                    <tspan fill="#64748b">-&gt; </tspan><tspan fill="#e2e8f0" font-weight="700">changed</tspan></text>
<text x="24" y="648" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  重新賦值後 b.name                   <tspan fill="#64748b">-&gt; </tspan><tspan fill="#e2e8f0" font-weight="700">origin</tspan></text>
<text x="24" y="669" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  obj2.name=&#x27;B&#x27; 後 obj1.name      <tspan fill="#64748b">-&gt; </tspan><tspan fill="#e2e8f0" font-weight="700">B</tspan></text>
<text x="24" y="690" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  obj2={name:&#x27;C&#x27;} 後 obj1.name    <tspan fill="#64748b">-&gt; </tspan><tspan fill="#e2e8f0" font-weight="700">B</tspan></text>
<text x="24" y="711" font-family="Consolas,Menlo,monospace" font-size="13.5" xml:space="preserve" fill="#cbd5e1">  Object.is(obj1, obj2)          <tspan fill="#64748b">-&gt; </tspan><tspan fill="#f87171" font-weight="700">false</tspan></text>
<text x="24" y="798" font-family="sans-serif" font-size="10.5" fill="#475569">執行於 2026-08-06　結果與 MDN 規範描述一致</text>
</svg>
