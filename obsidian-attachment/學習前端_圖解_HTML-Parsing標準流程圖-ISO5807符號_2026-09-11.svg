<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1810" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<defs>
  <marker id="m" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#37474f"/></marker>
  <marker id="mo" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#EF6C00"/></marker>
  <marker id="mb" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#1565C0"/></marker>
</defs>
<style>
  .lbl{font-size:13.5px;fill:#263238}
  .lbl b{font-weight:700}
  .sub{font-size:11.5px;fill:#607d8b}
  .yn{font-size:12px;font-weight:700}
  .ttl{font-size:14px;font-weight:700;fill:#1a237e}
  .ln{stroke:#37474f;stroke-width:2;fill:none}
  .lo{stroke:#EF6C00;stroke-width:2.4;fill:none}
  .lb{stroke:#1565C0;stroke-width:2;fill:none}
  .sh{stroke-width:2.2;fill:#fff}
</style>

<rect width="1160" height="1810" fill="#fcfcfd"/>
<text x="580" y="38" font-size="21" font-weight="700" fill="#1a237e" text-anchor="middle">HTML Parsing 流程圖（依 ISO 5807 標準符號）</text>
<text x="580" y="62" font-size="13" fill="#546e7a" text-anchor="middle">形狀本身帶語意：平行四邊形＝資料、矩形＝處理、菱形＝判斷、六邊形＝初始化</text>

<!-- ============ 主流程 ============ -->
<text x="180" y="96" class="ttl">主流程</text>

<!-- 開始 -->
<rect x="170" y="108" width="300" height="48" rx="24" class="sh" stroke="#37474f"/>
<text x="320" y="138" class="lbl" text-anchor="middle"><tspan font-weight="700">開始：收到 HTTP response</tspan></text>
<path class="ln" d="M320 156 L320 184" marker-end="url(#m)"/>

<!-- I/O bytes -->
<path class="sh" stroke="#E91E63" d="M192 188 L470 188 L448 250 L170 250 Z"/>
<text x="320" y="212" class="lbl" text-anchor="middle"><tspan font-weight="700">輸入：input byte stream</tspan></text>
<text x="320" y="232" class="sub" text-anchor="middle">3C 21 44 4F … 還不是文字</text>
<path class="ln" d="M320 250 L320 278" marker-end="url(#m)"/>

<!-- 六邊形 初始化 -->
<path class="sh" stroke="#7B1FA2" d="M200 282 L440 282 L470 314 L440 346 L200 346 L170 314 Z"/>
<text x="320" y="308" class="lbl" text-anchor="middle"><tspan font-weight="700">初始化：confidence = tentative</tspan></text>
<text x="320" y="328" class="sub" text-anchor="middle">編碼還沒決定，先標「暫定」</text>
<path class="ln" d="M320 346 L320 374" marker-end="url(#m)"/>

<!-- 預先定義處理 -->
<rect x="170" y="378" width="300" height="62" class="sh" stroke="#1565C0"/>
<line x1="184" y1="378" x2="184" y2="440" stroke="#1565C0" stroke-width="2.2"/>
<line x1="456" y1="378" x2="456" y2="440" stroke="#1565C0" stroke-width="2.2"/>
<text x="320" y="404" class="lbl" text-anchor="middle"><tspan font-weight="700">encoding sniffing algorithm</tspan></text>
<text x="320" y="424" class="sub" text-anchor="middle">→ 副流程見右側</text>
<path class="lb" d="M470 409 L560 409" marker-end="url(#mb)"/>
<path class="ln" d="M320 440 L320 468" marker-end="url(#m)"/>

<!-- 處理 decoding -->
<rect x="170" y="472" width="300" height="62" class="sh" stroke="#00897B"/>
<text x="320" y="498" class="lbl" text-anchor="middle"><tspan font-weight="700">處理：decoding</tspan></text>
<text x="320" y="518" class="sub" text-anchor="middle">依決定好的編碼，bytes → code points</text>
<path class="ln" d="M320 534 L320 562" marker-end="url(#m)"/>

<!-- I/O input stream -->
<path class="sh" stroke="#E91E63" d="M192 566 L470 566 L448 628 L170 628 Z"/>
<text x="320" y="590" class="lbl" text-anchor="middle"><tspan font-weight="700">資料：input stream</tspan></text>
<text x="320" y="610" class="sub" text-anchor="middle">碼點流，可中途變長（非字串）</text>
<path class="ln" d="M320 628 L320 656" marker-end="url(#m)"/>

<!-- 六邊形 初始化2 -->
<path class="sh" stroke="#7B1FA2" d="M200 660 L440 660 L470 694 L440 728 L200 728 L170 694 Z"/>
<text x="320" y="686" class="lbl" text-anchor="middle"><tspan font-weight="700">初始化：兩台狀態機的起點</tspan></text>
<text x="320" y="706" class="sub" text-anchor="middle">tokenizer state = data state</text>
<text x="320" y="722" class="sub" text-anchor="middle">insertion mode = &quot;initial&quot;</text>
<path class="ln" d="M320 728 L320 752" marker-end="url(#m)"/>

<!-- 連接點 A -->
<circle cx="320" cy="772" r="19" fill="#fff" stroke="#EF6C00" stroke-width="2.4"/>
<text x="320" y="778" font-size="15" font-weight="700" fill="#EF6C00" text-anchor="middle">A</text>
<path class="ln" d="M320 791 L320 818" marker-end="url(#m)"/>

<!-- 判斷1 -->
<path class="sh" stroke="#EF6C00" d="M320 822 L490 878 L320 934 L150 878 Z"/>
<text x="320" y="872" class="lbl" text-anchor="middle" font-weight="700">還有碼點可讀嗎？</text>
<text x="320" y="892" class="sub" text-anchor="middle">（未到 EOF）</text>
<text x="506" y="872" class="yn" fill="#c62828">否</text>
<text x="334" y="958" class="yn" fill="#00897B">是</text>
<path class="ln" d="M320 934 L320 966" marker-end="url(#m)"/>

<!-- 處理 tokenization -->
<rect x="170" y="970" width="300" height="60" class="sh" stroke="#00897B"/>
<text x="320" y="996" class="lbl" text-anchor="middle"><tspan font-weight="700">處理：tokenization</tspan></text>
<text x="320" y="1016" class="sub" text-anchor="middle">狀態機切出「一個」token</text>
<path class="ln" d="M320 1030 L320 1058" marker-end="url(#m)"/>

<!-- I/O token -->
<path class="sh" stroke="#E91E63" d="M192 1062 L470 1062 L448 1118 L170 1118 Z"/>
<text x="320" y="1085" class="lbl" text-anchor="middle"><tspan font-weight="700">資料：一個 token</tspan></text>
<text x="320" y="1104" class="sub" text-anchor="middle">仍是「資料」不是物件</text>
<path class="ln" d="M320 1118 L320 1146" marker-end="url(#m)"/>

<!-- 處理 tree construction -->
<rect x="170" y="1150" width="300" height="66" class="sh" stroke="#00897B"/>
<text x="320" y="1176" class="lbl" text-anchor="middle"><tspan font-weight="700">處理：tree construction</tspan></text>
<text x="320" y="1196" class="sub" text-anchor="middle">依目前 insertion mode 決定怎麼處理</text>
<text x="320" y="1212" class="sub" text-anchor="middle" fill="#c62828">★ 這一步才 new 出 DOM 物件</text>
<path class="ln" d="M320 1216 L320 1244" marker-end="url(#m)"/>

<!-- 判斷2 script -->
<path class="sh" stroke="#EF6C00" d="M320 1248 L500 1306 L320 1364 L140 1306 Z"/>
<text x="320" y="1300" class="lbl" text-anchor="middle" font-weight="700">這個 token 是</text>
<text x="320" y="1320" class="lbl" text-anchor="middle" font-weight="700">阻塞型 &lt;script&gt; 嗎？</text>
<text x="516" y="1300" class="yn" fill="#00897B">是</text>
<text x="118" y="1300" class="yn" fill="#c62828" text-anchor="end">否</text>

<!-- 是 -> 暫停交給 V8 -->
<path class="ln" d="M500 1306 L556 1306" marker-end="url(#m)"/>
<rect x="560" y="1272" width="284" height="68" class="sh" stroke="#00897B"/>
<text x="702" y="1298" class="lbl" text-anchor="middle"><tspan font-weight="700">處理：暫停解析</tspan></text>
<text x="702" y="1318" class="sub" text-anchor="middle">主執行緒交給 V8 跑 JS</text>
<text x="702" y="1334" class="sub" text-anchor="middle">跑完再還回來</text>
<path class="lo" d="M702 1340 L702 1400 L96 1400 L96 772 L301 772" marker-end="url(#mo)"/>

<!-- 否 -> 回到 A -->
<path class="lo" d="M140 1306 L96 1306" />
<text x="180" y="1420" class="sub" fill="#EF6C00" font-weight="700">兩條路最後都回到連接點 A ＝ 這就是「逐一 token」的迴圈</text>

<!-- 否(判斷1) -> DOM -->
<path class="ln" d="M490 878 L900 878 L900 1470" marker-end="url(#m)"/>

<!-- ============ 右側副流程 ============ -->
<rect x="556" y="96" width="588" height="620" rx="12" fill="#f5f9ff" stroke="#90caf9" stroke-dasharray="6 4"/>
<text x="576" y="124" class="ttl">副流程：encoding sniffing algorithm（決定用哪張解碼表）</text>
<text x="576" y="146" class="sub">這就是你問的「bytes 到 decoding 中間有沒有判斷」——有，而且是連續四道</text>

<!-- 副流程開始 -->
<rect x="700" y="160" width="240" height="42" rx="21" class="sh" stroke="#37474f"/>
<text x="820" y="187" class="lbl" text-anchor="middle" font-weight="700">副流程開始</text>
<path class="lb" d="M820 202 L820 224" marker-end="url(#mb)"/>

<!-- D1 BOM -->
<path class="sh" stroke="#EF6C00" d="M820 228 L960 272 L820 316 L680 272 Z"/>
<text x="820" y="268" class="lbl" text-anchor="middle" font-weight="700">開頭有 BOM 嗎？</text>
<text x="820" y="286" class="sub" text-anchor="middle">EF BB BF …</text>
<text x="972" y="268" class="yn" fill="#00897B">是</text>
<path class="lb" d="M960 272 L1010 272 L1010 640" />
<text x="832" y="336" class="yn" fill="#c62828">否</text>
<path class="lb" d="M820 316 L820 340" marker-end="url(#mb)"/>

<!-- D2 HTTP header -->
<path class="sh" stroke="#EF6C00" d="M820 344 L960 388 L820 432 L680 388 Z"/>
<text x="820" y="384" class="lbl" text-anchor="middle" font-weight="700">HTTP header 有</text>
<text x="820" y="402" class="lbl" text-anchor="middle" font-weight="700">charset 嗎？</text>
<text x="972" y="384" class="yn" fill="#00897B">是</text>
<path class="lb" d="M960 388 L1010 388" />
<text x="832" y="452" class="yn" fill="#c62828">否</text>
<path class="lb" d="M820 432 L820 456" marker-end="url(#mb)"/>

<!-- D3 prescan -->
<path class="sh" stroke="#EF6C00" d="M820 460 L960 504 L820 548 L680 504 Z"/>
<text x="820" y="500" class="lbl" text-anchor="middle" font-weight="700">前 1024 bytes 有</text>
<text x="820" y="518" class="lbl" text-anchor="middle" font-weight="700">&lt;meta charset&gt; 嗎？</text>
<text x="972" y="500" class="yn" fill="#00897B">是</text>
<path class="lb" d="M960 504 L1010 504" />
<text x="832" y="568" class="yn" fill="#c62828">否</text>
<path class="lb" d="M820 548 L820 572" marker-end="url(#mb)"/>

<!-- 預設 -->
<rect x="640" y="576" width="360" height="48" class="sh" stroke="#00897B"/>
<text x="820" y="605" class="lbl" text-anchor="middle">處理：用語系預設值　<tspan fill="#c62828" font-weight="700">⚠️ 猜錯就是亂碼</tspan></text>
<path class="lb" d="M820 624 L820 640 L1010 640" />

<!-- 副流程結束 -->
<path class="lb" d="M1010 640 L1010 676 L820 676" marker-end="url(#mb)"/>
<rect x="580" y="654" width="240" height="44" rx="22" class="sh" stroke="#37474f"/>
<text x="700" y="682" class="lbl" text-anchor="middle" font-weight="700">回主流程（編碼已定）</text>

<!-- ============ 產物 ============ -->
<path class="sh" stroke="#E91E63" d="M782 1474 L1080 1474 L1058 1540 L760 1540 Z"/>
<text x="920" y="1500" class="lbl" text-anchor="middle"><tspan font-weight="700">輸出：DOM 樹</tspan></text>
<text x="920" y="1520" class="sub" text-anchor="middle">HTMLDivElement 等物件，可掛事件</text>
<text x="920" y="1534" class="sub" text-anchor="middle" fill="#c62828">是「產物」不是第 5 個步驟</text>
<path class="ln" d="M920 1540 L920 1566" marker-end="url(#m)"/>
<rect x="800" y="1570" width="240" height="46" rx="23" class="sh" stroke="#37474f"/>
<text x="920" y="1599" class="lbl" text-anchor="middle" font-weight="700">結束</text>

<!-- ============ 圖例 ============ -->
<rect x="40" y="1444" width="700" height="336" rx="12" fill="#fff" stroke="#b0bec5"/>
<text x="60" y="1472" class="ttl" fill="#263238">圖例：ISO 5807 常用符號（你原本的圖全部畫成同一種圓角矩形）</text>

<rect x="62" y="1490" width="72" height="30" rx="15" fill="#fff" stroke="#37474f" stroke-width="2"/>
<text x="150" y="1510" class="sub" fill="#263238"><tspan font-weight="700">終端 Terminator</tspan> — 開始／結束</text>

<rect x="62" y="1530" width="72" height="30" fill="#fff" stroke="#00897B" stroke-width="2"/>
<text x="150" y="1550" class="sub" fill="#263238"><tspan font-weight="700">處理 Process</tspan> — 直角矩形，做一件事</text>

<path d="M74 1570 L134 1570 L122 1600 L62 1600 Z" fill="#fff" stroke="#E91E63" stroke-width="2"/>
<text x="150" y="1590" class="sub" fill="#263238"><tspan font-weight="700">資料 Data／I/O</tspan> — 平行四邊形，輸入或輸出</text>

<path d="M98 1610 L138 1625 L98 1640 L58 1625 Z" fill="#fff" stroke="#EF6C00" stroke-width="2"/>
<text x="150" y="1630" class="sub" fill="#263238"><tspan font-weight="700">判斷 Decision</tspan> — 菱形，一進多出</text>

<path d="M72 1650 L124 1650 L136 1665 L124 1680 L72 1680 L60 1665 Z" fill="#fff" stroke="#7B1FA2" stroke-width="2"/>
<text x="150" y="1670" class="sub" fill="#263238"><tspan font-weight="700">初始化 Preparation</tspan> — 六邊形，設起始值／迴圈準備</text>

<rect x="62" y="1690" width="72" height="30" fill="#fff" stroke="#1565C0" stroke-width="2"/>
<line x1="72" y1="1690" x2="72" y2="1720" stroke="#1565C0" stroke-width="2"/>
<line x1="124" y1="1690" x2="124" y2="1720" stroke="#1565C0" stroke-width="2"/>
<text x="150" y="1710" class="sub" fill="#263238"><tspan font-weight="700">預先定義處理</tspan> — 呼叫一段另外定義好的子流程</text>

<circle cx="98" cy="1745" r="15" fill="#fff" stroke="#EF6C00" stroke-width="2"/>
<text x="98" y="1750" font-size="12" font-weight="700" fill="#EF6C00" text-anchor="middle">A</text>
<text x="150" y="1750" class="sub" fill="#263238"><tspan font-weight="700">連接點 Connector</tspan> — 線拉太遠時用它接續，這裡標示迴圈匯入點</text>
</svg>
