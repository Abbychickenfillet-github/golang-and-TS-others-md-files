<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7a4f"/>
    </marker>
    <style>
      .t    { font-size: 15px; fill: #1a202c; }
      .tb   { font-size: 16px; fill: #1a202c; font-weight: 700; }
      .ts   { font-size: 13px; fill: #4a5568; }
      .mono { font-family: 'Consolas','Menlo','DejaVu Sans Mono',monospace; font-size: 13.5px; fill: #1a202c; }
      .monos{ font-family: 'Consolas','Menlo','DejaVu Sans Mono',monospace; font-size: 12.5px; fill: #4a5568; }
      .edge { stroke: #4a5568; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .edgeR{ stroke: #c53030; stroke-width: 1.8; fill: none; marker-end: url(#arrowRed); }
      .edgeG{ stroke: #2f7a4f; stroke-width: 1.8; fill: none; marker-end: url(#arrowGreen); }
      .lbl  { font-size: 13px; fill: #4a5568; }
      .shape{ stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#fbfbfa"/>

  <!-- ===== 標題 ===== -->
  <text x="48" y="52" class="tb" font-size="26">Day 24｜setState 只有 12 行，以及那個 .call 是在防誰</text>
  <text x="48" y="80" class="ts" font-size="15">依 ISO 5807 流程圖符號：圓形＝連接點／端點　直角矩形＝處理　菱形＝判斷　平行四邊形＝資料　雙邊線矩形＝副流程（呼叫別人）　六邊形＝初始化　　資料來源：facebook/react v19.3.0 原始碼</text>
  <line x1="48" y1="98" x2="1552" y2="98" stroke="#cbd5e0" stroke-width="1.5"/>

  <!-- ================= 左panel：setState 的委派鏈 ================= -->
  <text x="48" y="136" class="tb" font-size="19">一、setState 的委派鏈：它自己只做參數檢查</text>
  <rect x="40" y="150" width="740" height="880" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <!-- 端點 -->
  <ellipse cx="410" cy="196" rx="150" ry="26" fill="#edf2f7" stroke="#4a5568" class="shape"/>
  <text x="410" y="194" class="t" text-anchor="middle">你的元件呼叫</text>
  <text x="410" y="212" class="mono" text-anchor="middle">this.setState(partialState)</text>

  <path class="edge" d="M 410 222 L 410 256"/>

  <!-- 判斷一 -->
  <path d="M 410 258 L 585 306 L 410 354 L 235 306 Z" fill="#fffaf0" stroke="#b7791f" class="shape"/>
  <text x="410" y="298" class="t" text-anchor="middle">partialState 是物件</text>
  <text x="410" y="317" class="t" text-anchor="middle">或函式或 null 嗎</text>

  <!-- 否 → throw -->
  <path class="edgeR" d="M 235 306 L 130 306"/>
  <text x="180" y="298" class="lbl" text-anchor="middle">否</text>
  <rect x="52" y="336" width="180" height="58" fill="#fff5f5" stroke="#c53030" class="shape"/>
  <text x="142" y="360" class="t" text-anchor="middle" fill="#9b2c2c">丟 Error</text>
  <text x="142" y="380" class="monos" text-anchor="middle">takes an object of...</text>
  <path class="edgeR" d="M 130 306 L 130 334"/>

  <path class="edge" d="M 410 356 L 410 392"/>
  <text x="426" y="378" class="lbl">是</text>

  <!-- 副流程：唯一做事的那一行 -->
  <g>
    <rect x="70" y="394" width="680" height="70" fill="#ebf8ff" stroke="#2b6cb0" class="shape"/>
    <line x1="86" y1="394" x2="86" y2="464" stroke="#2b6cb0" stroke-width="1.8"/>
    <line x1="734" y1="394" x2="734" y2="464" stroke="#2b6cb0" stroke-width="1.8"/>
    <text x="410" y="420" class="t" text-anchor="middle" font-weight="700">全文唯一真正做事的一行 ── 委派出去</text>
    <text x="410" y="445" class="mono" font-size="12.5" text-anchor="middle">this.updater.enqueueSetState(this, partialState, callback, 'setState')</text>
  </g>

  <path class="edge" d="M 410 466 L 410 500"/>

  <!-- 判斷二 -->
  <path d="M 410 502 L 590 550 L 410 598 L 230 550 Z" fill="#fffaf0" stroke="#b7791f" class="shape"/>
  <text x="410" y="544" class="t" text-anchor="middle">this.updater 是誰</text>
  <text x="410" y="563" class="monos" text-anchor="middle">updater || ReactNoopUpdateQueue</text>

  <!-- 左分支：Noop -->
  <path class="edgeR" d="M 230 550 L 150 550 L 150 596"/>
  <text x="188" y="542" class="lbl" text-anchor="middle">沒有 renderer</text>
  <path d="M 90 598 L 250 598 L 226 646 L 66 646 Z" fill="#fff5f5" stroke="#c53030" class="shape"/>
  <text x="158" y="628" class="monos" text-anchor="middle">ReactNoopUpdateQueue</text>
  <path class="edgeR" d="M 158 648 L 158 684"/>
  <rect x="60" y="686" width="196" height="58" fill="#fff5f5" stroke="#c53030" class="shape"/>
  <text x="158" y="710" class="t" text-anchor="middle">只印一行 console.error</text>
  <text x="158" y="730" class="ts" text-anchor="middle">warnNoop()</text>
  <path class="edgeR" d="M 158 746 L 158 780"/>
  <ellipse cx="158" cy="808" rx="98" ry="26" fill="#fff5f5" stroke="#c53030" class="shape"/>
  <text x="158" y="806" class="t" text-anchor="middle" fill="#9b2c2c">state 沒有變</text>
  <text x="158" y="823" class="ts" text-anchor="middle">畫面也沒有變</text>

  <!-- 右分支：真的 updater -->
  <path class="edgeG" d="M 590 550 L 660 550 L 660 596"/>
  <text x="628" y="542" class="lbl" text-anchor="middle">react-dom 注入</text>
  <path d="M 500 598 L 660 598 L 636 646 L 476 646 Z" fill="#f0fff4" stroke="#2f7a4f" class="shape"/>
  <text x="568" y="628" class="monos" text-anchor="middle">renderer 的 updater</text>

  <path class="edgeG" d="M 568 648 L 568 680"/>
  <rect x="448" y="682" width="240" height="40" fill="#f0fff4" stroke="#2f7a4f" class="shape"/>
  <text x="568" y="708" class="t" text-anchor="middle">a. 排隊（放進更新佇列）</text>
  <path class="edgeG" d="M 568 724 L 568 748"/>
  <rect x="448" y="750" width="240" height="40" fill="#f0fff4" stroke="#2f7a4f" class="shape"/>
  <text x="568" y="776" class="t" text-anchor="middle">b. 合併同一批 partialState</text>
  <path class="edgeG" d="M 568 792 L 568 816"/>
  <rect x="448" y="818" width="240" height="40" fill="#f0fff4" stroke="#2f7a4f" class="shape"/>
  <text x="568" y="844" class="t" text-anchor="middle">c. 重繪一次</text>
  <path class="edgeG" d="M 568 860 L 568 888"/>
  <ellipse cx="568" cy="916" rx="120" ry="26" fill="#f0fff4" stroke="#2f7a4f" class="shape"/>
  <text x="568" y="914" class="t" text-anchor="middle" fill="#22543d">this.state 這時才改</text>
  <text x="568" y="931" class="ts" text-anchor="middle">所以呼叫後立刻讀是舊值</text>

  <!-- 註腳 -->
  <rect x="60" y="954" width="700" height="62" fill="#f7fafc" stroke="#cbd5e0" class="shape" rx="4"/>
  <text x="76" y="976" class="ts">a、b、c 這三件事 setState 一件都沒做，全部在 renderer 注入的 updater 裡。</text>
  <text x="76" y="998" class="ts">這就是為什麼只裝 react 不裝 react-dom，setState 呼叫得動但畫面永遠不會變。</text>

  <!-- ================= 右panel：hasOwnProperty ================= -->
  <text x="820" y="136" class="tb" font-size="19">二、為什麼是 hasOwnProperty.call(config, key)</text>
  <rect x="812" y="150" width="740" height="880" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <!-- 初始化 六邊形 -->
  <path d="M 872 176 L 1492 176 L 1516 208 L 1492 240 L 872 240 L 848 208 Z" fill="#faf5ff" stroke="#6b46c1" class="shape"/>
  <text x="1182" y="205" class="mono" text-anchor="middle">const hasOwnProperty = Object.prototype.hasOwnProperty</text>
  <text x="1182" y="226" class="ts" text-anchor="middle">packages/shared/hasOwnProperty.js 全文就這一行　把實例方法從原型上借出來</text>

  <path class="edge" d="M 1182 242 L 1182 274"/>

  <!-- 資料 平行四邊形 -->
  <path d="M 920 276 L 1470 276 L 1440 330 L 890 330 Z" fill="#f7fafc" stroke="#4a5568" class="shape"/>
  <text x="1180" y="300" class="t" text-anchor="middle">config ── 寫 JSX 的人給的 props 物件</text>
  <text x="1180" y="320" class="ts" text-anchor="middle">外部資料。不能假設它長得正常</text>

  <path class="edge" d="M 1180 332 L 1180 362"/>

  <!-- 處理：for in -->
  <rect x="960" y="364" width="440" height="44" fill="#edf2f7" stroke="#4a5568" class="shape"/>
  <text x="1180" y="392" class="mono" text-anchor="middle">for (propName in config)</text>
  <text x="1412" y="380" class="ts">會走整條</text>
  <text x="1412" y="398" class="ts">原型鏈</text>

  <path class="edge" d="M 1180 410 L 1180 440"/>

  <!-- 判斷：兩種寫法 -->
  <path d="M 1180 442 L 1370 490 L 1180 538 L 990 490 Z" fill="#fffaf0" stroke="#b7791f" class="shape"/>
  <text x="1180" y="484" class="t" text-anchor="middle">要怎麼問「這個 key</text>
  <text x="1180" y="503" class="t" text-anchor="middle">是不是它自己的」</text>

  <!-- 左：天真版 -->
  <path class="edgeR" d="M 990 490 L 900 490 L 900 552"/>
  <rect x="846" y="554" width="240" height="44" fill="#fff5f5" stroke="#c53030" class="shape"/>
  <text x="966" y="582" class="mono" text-anchor="middle">config.hasOwnProperty(k)</text>
  <text x="966" y="546" class="lbl" text-anchor="middle">問物件自己</text>

  <path class="edgeR" d="M 966 600 L 966 626"/>
  <rect x="836" y="628" width="260" height="146" fill="#fff5f5" stroke="#c53030" class="shape"/>
  <text x="966" y="652" class="t" text-anchor="middle" fill="#9b2c2c">三顆地雷</text>
  <text x="852" y="678" class="ts">a.</text>
  <text x="872" y="678" class="monos">&lt;div hasOwnProperty="x" /&gt;</text>
  <text x="872" y="696" class="ts">那個名字被 prop 佔走了</text>
  <text x="852" y="720" class="ts">b.</text>
  <text x="872" y="720" class="monos">Object.create(null)</text>
  <text x="872" y="738" class="ts">根本沒有原型可以繼承</text>
  <text x="852" y="762" class="ts">c. 原型被污染，for...in 多撈到東西</text>

  <path class="edgeR" d="M 966 776 L 966 806"/>
  <ellipse cx="966" cy="834" rx="122" ry="26" fill="#fff5f5" stroke="#c53030" class="shape"/>
  <text x="966" y="832" class="t" text-anchor="middle" fill="#9b2c2c">TypeError</text>
  <text x="966" y="849" class="monos" text-anchor="middle">is not a function</text>

  <!-- 右：React 版 -->
  <path class="edgeG" d="M 1370 490 L 1460 490 L 1460 552"/>
  <rect x="1300" y="554" width="248" height="44" fill="#f0fff4" stroke="#2f7a4f" class="shape"/>
  <text x="1424" y="582" class="mono" text-anchor="middle">hasOwnProperty.call(config, k)</text>
  <text x="1424" y="546" class="lbl" text-anchor="middle">借方法來問它</text>

  <path class="edgeG" d="M 1424 600 L 1424 626"/>
  <rect x="1300" y="628" width="248" height="146" fill="#f0fff4" stroke="#2f7a4f" class="shape"/>
  <text x="1424" y="652" class="t" text-anchor="middle" fill="#22543d">三顆地雷都踩不到</text>
  <text x="1314" y="678" class="ts">方法是從 Object.prototype</text>
  <text x="1314" y="696" class="ts">直接拿的，不經過 config</text>
  <text x="1314" y="722" class="ts">config 只是被當成參數</text>
  <text x="1314" y="740" class="ts">傳進去的那個「誰」</text>
  <text x="1314" y="764" class="ts">＝把實例方法當靜態方法用</text>

  <path class="edgeG" d="M 1424 776 L 1424 806"/>
  <ellipse cx="1424" cy="834" rx="122" ry="26" fill="#f0fff4" stroke="#2f7a4f" class="shape"/>
  <text x="1424" y="840" class="t" text-anchor="middle" fill="#22543d">永遠得到正確答案</text>

  <!-- 六邊形：ES2022 -->
  <path d="M 900 876 L 1470 876 L 1494 908 L 1470 940 L 900 940 L 876 908 Z" fill="#faf5ff" stroke="#6b46c1" class="shape"/>
  <text x="1185" y="905" class="mono" text-anchor="middle">ES2022：Object.hasOwn(config, k)</text>
  <text x="1185" y="926" class="ts" text-anchor="middle">語意跟右邊那條一模一樣。新程式碼直接用它，讀舊原始碼還是要認得 .call</text>

  <rect x="836" y="954" width="704" height="62" fill="#f7fafc" stroke="#cbd5e0" class="shape" rx="4"/>
  <text x="852" y="976" class="ts">但 React 自己在 ReactBaseClasses.js 裡用的是 deprecatedAPIs.hasOwnProperty(fnName)，沒有 .call。</text>
  <text x="852" y="998" class="ts">規則不是「一律加 .call」，而是：物件是外部給的就用 .call，是自己上面幾行剛寫出來的字面量就不必。</text>
</svg>
