<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 2060" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<defs>
  <marker id="m" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#37474f"/></marker>
  <marker id="mo" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#EF6C00"/></marker>
  <marker id="mb" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#1565C0"/></marker>
  <marker id="mg" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#6a1b9a"/></marker>
  <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a237e"/><stop offset="100%" stop-color="#6a1b9a"/></linearGradient>
</defs>
<style>
  .lbl{font-size:13.5px;fill:#263238}
  .sub{font-size:11.5px;fill:#607d8b}
  .yn{font-size:12px;font-weight:700}
  .sec{font-size:16px;font-weight:700;fill:#1a237e}
  .ln{stroke:#37474f;stroke-width:2;fill:none}
  .lo{stroke:#EF6C00;stroke-width:2.4;fill:none}
  .lb{stroke:#1565C0;stroke-width:2;fill:none}
  .sh{stroke-width:2.2;fill:#fff}
</style>

<rect width="1280" height="2060" fill="#fcfcfd"/>
<rect x="0" y="0" width="1280" height="88" fill="url(#hd)"/>
<text x="640" y="42" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">HTML Parsing：從原始碼到 DOM 物件的完整一條線</text>
<text x="640" y="70" font-size="14" fill="#c5cae9" text-anchor="middle">依 ISO 5807 標準符號　｜　平行四邊形＝資料　直角矩形＝處理　菱形＝判斷　六邊形＝初始化　雙邊線矩形＝副流程　圓形＝連接點</text>

<!-- ================= A. BUILD TIME 帶 ================= -->
<rect x="24" y="106" width="1232" height="176" rx="12" fill="#f3f6ff" stroke="#9fa8da" stroke-dasharray="7 4"/>
<text x="44" y="134" class="sec">① Build time　—　在你的筆電／CI 上，全站做一次</text>

<rect x="44" y="150" width="200" height="62" class="sh" stroke="#00897B"/>
<text x="144" y="176" class="lbl" text-anchor="middle" font-weight="700">原始碼 .tsx / .vue</text>
<text x="144" y="196" class="sub" text-anchor="middle">瀏覽器看不懂</text>
<path class="ln" d="M244 181 L286 181" marker-end="url(#m)"/>

<rect x="290" y="150" width="210" height="62" class="sh" stroke="#00897B"/>
<text x="395" y="176" class="lbl" text-anchor="middle" font-weight="700">處理：轉譯 ＋ 打包</text>
<text x="395" y="196" class="sub" text-anchor="middle">Babel / SWC / esbuild → Rollup</text>
<path class="ln" d="M500 181 L542 181" marker-end="url(#m)"/>

<path class="sh" stroke="#E91E63" d="M568 150 L806 150 L784 212 L546 212 Z"/>
<text x="676" y="174" class="lbl" text-anchor="middle" font-weight="700">產出：index.html 檔案</text>
<text x="676" y="194" class="sub" text-anchor="middle" fill="#c62828">★ 存檔這一刻決定編碼（UTF-8）</text>
<text x="676" y="234" class="sub" text-anchor="middle" fill="#880e4f" font-weight="700">「純文字檔」這個說法，指的是這裡 —— 檔案格式的類別</text>
<text x="676" y="252" class="sub" text-anchor="middle">相對於 JPG／MP4 那種二進位格式，不是在講它在網路上長什麼樣</text>

<path class="ln" d="M806 181 L862 181" marker-end="url(#m)"/>
<text x="900" y="176" font-size="22" text-anchor="middle">✂️</text>
<text x="900" y="200" class="sub" text-anchor="middle" font-weight="700" fill="#c62828">部署，斷開</text>
<text x="900" y="216" class="sub" text-anchor="middle">中間可能隔三天</text>
<path class="ln" d="M940 181 L988 181" marker-end="url(#m)"/>

<rect x="992" y="150" width="240" height="62" class="sh" stroke="#546e7a"/>
<text x="1112" y="176" class="lbl" text-anchor="middle" font-weight="700">靜態檔放在伺服器上</text>
<text x="1112" y="196" class="sub" text-anchor="middle">等著被請求</text>
<path class="ln" d="M1112 212 L1112 296 L560 296 L560 322 L340 322 L340 336" marker-end="url(#m)"/>

<!-- ================= B. RUN TIME 主流程 ================= -->
<text x="44" y="326" class="sec">② Run time　—　在每一個使用者的瀏覽器裡，各做一次</text>

<rect x="190" y="344" width="300" height="48" rx="24" class="sh" stroke="#37474f"/>
<text x="340" y="374" class="lbl" text-anchor="middle" font-weight="700">開始：收到 HTTP response</text>
<path class="ln" d="M340 392 L340 420" marker-end="url(#m)"/>

<path class="sh" stroke="#E91E63" d="M212 424 L490 424 L468 486 L190 486 Z"/>
<text x="340" y="448" class="lbl" text-anchor="middle" font-weight="700">輸入：input byte stream</text>
<text x="340" y="468" class="sub" text-anchor="middle" fill="#c62828">這裡是 bytes，還沒有「字」</text>
<path class="ln" d="M340 486 L340 514" marker-end="url(#m)"/>

<path class="sh" stroke="#7B1FA2" d="M220 518 L460 518 L490 550 L460 582 L220 582 L190 550 Z"/>
<text x="340" y="544" class="lbl" text-anchor="middle" font-weight="700">初始化：confidence = tentative</text>
<text x="340" y="564" class="sub" text-anchor="middle">編碼還沒決定，先標「暫定」</text>
<path class="ln" d="M340 582 L340 610" marker-end="url(#m)"/>

<rect x="190" y="614" width="300" height="62" class="sh" stroke="#1565C0"/>
<line x1="204" y1="614" x2="204" y2="676" stroke="#1565C0" stroke-width="2.2"/>
<line x1="476" y1="614" x2="476" y2="676" stroke="#1565C0" stroke-width="2.2"/>
<text x="340" y="640" class="lbl" text-anchor="middle" font-weight="700">encoding sniffing algorithm</text>
<text x="340" y="660" class="sub" text-anchor="middle">→ 副流程見右側</text>
<path class="lb" d="M490 645 L596 645" marker-end="url(#mb)"/>
<path class="ln" d="M340 676 L340 704" marker-end="url(#m)"/>

<rect x="190" y="708" width="300" height="62" class="sh" stroke="#00897B"/>
<text x="340" y="734" class="lbl" text-anchor="middle" font-weight="700">處理：decoding</text>
<text x="340" y="754" class="sub" text-anchor="middle">bytes → code points（碼點）</text>
<path class="ln" d="M340 770 L340 798" marker-end="url(#m)"/>

<path class="sh" stroke="#E91E63" d="M212 802 L490 802 L468 864 L190 864 Z"/>
<text x="340" y="826" class="lbl" text-anchor="middle" font-weight="700">資料：input stream</text>
<text x="340" y="846" class="sub" text-anchor="middle">碼點流 —— 規範不叫它「字串」</text>
<path class="ln" d="M340 864 L340 892" marker-end="url(#m)"/>

<path class="sh" stroke="#7B1FA2" d="M220 896 L460 896 L490 930 L460 964 L220 964 L190 930 Z"/>
<text x="340" y="922" class="lbl" text-anchor="middle" font-weight="700">初始化：兩台狀態機的起點</text>
<text x="340" y="942" class="sub" text-anchor="middle">tokenizer state = data state</text>
<text x="340" y="958" class="sub" text-anchor="middle">insertion mode = &quot;initial&quot;</text>
<path class="ln" d="M340 964 L340 988" marker-end="url(#m)"/>

<circle cx="340" cy="1008" r="19" fill="#fff" stroke="#EF6C00" stroke-width="2.4"/>
<text x="340" y="1014" font-size="15" font-weight="700" fill="#EF6C00" text-anchor="middle">A</text>
<path class="ln" d="M340 1027 L340 1054" marker-end="url(#m)"/>

<path class="sh" stroke="#EF6C00" d="M340 1058 L510 1114 L340 1170 L170 1114 Z"/>
<text x="340" y="1108" class="lbl" text-anchor="middle" font-weight="700">還有碼點可讀嗎？</text>
<text x="340" y="1128" class="sub" text-anchor="middle">（未到 EOF）</text>
<text x="526" y="1108" class="yn" fill="#c62828">否</text>
<text x="354" y="1194" class="yn" fill="#00897B">是</text>
<path class="ln" d="M340 1170 L340 1202" marker-end="url(#m)"/>

<rect x="190" y="1206" width="300" height="60" class="sh" stroke="#00897B"/>
<text x="340" y="1232" class="lbl" text-anchor="middle" font-weight="700">處理：tokenization</text>
<text x="340" y="1252" class="sub" text-anchor="middle">狀態機切出「一個」token</text>
<path class="ln" d="M340 1266 L340 1294" marker-end="url(#m)"/>

<path class="sh" stroke="#E91E63" d="M212 1298 L490 1298 L468 1354 L190 1354 Z"/>
<text x="340" y="1321" class="lbl" text-anchor="middle" font-weight="700">資料：一個 token</text>
<text x="340" y="1340" class="sub" text-anchor="middle">仍是「資料」不是物件</text>
<path class="ln" d="M340 1354 L340 1382" marker-end="url(#m)"/>

<rect x="190" y="1386" width="300" height="66" class="sh" stroke="#00897B"/>
<text x="340" y="1412" class="lbl" text-anchor="middle" font-weight="700">處理：tree construction</text>
<text x="340" y="1432" class="sub" text-anchor="middle">依目前 insertion mode 決定怎麼處理</text>
<text x="340" y="1448" class="sub" text-anchor="middle" fill="#c62828">★ 這一步才 new 出 DOM 物件</text>
<path class="ln" d="M340 1452 L340 1480" marker-end="url(#m)"/>

<path class="sh" stroke="#EF6C00" d="M340 1484 L520 1542 L340 1600 L160 1542 Z"/>
<text x="340" y="1536" class="lbl" text-anchor="middle" font-weight="700">這個 token 是</text>
<text x="340" y="1556" class="lbl" text-anchor="middle" font-weight="700">阻塞型 &lt;script&gt; 嗎？</text>
<text x="536" y="1536" class="yn" fill="#00897B">是</text>
<text x="140" y="1536" class="yn" fill="#c62828" text-anchor="end">否</text>

<path class="ln" d="M520 1542 L576 1542" marker-end="url(#m)"/>
<rect x="580" y="1508" width="290" height="68" class="sh" stroke="#00897B"/>
<text x="725" y="1534" class="lbl" text-anchor="middle" font-weight="700">處理：暫停解析</text>
<text x="725" y="1554" class="sub" text-anchor="middle">主執行緒交給 V8 跑 JS</text>
<text x="725" y="1570" class="sub" text-anchor="middle">跑完再還回來</text>
<path class="lo" d="M725 1576 L725 1632 L112 1632 L112 1008 L321 1008" marker-end="url(#mo)"/>
<path class="lo" d="M160 1542 L112 1542"/>
<text x="200" y="1654" class="sub" fill="#EF6C00" font-weight="700">兩條路最後都回到連接點 A ＝ 這就是「逐一 token」的迴圈</text>

<path class="ln" d="M510 1114 L940 1114 L940 1706" marker-end="url(#m)"/>

<!-- ================= C. 副流程 ================= -->
<rect x="596" y="330" width="660" height="600" rx="12" fill="#f5f9ff" stroke="#90caf9" stroke-dasharray="6 4"/>
<text x="616" y="358" class="sec" font-size="15">副流程：encoding sniffing algorithm（決定用哪張解碼表）</text>
<text x="616" y="378" class="sub">bytes 到 decoding 中間的四道連續判斷</text>

<rect x="806" y="392" width="240" height="42" rx="21" class="sh" stroke="#37474f"/>
<text x="926" y="419" class="lbl" text-anchor="middle" font-weight="700">副流程開始</text>
<path class="lb" d="M926 434 L926 456" marker-end="url(#mb)"/>

<path class="sh" stroke="#EF6C00" d="M926 460 L1066 504 L926 548 L786 504 Z"/>
<text x="926" y="500" class="lbl" text-anchor="middle" font-weight="700">開頭有 BOM 嗎？</text>
<text x="926" y="518" class="sub" text-anchor="middle">EF BB BF …</text>
<text x="1078" y="500" class="yn" fill="#00897B">是</text>
<path class="lb" d="M1066 504 L1120 504 L1120 856"/>
<text x="938" y="568" class="yn" fill="#c62828">否</text>
<path class="lb" d="M926 548 L926 572" marker-end="url(#mb)"/>

<path class="sh" stroke="#EF6C00" d="M926 576 L1066 620 L926 664 L786 620 Z"/>
<text x="926" y="616" class="lbl" text-anchor="middle" font-weight="700">HTTP header 有</text>
<text x="926" y="634" class="lbl" text-anchor="middle" font-weight="700">charset 嗎？</text>
<text x="1078" y="616" class="yn" fill="#00897B">是</text>
<path class="lb" d="M1066 620 L1120 620"/>
<text x="938" y="684" class="yn" fill="#c62828">否</text>
<path class="lb" d="M926 664 L926 688" marker-end="url(#mb)"/>

<path class="sh" stroke="#EF6C00" d="M926 692 L1066 736 L926 780 L786 736 Z"/>
<text x="926" y="732" class="lbl" text-anchor="middle" font-weight="700">前 1024 bytes 有</text>
<text x="926" y="750" class="lbl" text-anchor="middle" font-weight="700">&lt;meta charset&gt; 嗎？</text>
<text x="1078" y="732" class="yn" fill="#00897B">是</text>
<path class="lb" d="M1066 736 L1120 736"/>
<text x="938" y="800" class="yn" fill="#c62828">否</text>
<path class="lb" d="M926 780 L926 804" marker-end="url(#mb)"/>

<rect x="746" y="808" width="360" height="48" class="sh" stroke="#00897B"/>
<text x="926" y="837" class="lbl" text-anchor="middle">處理：用語系預設值　<tspan fill="#c62828" font-weight="700">⚠️ 猜錯就是亂碼</tspan></text>
<path class="lb" d="M926 856 L1120 856"/>
<path class="lb" d="M1120 856 L1120 892 L926 892" marker-end="url(#mb)"/>
<rect x="686" y="870" width="240" height="44" rx="22" class="sh" stroke="#37474f"/>
<text x="806" y="898" class="lbl" text-anchor="middle" font-weight="700">回主流程（編碼已定）</text>

<!-- ================= D. 三層定位 ================= -->
<rect x="596" y="952" width="660" height="238" rx="12" fill="#fff8e1" stroke="#FFB300" stroke-width="2"/>
<text x="616" y="980" class="sec" font-size="15" fill="#e65100">「純文字」「字串」到底該用在哪一層？</text>
<text x="616" y="1006" class="lbl" font-weight="700">① 檔案格式的類別</text>
<text x="800" y="1006" class="sub">「HTML 是純文字檔」← 講的是上面第 ① 帶的產出</text>
<text x="616" y="1030" class="sub">　　相對於 JPG／MP4 的二進位格式，這句話成立</text>
<text x="616" y="1058" class="lbl" font-weight="700">② 在網路上</text>
<text x="800" y="1058" class="sub" fill="#c62828" font-weight="700">一律是 bytes，不要叫它字串</text>
<text x="616" y="1082" class="sub">　　Content-Length 的單位就是它</text>
<text x="616" y="1110" class="lbl" font-weight="700">③ decoding 之後</text>
<text x="800" y="1110" class="sub">規範叫 input stream（碼點流），不叫字串</text>
<text x="616" y="1134" class="sub">　　因為它可以中途變長（網路 chunk、document.write）</text>
<text x="616" y="1164" class="sub" fill="#e65100" font-weight="700">→ 真正的「JS String」不在這條線上，見右下角</text>

<!-- ================= E. JS 字串是另一條線 ================= -->
<rect x="596" y="1212" width="660" height="214" rx="12" fill="#faf5ff" stroke="#9C27B0" stroke-width="2"/>
<text x="616" y="1240" class="sec" font-size="15" fill="#6a1b9a">⚠️ JS 字串是「另一條線」，不在 HTML Parsing 裡</text>
<text x="616" y="1266" class="sub">你問得對：HTML Parsing 全程沒有 JS。上面那條線由 Blink 跑，V8 完全沒參與。</text>

<rect x="616" y="1284" width="180" height="50" class="sh" stroke="#6a1b9a"/>
<text x="706" y="1305" class="lbl" text-anchor="middle" font-weight="700">你自己寫的 JS</text>
<text x="706" y="1323" class="sub" text-anchor="middle">fetch('/a.html')</text>
<path d="M796 1309 L842 1309" stroke="#6a1b9a" stroke-width="2" fill="none" marker-end="url(#mg)"/>
<rect x="846" y="1284" width="180" height="50" class="sh" stroke="#6a1b9a"/>
<text x="936" y="1305" class="lbl" text-anchor="middle" font-weight="700">處理：.text()</text>
<text x="936" y="1323" class="sub" text-anchor="middle">解碼成 JS 字串</text>
<path d="M1026 1309 L1072 1309" stroke="#6a1b9a" stroke-width="2" fill="none" marker-end="url(#mg)"/>
<path class="sh" stroke="#6a1b9a" d="M1094 1284 L1240 1284 L1222 1334 L1076 1334 Z"/>
<text x="1158" y="1315" class="lbl" text-anchor="middle" font-weight="700">String</text>
<text x="616" y="1362" class="sub">這條線是「你主動用 JS 去抓一份 HTML 當文字處理」，例如 SPA 抓片段再 innerHTML。</text>
<text x="616" y="1384" class="sub" fill="#c62828" font-weight="700">瀏覽器載入主文件時走的是左邊那條，不會經過 response.text()，也不會產生 JS 字串。</text>
<text x="616" y="1408" class="sub">（若真的丟給 innerHTML，會再觸發一次 HTML Parsing 的片段版 fragment parsing）</text>

<!-- ================= 產物 ================= -->
<path class="sh" stroke="#E91E63" d="M822 1710 L1120 1710 L1098 1776 L800 1776 Z"/>
<text x="960" y="1736" class="lbl" text-anchor="middle" font-weight="700">輸出：DOM 樹</text>
<text x="960" y="1756" class="sub" text-anchor="middle">HTMLDivElement 等物件，可掛事件</text>
<text x="960" y="1770" class="sub" text-anchor="middle" fill="#c62828">是「產物」不是第 5 個步驟</text>
<path class="ln" d="M960 1776 L960 1802" marker-end="url(#m)"/>
<rect x="840" y="1806" width="240" height="46" rx="23" class="sh" stroke="#37474f"/>
<text x="960" y="1835" class="lbl" text-anchor="middle" font-weight="700">結束</text>

<!-- ================= 圖例 ================= -->
<rect x="40" y="1700" width="700" height="320" rx="12" fill="#fff" stroke="#b0bec5"/>
<text x="60" y="1730" class="sec" font-size="15" fill="#263238">圖例：ISO 5807 常用符號</text>

<rect x="62" y="1748" width="72" height="30" rx="15" fill="#fff" stroke="#37474f" stroke-width="2"/>
<text x="150" y="1768" class="sub" fill="#263238"><tspan font-weight="700">終端 Terminator</tspan> — 開始／結束</text>

<rect x="62" y="1788" width="72" height="30" fill="#fff" stroke="#00897B" stroke-width="2"/>
<text x="150" y="1808" class="sub" fill="#263238"><tspan font-weight="700">處理 Process</tspan> — 直角矩形，做一件事</text>

<path d="M74 1828 L134 1828 L122 1858 L62 1858 Z" fill="#fff" stroke="#E91E63" stroke-width="2"/>
<text x="150" y="1848" class="sub" fill="#263238"><tspan font-weight="700">資料 Data／I/O</tspan> — 平行四邊形，輸入或輸出</text>

<path d="M98 1868 L138 1883 L98 1898 L58 1883 Z" fill="#fff" stroke="#EF6C00" stroke-width="2"/>
<text x="150" y="1888" class="sub" fill="#263238"><tspan font-weight="700">判斷 Decision</tspan> — 菱形，一進多出</text>

<path d="M72 1908 L124 1908 L136 1923 L124 1938 L72 1938 L60 1923 Z" fill="#fff" stroke="#7B1FA2" stroke-width="2"/>
<text x="150" y="1928" class="sub" fill="#263238"><tspan font-weight="700">初始化 Preparation</tspan> — 六邊形，設起始值／迴圈準備</text>

<rect x="62" y="1948" width="72" height="30" fill="#fff" stroke="#1565C0" stroke-width="2"/>
<line x1="72" y1="1948" x2="72" y2="1978" stroke="#1565C0" stroke-width="2"/>
<line x1="124" y1="1948" x2="124" y2="1978" stroke="#1565C0" stroke-width="2"/>
<text x="150" y="1968" class="sub" fill="#263238"><tspan font-weight="700">預先定義處理</tspan> — 呼叫另外定義好的子流程</text>

<circle cx="98" cy="2000" r="15" fill="#fff" stroke="#EF6C00" stroke-width="2"/>
<text x="98" y="2005" font-size="12" font-weight="700" fill="#EF6C00" text-anchor="middle">A</text>
<text x="150" y="2005" class="sub" fill="#263238"><tspan font-weight="700">連接點 Connector</tspan> — 線拉太遠時接續，這裡標示迴圈匯入點</text>
</svg>
