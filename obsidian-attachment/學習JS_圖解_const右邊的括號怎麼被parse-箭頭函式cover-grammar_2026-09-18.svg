<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="960" height="660" fill="#fbfbfa"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#1f2937">引擎讀到 const f = ( element ) 之後，下一個 token 決定一切</text>
  <text x="24" y="56" font-size="12.5" fill="#6b7280">ISO 5807 流程圖　·　圓角＝起止　矩形＝處理　菱形＝判斷　·　紅線＝Abby 這次踩到的路徑</text>

  <!-- start -->
  <rect x="330" y="80" width="300" height="40" rx="20" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="480" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#374151">開始 parse：讀到 const f =</text>

  <!-- process: expect expression -->
  <rect x="318" y="146" width="324" height="44" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="480" y="165" font-size="12" text-anchor="middle" fill="#1e40af">= 右邊只接受一個「表達式」</text>
  <text x="480" y="182" font-size="12" text-anchor="middle" fill="#1e40af">（不接受陳述式，也不接受區塊）</text>
  <line x1="480" y1="120" x2="480" y2="146" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- process: cover grammar -->
  <rect x="290" y="216" width="380" height="58" rx="4" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="480" y="236" font-size="12" text-anchor="middle" fill="#5b21b6">讀到 ( element ) —— 此刻還分不出是什麼</text>
  <text x="480" y="254" font-size="12" font-weight="700" text-anchor="middle" fill="#6d28d9">先用 cover grammar 暫存成「兩義」：</text>
  <text x="480" y="270" font-size="11.5" text-anchor="middle" fill="#6d28d9">括號表達式？還是箭頭函式的參數列？</text>
  <line x1="480" y1="190" x2="480" y2="216" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- decision -->
  <path d="M480,300 L700,356 L480,412 L260,356 Z" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="480" y="351" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">下一個 token 是什麼</text>
  <text x="480" y="370" font-size="11.5" text-anchor="middle" fill="#b45309">（parser 在這裡才定案）</text>
  <line x1="480" y1="274" x2="480" y2="300" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- left: => -->
  <rect x="34" y="446" width="250" height="60" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <text x="159" y="468" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">是 =&gt;　→　回頭把 (element)</text>
  <text x="159" y="486" font-size="12" text-anchor="middle" fill="#047857">重新解讀成「參數列」</text>
  <text x="159" y="501" font-size="11" text-anchor="middle" fill="#6b7280">整體是一個箭頭函式</text>
  <path d="M260,356 L159,356 L159,446" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="168" y="404" font-size="11.5" font-weight="700" fill="#16a34a">=&gt;</text>

  <!-- left sub decision: body -->
  <rect x="34" y="534" width="250" height="88" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="159" y="556" font-size="12" font-weight="700" text-anchor="middle" fill="#166534">主體有沒有大括號</text>
  <text x="48" y="578" font-size="11.5" fill="#166534">沒有 → concise body，自動回傳</text>
  <text x="60" y="594" font-size="11" fill="#4b5563">(element) =&gt; element &lt; 40</text>
  <text x="48" y="612" font-size="11.5" fill="#166534">有 → block body，必須自己寫 return</text>
  <line x1="159" y1="506" x2="159" y2="534" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ag)"/>

  <!-- middle: function keyword -->
  <rect x="356" y="446" width="248" height="60" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="480" y="468" font-size="12" font-weight="700" text-anchor="middle" fill="#1e40af">若一開始就是 function 關鍵字</text>
  <text x="480" y="486" font-size="12" text-anchor="middle" fill="#1d4ed8">→ 傳統函式表達式，一樣合法</text>
  <text x="480" y="501" font-size="11" text-anchor="middle" fill="#6b7280">const f = function (element) { … }</text>
  <line x1="480" y1="412" x2="480" y2="446" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- right: { -->
  <rect x="676" y="446" width="250" height="60" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="801" y="468" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">是 {　→　文法裡沒有任何一條</text>
  <text x="801" y="486" font-size="12" text-anchor="middle" fill="#b91c1c">允許「括號表達式後面接區塊」</text>
  <text x="801" y="501" font-size="11" text-anchor="middle" fill="#6b7280">(element){ element &lt; 40 }</text>
  <path d="M700,356 L801,356 L801,446" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ard)"/>
  <text x="762" y="404" font-size="11.5" font-weight="700" fill="#dc2626">{</text>

  <rect x="676" y="534" width="250" height="52" rx="26" fill="#fee2e2" stroke="#dc2626"/>
  <text x="801" y="556" font-size="12.5" font-weight="700" text-anchor="middle" fill="#991b1b">Uncaught SyntaxError:</text>
  <text x="801" y="574" font-size="12.5" font-weight="700" text-anchor="middle" fill="#991b1b">Unexpected token '{'</text>
  <line x1="801" y1="506" x2="801" y2="534" stroke="#dc2626" stroke-width="2" marker-end="url(#ard)"/>
  <text x="676" y="606" font-size="11" fill="#991b1b">錯誤指的是 { 而不是 ( —— ( element ) 本身沒錯</text>

  <text x="24" y="640" font-size="11" fill="#6b7280">結論：「寫成 const f = … 就一定要用箭頭函式」是錯的。中間那條路（function 關鍵字）同樣合法，引擎只是需要你二選一講清楚。</text>
</svg>
