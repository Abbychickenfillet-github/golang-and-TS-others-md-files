<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#fdfdfb"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">Googlebot 爬取行為與 FCP 首次內容繪製 時間線對比</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#777">以 CSR 客戶端渲染為例 · 橫軸為毫秒 ms</text>

  <!-- FCP zones -->
  <rect x="90" y="80" width="286" height="26" fill="#BBFABB" opacity="0.75"/>
  <rect x="376" y="80" width="212" height="26" fill="#FFF3A3" opacity="0.85"/>
  <rect x="588" y="80" width="242" height="26" fill="#FF5582" opacity="0.45"/>
  <text x="233" y="98" text-anchor="middle" font-size="12" fill="#245c24" font-weight="600">Good FCP ≤ 1800ms</text>
  <text x="482" y="98" text-anchor="middle" font-size="12" fill="#7a5c00" font-weight="600">Needs Improvement 1800–3000ms</text>
  <text x="709" y="98" text-anchor="middle" font-size="12" fill="#8b1030" font-weight="600">Poor FCP &gt; 3000ms</text>

  <!-- axis -->
  <line x1="90" y1="150" x2="840" y2="150" stroke="#333" stroke-width="2"/>
  <polygon points="840,150 832,146 832,154" fill="#333"/>

  <!-- ticks -->
  <g font-size="11" fill="#555" text-anchor="middle">
    <line x1="90"  y1="145" x2="90"  y2="155" stroke="#333"/><text x="90"  y="170">0</text>
    <line x1="106" y1="145" x2="106" y2="155" stroke="#333"/><text x="112" y="186">50</text>
    <line x1="216" y1="145" x2="216" y2="155" stroke="#333"/><text x="216" y="170">800</text>
    <line x1="376" y1="145" x2="376" y2="155" stroke="#333"/><text x="376" y="170">1800</text>
    <line x1="466" y1="145" x2="466" y2="155" stroke="#333"/><text x="466" y="186">1500</text>
    <line x1="588" y1="145" x2="588" y2="155" stroke="#333"/><text x="588" y="170">3000</text>
    <line x1="828" y1="145" x2="828" y2="155" stroke="#333"/><text x="828" y="170">4000</text>
  </g>

  <!-- browser lane -->
  <text x="90" y="222" font-size="13" font-weight="700" fill="#1b4d8f">瀏覽器渲染流程</text>
  <rect x="90" y="232" width="16" height="30" rx="4" fill="#ADCCFF"/>
  <rect x="106" y="232" width="110" height="30" rx="4" fill="#cfe2ff"/>
  <rect x="216" y="232" width="140" height="30" rx="4" fill="#ADCCFF"/>
  <rect x="356" y="232" width="200" height="30" rx="4" fill="#8fb8f5"/>
  <rect x="556" y="232" width="40" height="30" rx="4" fill="#4f86e0"/>
  <text x="161" y="252" text-anchor="middle" font-size="11" fill="#123">回應 HTML 空殼</text>
  <text x="286" y="252" text-anchor="middle" font-size="11" fill="#123">解析 HTML 找到 JS</text>
  <text x="456" y="252" text-anchor="middle" font-size="11" fill="#fff">下載並執行 bundle.js · 打 API</text>
  <text x="576" y="252" text-anchor="middle" font-size="10" fill="#fff">繪製</text>

  <!-- content availability -->
  <text x="90" y="300" font-size="13" font-weight="700" fill="#8b1030">網頁內容可用性</text>
  <rect x="106" y="310" width="490" height="26" rx="4" fill="#f1f1f1" stroke="#ccc"/>
  <text x="351" y="327" text-anchor="middle" font-size="11" fill="#8b1030">畫面上只有 &lt;div id="root"&gt;&lt;/div&gt; · 爬蟲看不到任何內容</text>
  <rect x="596" y="310" width="234" height="26" rx="4" fill="#BBFABB"/>
  <text x="713" y="327" text-anchor="middle" font-size="11" fill="#245c24">完整 DOM 出現</text>

  <!-- googlebot lane -->
  <text x="90" y="378" font-size="13" font-weight="700" fill="#5a3a8f">Googlebot</text>
  <circle cx="90" cy="398" r="7" fill="#D2B3FF" stroke="#5a3a8f" stroke-width="1.5"/>
  <text x="90" y="424" text-anchor="middle" font-size="10" fill="#5a3a8f">發送請求</text>
  <circle cx="106" cy="398" r="7" fill="#D2B3FF" stroke="#5a3a8f" stroke-width="1.5"/>
  <text x="150" y="440" text-anchor="middle" font-size="10" fill="#5a3a8f">第一波：抓到空殼</text>

  <line x1="106" y1="398" x2="470" y2="398" stroke="#5a3a8f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="300" y="392" text-anchor="middle" font-size="10.5" fill="#5a3a8f">舊型爬蟲到此為止 → SEO 失敗</text>

  <line x1="470" y1="398" x2="820" y2="398" stroke="#5a3a8f" stroke-width="2"/>
  <circle cx="740" cy="398" r="7" fill="#BBFABB" stroke="#245c24" stroke-width="1.5"/>
  <text x="700" y="424" text-anchor="middle" font-size="10" fill="#245c24">第二波：Render Queue 排到才重新渲染</text>

  <!-- footnote -->
  <text x="90" y="462" font-size="11" fill="#777">註：Google 官方為兩階段索引，第二波可能延後數小時到數天，圖中壓縮在同一條時間線上僅為示意。</text>
</svg>
