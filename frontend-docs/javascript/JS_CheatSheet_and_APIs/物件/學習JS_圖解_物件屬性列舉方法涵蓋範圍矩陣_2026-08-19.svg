<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <rect width="980" height="660" fill="#fbfbfd"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#111827">物件屬性列舉方法的涵蓋範圍</text>
  <text x="30" y="60" font-size="12.5" fill="#6b7280">主軸圖｜屬性被切成四格加一圈，每個方法看得到哪幾格，一眼分辨</text>

  <!-- outer inherited ring -->
  <rect x="30" y="86" width="590" height="470" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="6 4"/>
  <text x="46" y="110" font-size="13" font-weight="700" fill="#b91c1c">繼承來的屬性（原型鏈上）</text>
  <text x="46" y="130" font-size="11.5" fill="#dc2626">只有 for...in 與 in 運算子看得到</text>

  <!-- own box -->
  <rect x="52" y="146" width="546" height="390" rx="14" fill="#ffffff" stroke="#9ca3af"/>
  <text x="68" y="172" font-size="13" font-weight="700" fill="#374151">自有屬性 own property</text>

  <!-- axis labels -->
  <text x="200" y="200" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">字串 key</text>
  <text x="450" y="200" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">Symbol key</text>
  <text x="68" y="270" font-size="12" font-weight="600" fill="#6b7280">可列舉</text>
  <text x="68" y="286" font-size="12" font-weight="600" fill="#6b7280">enumerable</text>
  <text x="68" y="302" font-size="12" font-weight="600" fill="#6b7280">true</text>
  <text x="68" y="418" font-size="12" font-weight="600" fill="#6b7280">不可列舉</text>
  <text x="68" y="434" font-size="12" font-weight="600" fill="#6b7280">enumerable</text>
  <text x="68" y="450" font-size="12" font-weight="600" fill="#6b7280">false</text>

  <!-- quadrant 1 -->
  <rect x="130" y="212" width="220" height="140" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <circle cx="152" cy="234" r="11" fill="#10b981"/><text x="152" y="238" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text>
  <text x="172" y="238" font-size="12.5" font-weight="700" fill="#065f46">字串＋可列舉</text>
  <text x="146" y="262" font-size="11.5" fill="#047857" font-family="monospace">obj.visible = "V"</text>
  <text x="146" y="284" font-size="11" fill="#6b7280">最常見的那一格</text>
  <text x="146" y="306" font-size="11" fill="#059669">keys／values／entries</text>
  <text x="146" y="322" font-size="11" fill="#059669">for...in（連繼承一起）</text>
  <text x="146" y="338" font-size="11" fill="#059669">JSON.stringify</text>

  <!-- quadrant 2 -->
  <rect x="366" y="212" width="220" height="140" rx="10" fill="#faf5ff" stroke="#8b5cf6"/>
  <circle cx="388" cy="234" r="11" fill="#8b5cf6"/><text x="388" y="238" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2</text>
  <text x="408" y="238" font-size="12.5" font-weight="700" fill="#5b21b6">Symbol＋可列舉</text>
  <text x="382" y="262" font-size="11.5" fill="#6d28d9" font-family="monospace">obj[Symbol("s")] = 1</text>
  <text x="382" y="284" font-size="11" fill="#6b7280">Symbol 天生就被排除</text>
  <text x="382" y="306" font-size="11" fill="#7c3aed">getOwnPropertySymbols</text>
  <text x="382" y="322" font-size="11" fill="#7c3aed">Reflect.ownKeys</text>
  <text x="382" y="338" font-size="11" fill="#dc2626">keys 看不到｜JSON 也丟掉</text>

  <!-- quadrant 3 -->
  <rect x="130" y="366" width="220" height="140" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <circle cx="152" cy="388" r="11" fill="#f59e0b"/><text x="152" y="392" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">3</text>
  <text x="172" y="392" font-size="12.5" font-weight="700" fill="#92400e">字串＋不可列舉</text>
  <text x="146" y="416" font-size="11.5" fill="#b45309" font-family="monospace">defineProperty(...)</text>
  <text x="146" y="438" font-size="11" fill="#6b7280">內建方法都住這格</text>
  <text x="146" y="460" font-size="11" fill="#d97706">getOwnPropertyNames</text>
  <text x="146" y="476" font-size="11" fill="#d97706">Reflect.ownKeys</text>
  <text x="146" y="492" font-size="11" fill="#dc2626">keys／for...in 都看不到</text>

  <!-- quadrant 4 -->
  <rect x="366" y="366" width="220" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <circle cx="388" cy="388" r="11" fill="#3b82f6"/><text x="388" y="392" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">4</text>
  <text x="408" y="392" font-size="12.5" font-weight="700" fill="#1e40af">Symbol＋不可列舉</text>
  <text x="382" y="416" font-size="11.5" fill="#1d4ed8" font-family="monospace">Symbol.iterator 之類</text>
  <text x="382" y="438" font-size="11" fill="#6b7280">最深的一格</text>
  <text x="382" y="460" font-size="11" fill="#2563eb">getOwnPropertySymbols</text>
  <text x="382" y="476" font-size="11" fill="#2563eb">Reflect.ownKeys</text>
  <text x="382" y="492" font-size="11" fill="#dc2626">其他全部看不到</text>

  <!-- coverage legend -->
  <rect x="650" y="86" width="300" height="470" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="670" y="114" font-size="13.5" font-weight="700" fill="#111827">誰看得到哪幾格</text>

  <g font-size="11.5">
    <rect x="670" y="130" width="260" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="682" y="150" font-family="monospace" fill="#111827">Object.keys / values / entries</text>
    <text x="682" y="169" fill="#059669">只有第 1 格</text>

    <rect x="670" y="190" width="260" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="682" y="210" font-family="monospace" fill="#111827">for...in</text>
    <text x="682" y="229" fill="#dc2626">第 1 格＋繼承來的可列舉字串鍵</text>

    <rect x="670" y="250" width="260" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="682" y="270" font-family="monospace" fill="#111827">Object.getOwnPropertyNames</text>
    <text x="682" y="289" fill="#d97706">第 1 格＋第 3 格（所有字串鍵）</text>

    <rect x="670" y="310" width="260" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="682" y="330" font-family="monospace" fill="#111827">Object.getOwnPropertySymbols</text>
    <text x="682" y="349" fill="#7c3aed">第 2 格＋第 4 格（所有 Symbol）</text>

    <rect x="670" y="370" width="260" height="52" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="682" y="390" font-family="monospace" fill="#111827">Reflect.ownKeys</text>
    <text x="682" y="409" fill="#4338ca" font-weight="600">四格全包，唯一的完整答案</text>

    <rect x="670" y="430" width="260" height="52" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="682" y="450" font-family="monospace" fill="#111827">JSON.stringify</text>
    <text x="682" y="469" fill="#059669">只有第 1 格，跟 keys 一樣</text>

    <rect x="670" y="490" width="260" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="682" y="510" font-family="monospace" fill="#111827">Object.getOwnPropertyDescriptor</text>
    <text x="682" y="529" fill="#b91c1c">四格都拿得到，但繼承的回 undefined</text>
  </g>

  <!-- ordering rule -->
  <rect x="30" y="572" width="920" height="58" rx="10" fill="#111827"/>
  <text x="48" y="596" font-size="12.5" fill="#f9fafb" font-weight="700">鍵的排序規則（Reflect.ownKeys 實測）</text>
  <text x="48" y="617" font-size="11.5" fill="#d1d5db" font-family="monospace">{ b:1, 2:1, a:1, 1:1, [Symbol("s")]:1, 10:1 }  →  ["1","2","10","b","a",Symbol(s)]   整數鍵先照數字小到大，再字串照寫入順序，Symbol 最後</text>

  <text x="30" y="652" font-size="10.5" fill="#9ca3af">資料來源 MDN Object（2026-05-22 更新）｜MDN console.table（2025-07-04 更新）｜MDN console（2025-02-13 更新）｜實測環境 Node.js v22 的 V8｜圖 2026-08-19</text>
</svg>
