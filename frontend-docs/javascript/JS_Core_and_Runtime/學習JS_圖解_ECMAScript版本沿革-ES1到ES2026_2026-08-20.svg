<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <rect width="1000" height="640" fill="#fbfbfd"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#111827">ECMAScript 版本沿革｜ES1 到 ES2026</text>
  <text x="30" y="58" font-size="12.5" fill="#6b7280">ECMAScript 是規格，JavaScript 是實作。ES6 之後改成每年 6 月發一版，版號＝年份。</text>

  <!-- 時間軸 -->
  <line x1="60" y1="120" x2="60" y2="596" stroke="#d1d5db" stroke-width="2"/>

  <!-- 早期 -->
  <circle cx="60" cy="140" r="7" fill="#10b981"/>
  <text x="82" y="136" font-size="13.5" font-weight="700" fill="#065f46">ES1　1997 年 6 月</text>
  <text x="82" y="155" font-size="11.5" fill="#374151">第一版標準。基本語法、物件模型、<tspan font-family="monospace">toString</tspan>、<tspan font-family="monospace">valueOf</tspan></text>

  <circle cx="60" cy="185" r="6" fill="#9ca3af"/>
  <text x="82" y="181" font-size="12.5" font-weight="600" fill="#6b7280">ES2　1998 年 8 月</text>
  <text x="82" y="199" font-size="11.5" fill="#6b7280">只有編輯修訂，沒有新功能</text>

  <circle cx="60" cy="228" r="7" fill="#10b981"/>
  <text x="82" y="224" font-size="13.5" font-weight="700" fill="#065f46">ES3　1999 年 12 月</text>
  <text x="82" y="243" font-size="11.5" fill="#374151">正規表達式、<tspan font-family="monospace">try/catch</tspan>、<tspan font-family="monospace">hasOwnProperty</tspan>、<tspan font-family="monospace">isPrototypeOf</tspan></text>

  <!-- ES4 -->
  <circle cx="60" cy="278" r="7" fill="#dc2626"/>
  <text x="82" y="274" font-size="13" font-weight="700" fill="#991b1b">ES4　難產，2008 年正式放棄</text>
  <text x="82" y="292" font-size="11.5" fill="#dc2626">想一次加入 class 與型別系統，各家對相容性有歧見而談不攏</text>
  <text x="82" y="309" font-size="11.5" fill="#6b7280">功能後來被拆散，分別放進 ES5 與 ES2015 —— 所以版號從 3 直接跳到 5</text>

  <!-- ES5 -->
  <circle cx="60" cy="344" r="8" fill="#8b5cf6"/>
  <text x="82" y="340" font-size="14" font-weight="700" fill="#5b21b6">ES5　2009 年 12 月　★ 物件 API 的分水嶺</text>
  <text x="82" y="359" font-size="11.5" fill="#374151" font-family="monospace">Object.keys｜Object.create｜Object.getPrototypeOf｜defineProperty</text>
  <text x="82" y="376" font-size="11.5" fill="#374151" font-family="monospace">getOwnPropertyNames｜getOwnPropertyDescriptor｜freeze / seal</text>
  <text x="82" y="393" font-size="11.5" fill="#6b7280">還有 strict mode、JSON、Array.isArray、String.trim</text>

  <!-- ES2015 -->
  <circle cx="60" cy="428" r="8" fill="#8b5cf6"/>
  <text x="82" y="424" font-size="14" font-weight="700" fill="#5b21b6">ES6 ＝ ES2015　2015 年 6 月　★ 改成年度發布</text>
  <text x="82" y="443" font-size="11.5" fill="#374151" font-family="monospace">let / const｜箭頭函式｜class｜Promise｜Map / Set｜Symbol｜Proxy</text>
  <text x="82" y="460" font-size="11.5" fill="#374151" font-family="monospace">Object.assign｜Object.is｜Object.setPrototypeOf｜Reflect</text>
  <text x="82" y="477" font-size="11.5" fill="#dc2626">Annex B 正式收錄 __proto__ —— 不是因為設計好，是因為移不掉</text>

  <!-- 年度區 -->
  <rect x="82" y="494" width="880" height="96" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="60" cy="512" r="6" fill="#3b82f6"/>
  <text x="98" y="516" font-size="12.5" font-weight="700" fill="#1e40af">ES2016 起每年 6 月一版　版號直接＝年份</text>

  <text x="98" y="538" font-size="11" fill="#374151"><tspan font-weight="700">2017</tspan> Object.values／entries／getOwnPropertyDescriptors　　<tspan font-weight="700">2019</tspan> Object.fromEntries</text>
  <text x="98" y="556" font-size="11" fill="#374151"><tspan font-weight="700">2020</tspan> BigInt、?. 、??　　<tspan font-weight="700">2022</tspan> Object.hasOwn、# 私有欄位、top-level await</text>
  <text x="98" y="574" font-size="11" fill="#374151"><tspan font-weight="700">2024</tspan> Object.groupBy／Map.groupBy　　<tspan font-weight="700">2025</tspan> Iterator helpers、Set 運算、Promise.try</text>

  <!-- ES2026 -->
  <circle cx="60" cy="606" r="8" fill="#f59e0b"/>
  <text x="82" y="610" font-size="13" font-weight="700" fill="#92400e">ES2026　第 17 版，2026 年 6 月 30 日通過　← 目前最新</text>

  <!-- 右上角：規格 vs 實作 -->
  <rect x="620" y="86" width="350" height="240" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="640" y="112" font-size="13" font-weight="700" fill="#111827">規格 ≠ 實作</text>
  <text x="640" y="136" font-size="11.5" fill="#374151">ECMAScript 是<tspan font-weight="700">規格書</tspan>，由 TC39 委員會制定</text>
  <text x="640" y="154" font-size="11.5" fill="#374151">JavaScript 是<tspan font-weight="700">實作</tspan>，由各家引擎去實現</text>
  <line x1="640" y1="168" x2="952" y2="168" stroke="#e5e7eb"/>
  <text x="640" y="190" font-size="11.5" fill="#92400e" font-weight="700">所以會出現這種落差：</text>
  <text x="640" y="210" font-size="11" fill="#374151" font-family="monospace">Map.prototype.getOrInsert</text>
  <text x="640" y="228" font-size="11" fill="#059669">✔ 已寫進 ES2026 規格</text>
  <text x="640" y="246" font-size="11" fill="#dc2626">✘ Node.js v22 實測不存在</text>
  <text x="640" y="264" font-size="11" fill="#dc2626">✘ MDN 仍標 Experimental</text>
  <line x1="640" y1="278" x2="952" y2="278" stroke="#e5e7eb"/>
  <text x="640" y="298" font-size="11" fill="#6b7280">判斷能不能用：看 MDN 的 Baseline 標記、</text>
  <text x="640" y="314" font-size="11" fill="#6b7280">或直接測 '方法名' in Map.prototype</text>

  <!-- 右中：命名混亂 -->
  <rect x="620" y="340" width="350" height="140" rx="12" fill="#faf5ff" stroke="#8b5cf6"/>
  <text x="640" y="366" font-size="13" font-weight="700" fill="#5b21b6">為什麼 ES6 又叫 ES2015</text>
  <text x="640" y="388" font-size="11.5" fill="#374151">第 6 版拖了 6 年才出，出完決定改成</text>
  <text x="640" y="406" font-size="11.5" fill="#374151">「每年發一版、版號用年份」，避免再難產。</text>
  <text x="640" y="428" font-size="11.5" fill="#5b21b6" font-weight="700">ES6 是舊稱，ES2015 是正式名稱</text>
  <text x="640" y="450" font-size="11" fill="#6b7280">之後不再有 ES7、ES8 這種叫法，</text>
  <text x="640" y="466" font-size="11" fill="#6b7280">一律講 ES2016、ES2017</text>

  <text x="30" y="628" font-size="10.5" fill="#9ca3af">資料來源 ECMA-262 官方站（第 17 版，2026 年 6 月）｜Wikipedia ECMAScript version history｜InfoWorld ES2026 approved（2026-06-30）｜圖 2026-08-20</text>
</svg>
