<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="up" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
    <marker id="dn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="gy" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="980" height="620" fill="#fbfbfd"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#111827">一個函式身上有兩條完全不同的線</text>
  <text x="30" y="58" font-size="12.5" fill="#6b7280">「.prototype 屬性」跟「[[Prototype]] 原型」名字很像，但是兩件事。這是最常見的混淆。</text>

  <!-- 中央函式 -->
  <rect x="360" y="270" width="250" height="72" rx="12" fill="#111827"/>
  <text x="485" y="298" font-size="14" fill="#f9fafb" text-anchor="middle" font-family="monospace">function Person() {}</text>
  <text x="485" y="320" font-size="11" fill="#9ca3af" text-anchor="middle">函式本身也是一個物件</text>

  <!-- 向上：[[Prototype]] -->
  <path d="M420,270 L420,182" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="238" y="230" font-size="12.5" fill="#8b5cf6" font-weight="700">[[Prototype]]　向上</text>
  <text x="238" y="248" font-size="11.5" fill="#6b7280">「我自己的原型是誰」</text>
  <text x="238" y="264" font-size="11" fill="#6b7280">用 Object.getPrototypeOf(f) 讀</text>

  <rect x="300" y="128" width="250" height="54" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="425" y="150" font-size="13" text-anchor="middle" fill="#5b21b6" font-family="monospace">Function.prototype</text>
  <text x="425" y="169" font-size="10.5" text-anchor="middle" fill="#6b7280">call｜apply｜bind｜toString</text>

  <path d="M425,128 L425,96" stroke="#9ca3af" stroke-width="2" marker-end="url(#gy)"/>
  <rect x="300" y="76" width="250" height="20" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="425" y="91" font-size="11" text-anchor="middle" fill="#6b7280" font-family="monospace">Object.prototype → null</text>

  <text x="600" y="212" font-size="11.5" fill="#059669" font-weight="700">✔ 每一個函式都有這條</text>
  <text x="600" y="230" font-size="11" fill="#6b7280">箭頭函式、Object.keys 也有</text>
  <text x="600" y="246" font-size="11" fill="#6b7280">這就是它們能用 .call() 的原因</text>

  <!-- 向右下：.prototype 屬性 -->
  <path d="M610,320 L706,376" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#dn)"/>
  <text x="614" y="352" font-size="12.5" fill="#92400e" font-weight="700">.prototype 屬性</text>

  <rect x="660" y="382" width="270" height="60" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="795" y="404" font-size="13" text-anchor="middle" fill="#92400e" font-family="monospace">Person.prototype</text>
  <text x="795" y="424" font-size="10.5" text-anchor="middle" fill="#6b7280">一個普通物件，放要給實例共用的方法</text>

  <path d="M795,442 L795,486" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#dn)"/>
  <text x="805" y="470" font-size="10.5" fill="#92400e">new 的時候接上去</text>

  <rect x="660" y="490" width="270" height="52" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="795" y="512" font-size="12.5" text-anchor="middle" fill="#065f46" font-family="monospace">new Person()</text>
  <text x="795" y="530" font-size="10.5" text-anchor="middle" fill="#6b7280">實例的 [[Prototype]] ＝ Person.prototype</text>

  <text x="360" y="404" font-size="11.5" fill="#92400e" font-weight="700">「我 new 出來的實例，</text>
  <text x="360" y="422" font-size="11.5" fill="#92400e" font-weight="700">　原型要是誰」</text>
  <text x="360" y="444" font-size="11" fill="#6b7280">用 f.prototype 讀</text>
  <text x="360" y="466" font-size="11.5" fill="#dc2626" font-weight="700">✘ 只有部分函式有這條</text>
  <text x="360" y="484" font-size="11" fill="#6b7280">箭頭函式、Object.keys 都沒有</text>

  <!-- 左下：對照表 -->
  <rect x="30" y="300" width="300" height="242" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="48" y="326" font-size="13" font-weight="700" fill="#111827">誰有 .prototype 屬性</text>

  <text x="48" y="352" font-size="11.5" fill="#059669" font-weight="700">✔ 有</text>
  <text x="66" y="370" font-size="11" fill="#374151" font-family="monospace">function 宣告／表達式</text>
  <text x="66" y="387" font-size="11" fill="#374151" font-family="monospace">class</text>
  <text x="66" y="404" font-size="11" fill="#374151" font-family="monospace">內建建構函式 Object｜Map</text>
  <text x="66" y="421" font-size="11" fill="#374151" font-family="monospace">generator 函式</text>

  <text x="48" y="447" font-size="11.5" fill="#dc2626" font-weight="700">✘ 沒有</text>
  <text x="66" y="465" font-size="11" fill="#374151" font-family="monospace">箭頭函式 () =&gt; {}</text>
  <text x="66" y="482" font-size="11" fill="#374151" font-family="monospace">方法簡寫 { m(){} }</text>
  <text x="66" y="499" font-size="11" fill="#374151" font-family="monospace">class 的方法</text>
  <text x="66" y="516" font-size="11" fill="#374151" font-family="monospace">Object.keys｜Math.max</text>
  <text x="66" y="533" font-size="11" fill="#374151" font-family="monospace">f.bind() 綁定函式</text>

  <!-- 底部：兩個例外 -->
  <rect x="30" y="558" width="900" height="44" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="48" y="577" font-size="11.5" fill="#991b1b" font-weight="700">兩個打破直覺的例外：</text>
  <text x="180" y="577" font-size="11.5" fill="#374151">generator 有 .prototype 但不能 new　｜　f.bind() 沒有 .prototype 卻能 new（借原本函式的）</text>
  <text x="48" y="594" font-size="11" fill="#6b7280">→ 真正決定「能不能 new」的是規範裡的內部方法 [[Construct]]，.prototype 只是「通常」跟著它出現</text>

  <text x="600" y="266" font-size="10.5" fill="#9ca3af">實測 Node.js v22｜圖 2026-08-21</text>
</svg>
