<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif">
  <style>
    .bg { fill: oklch(0.98 0.005 260); }
    .box { fill: oklch(0.95 0.03 250); stroke: oklch(0.45 0.12 250); stroke-width: 2; }
    .box-a { fill: oklch(0.95 0.05 150); stroke: oklch(0.45 0.13 150); stroke-width: 2; }
    .box-b { fill: oklch(0.96 0.04 85); stroke: oklch(0.5 0.12 70); stroke-width: 2; stroke-dasharray: 8 5; }
    .out { fill: oklch(0.93 0.02 260); stroke: oklch(0.3 0.03 260); stroke-width: 2; }
    .t { fill: oklch(0.22 0.02 260); font-size: 18px; font-weight: 700; }
    .s { fill: oklch(0.35 0.02 260); font-size: 14px; }
    .tag { fill: oklch(0.42 0.2 27); font-size: 14px; font-weight: 700; }
    .arr { stroke: oklch(0.3 0.03 260); stroke-width: 2.5; fill: none; }
    .arr-d { stroke: oklch(0.5 0.12 70); stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; }
    .head { fill: oklch(0.3 0.03 260); }
    .head-d { fill: oklch(0.5 0.12 70); }
  </style>
  <rect class="bg" width="960" height="560"/>

  <text class="t" x="30" y="36">本專案的 CSS 打包路徑（Next 15 + next dev --turbopack，實測 2026-11-07）</text>

  <rect class="box" x="30" y="70" width="200" height="86" rx="8"/>
  <text class="t" x="46" y="102">legal.module.scss</text>
  <text class="s" x="46" y="128">你寫的 Sass</text>
  <text class="s" x="46" y="146">backdrop-filter: blur(20px)</text>

  <line class="arr" x1="230" y1="113" x2="290" y2="113"/>
  <polygon class="head" points="290,106 304,113 290,120"/>

  <rect class="box" x="304" y="70" width="210" height="86" rx="8"/>
  <text class="t" x="320" y="102">Sass 編譯器</text>
  <text class="s" x="320" y="128">$變數、巢狀、@use</text>
  <text class="s" x="320" y="146">編譯成純 CSS</text>

  <line class="arr" x1="514" y1="113" x2="574" y2="113"/>
  <polygon class="head" points="574,106 588,113 574,120"/>

  <rect class="box-a" x="588" y="70" width="342" height="170" rx="8"/>
  <text class="t" x="604" y="102">Lightning CSS（Turbopack 內建，Rust）</text>
  <text class="s" x="604" y="130">依目標瀏覽器補／去前綴</text>
  <text class="s" x="604" y="150">處理 CSS Modules 改名、巢狀、壓縮</text>
  <text class="s" x="604" y="176">Next 預設目標：chrome 111、edge 111、</text>
  <text class="s" x="604" y="196">firefox 111、safari 16.4</text>
  <text class="tag" x="604" y="224">補出 -webkit-backdrop-filter 的是這格（推論）</text>

  <line class="arr" x1="759" y1="240" x2="759" y2="300"/>
  <polygon class="head" points="752,300 759,314 766,300"/>

  <rect class="out" x="588" y="314" width="342" height="110" rx="8"/>
  <text class="t" x="604" y="346">.next/static/chunks/*.css</text>
  <text class="s" x="604" y="372">-webkit-backdrop-filter: blur(20px);   第 9 行</text>
  <text class="s" x="604" y="392">backdrop-filter: blur(20px);           第 10 行</text>
  <text class="s" x="604" y="412">瀏覽器收到的是這份，不是 .scss</text>

  <rect class="box-b" x="30" y="290" width="520" height="220" rx="8"/>
  <text class="t" x="46" y="322">只有專案放了 postcss.config.* 才會多走這段</text>
  <text class="s" x="46" y="350">PostCSS：把 CSS 字串解析成 AST（JS 物件樹），</text>
  <text class="s" x="46" y="370">讓外掛增刪改節點，再轉回字串</text>
  <text class="s" x="46" y="398">Autoprefixer：PostCSS 的一個外掛，</text>
  <text class="s" x="46" y="418">依 Browserslist + Can I Use 補 -webkit- 等前綴</text>
  <text class="s" x="46" y="446">Turbopack 以 Node.js worker pool 執行 PostCSS 設定</text>
  <text class="tag" x="46" y="474">本專案沒有 postcss.config.*，也沒裝 autoprefixer，</text>
  <text class="tag" x="46" y="494">這段沒有執行</text>

  <path class="arr-d" d="M550 400 C 566 400, 570 390, 580 380"/>
  <polygon class="head-d" points="580,372 592,380 578,388"/>

  <text class="s" x="30" y="534">實線＝本專案實際走的路　虛線框＝有放 postcss.config.* 才會走的路（與 Lightning CSS 的先後順序文件沒寫）</text>
</svg>
