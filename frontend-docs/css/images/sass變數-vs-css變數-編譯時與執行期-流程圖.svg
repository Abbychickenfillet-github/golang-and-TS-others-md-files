<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 770" role="img" aria-label="Sass 變數與 CSS 變數：編譯時與執行期的流程圖" style="font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="980" height="770" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5b68"/></marker></defs><text x="215" y="26" font-size="17" font-weight="700" fill="#23303b" text-anchor="middle">Sass 變數  $text</text><text x="700" y="26" font-size="17" font-weight="700" fill="#23303b" text-anchor="middle">CSS 變數  --legal-text</text><rect x="50.0" y="44" width="330" height="48" rx="24.0" fill="#e9f7ee" stroke="#4b5b68" stroke-width="2"/><text x="215" y="58" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">開始：寫 SCSS</text><text x="215" y="78" font-size="14" font-family="Consolas,monospace" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">p { color: $text }</text><path d="M215 92L215 124" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="50.0" y="124" width="330" height="52" fill="#fff" stroke="#4b5b68" stroke-width="2"/><text x="215" y="140" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">Sass 編譯器把 $text</text><text x="215" y="160" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">換成實際值 #4a5568</text><path d="M215 176L215 210" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="50.0" y="210" width="330" height="62" fill="#fdecea" stroke="#4b5b68" stroke-width="2"/><text x="215" y="231" font-size="14" font-family="Consolas,monospace" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">輸出 CSS：p { color: #4a5568 }</text><text x="215" y="251" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">$text 已消失，只剩死值</text><path d="M215 272L215 336" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="50.0" y="336" width="330" height="52" fill="#fff" stroke="#4b5b68" stroke-width="2"/><text x="215" y="362" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">瀏覽器載入：color 就是 #4a5568</text><path d="M215 388L215 412" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><polygon points="50.0,462 215,412 380.0,462 215,512" fill="#fff8dc" stroke="#4b5b68" stroke-width="2"/><text x="215" y="462" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">使用者切換 data-theme？</text><path d="M215 512L215 548" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="225" y="534" font-size="14" font-weight="700" fill="#b3261e" text-anchor="start">是</text><rect x="50.0" y="548" width="330" height="52" fill="#fff" stroke="#4b5b68" stroke-width="2"/><text x="215" y="564" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">沒有變數可更新</text><text x="215" y="584" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">顏色不變</text><path d="M215 600L215 636" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="50.0" y="636" width="330" height="48" rx="24.0" fill="#fdecea" stroke="#4b5b68" stroke-width="2"/><text x="215" y="660" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">結束：深色背景上仍是深灰字</text><rect x="535.0" y="44" width="330" height="48" rx="24.0" fill="#e9f7ee" stroke="#4b5b68" stroke-width="2"/><text x="700" y="58" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">開始：寫 SCSS</text><text x="700" y="78" font-size="14" font-family="Consolas,monospace" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">p { color: var(--legal-text, #4a5568) }</text><path d="M700 92L700 124" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="535.0" y="124" width="330" height="52" fill="#fff" stroke="#4b5b68" stroke-width="2"/><text x="700" y="140" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">Sass 編譯器不處理 var()</text><text x="700" y="160" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">原樣放行</text><path d="M700 176L700 210" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="535.0" y="210" width="330" height="62" fill="#eaf2f7" stroke="#4b5b68" stroke-width="2"/><text x="700" y="231" font-size="14" font-family="Consolas,monospace" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">輸出 CSS：p { color: var(--legal-text…) }</text><text x="700" y="251" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">var() 還在</text><path d="M700 272L700 336" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="535.0" y="336" width="330" height="52" fill="#fff" stroke="#4b5b68" stroke-width="2"/><text x="700" y="352" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">瀏覽器載入：依目前 data-theme</text><text x="700" y="372" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">解析 --legal-text</text><path d="M700 388L700 412" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><polygon points="535.0,462 700,412 865.0,462 700,512" fill="#fff8dc" stroke="#4b5b68" stroke-width="2"/><text x="700" y="462" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">使用者切換 data-theme？</text><path d="M700 512L700 548" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="710" y="534" font-size="14" font-weight="700" fill="#b3261e" text-anchor="start">是</text><rect x="535.0" y="548" width="330" height="52" fill="#fff" stroke="#4b5b68" stroke-width="2"/><text x="700" y="574" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">瀏覽器重新解析 --legal-text</text><path d="M700 600L700 636" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="535.0" y="636" width="330" height="40" fill="#fff" stroke="#4b5b68" stroke-width="2"/><text x="700" y="656" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">畫面即時換色，不用重新打包</text><path d="M700 676L700 700" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="535.0" y="700" width="330" height="48" rx="24.0" fill="#e9f7ee" stroke="#4b5b68" stroke-width="2"/><text x="700" y="724" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">結束：字色跟著主題</text><path d="M380.0 462L402.0 462" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="384.0" y="454" font-size="14" font-weight="700" fill="#b3261e" text-anchor="start">否</text><rect x="402.0" y="444" width="84" height="36" rx="18" fill="#e9f7ee" stroke="#4b5b68" stroke-width="2"/><text x="444.0" y="462" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">維持原樣</text><path d="M865.0 462L887.0 462" stroke="#4b5b68" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="869.0" y="454" font-size="14" font-weight="700" fill="#b3261e" text-anchor="start">否</text><rect x="887.0" y="444" width="84" height="36" rx="18" fill="#e9f7ee" stroke="#4b5b68" stroke-width="2"/><text x="929.0" y="462" font-size="14" font-family="inherit" font-weight="400" fill="#23303b" text-anchor="middle" dominant-baseline="middle">維持原樣</text><line x1="20" y1="303" x2="960" y2="303" stroke="#8a97a3" stroke-width="2" stroke-dasharray="8 6"/><text x="24" y="296" font-size="13" fill="#6b7b88" font-weight="700">上：build time（打包時）</text><text x="24" y="321" font-size="13" fill="#6b7b88" font-weight="700">下：runtime（瀏覽器執行期）</text></svg>