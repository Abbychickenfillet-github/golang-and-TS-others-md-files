<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="t d">
  <title id="t">瀏覽器（殼）與渲染引擎的關係</title>
  <desc id="d">KHTML 在 2001 年被 Apple 分支成 WebKit，Google 在 2013 年從 WebCore 分支出 Blink。iPhone 上所有瀏覽器用 WebKit，電腦與 Android 的 Chrome、Edge 用 Blink，Firefox 用 Gecko。</desc>
  <style>
    :root{
      --bg:oklch(0.98 0.005 250);
      --fg:oklch(0.25 0.02 260);
      --muted:oklch(0.45 0.02 260);
      --line:oklch(0.55 0.02 260);
      --blue:oklch(0.55 0.17 250);
      --blue-bg:oklch(0.93 0.04 250);
      --red:oklch(0.55 0.22 27);
      --red-bg:oklch(0.95 0.03 27);
      --green:oklch(0.5 0.12 150);
      --green-bg:oklch(0.94 0.04 150);
    }
    text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:var(--fg)}
    .bg{fill:var(--bg)}
    .h1{font-size:20px;font-weight:700}
    .h2{font-size:14px;fill:var(--muted)}
    .row{font-size:14px;font-weight:700;fill:var(--muted)}
    .name{font-size:18px;font-weight:700}
    .sub{font-size:12.5px;fill:var(--muted)}
    .chip{font-size:14px;font-weight:600}
    .lab{font-size:12.5px}
    .box{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
    .gecko{fill:var(--green-bg);stroke:var(--green);stroke-width:2}
    .old{fill:oklch(0.96 0.005 250);stroke:var(--line);stroke-width:2;stroke-dasharray:6 4}
    .grp{fill:none;stroke:var(--line);stroke-width:1.5}
    .cp{fill:oklch(1 0 0);stroke:var(--line);stroke-width:1.5}
    .ln{stroke:var(--fg);stroke-width:2;fill:none}
    .red{fill:var(--red-bg);stroke:var(--red);stroke-width:2.5}
    .rt{fill:var(--red);font-size:14px;font-weight:700}
    .src{font-size:11px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="oklch(0.25 0.02 260)"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="570"/>

  <text class="h1" x="20" y="32">瀏覽器 = 殼 + 渲染引擎</text>
  <text class="h2" x="20" y="54">iPhone 上的 Safari、Chrome、Firefox，核心渲染是同一個：WebKit</text>

  <!-- 列標籤 -->
  <text class="row" x="20" y="105">來源</text>
  <text class="row" x="20" y="235">渲染引擎</text>
  <text class="row" x="20" y="380">瀏覽器</text>

  <!-- KHTML -->
  <rect class="old" x="215" y="72" width="200" height="56" rx="6"/>
  <text class="name" x="315" y="97" text-anchor="middle">KHTML</text>
  <text class="sub" x="315" y="116" text-anchor="middle">KDE 專案的引擎</text>

  <!-- KHTML -> WebKit -->
  <line class="ln" x1="315" y1="128" x2="315" y2="190" marker-end="url(#ar)"/>
  <text class="lab" x="327" y="156">2001 Apple</text>
  <text class="lab" x="327" y="173">分支（fork）</text>

  <!-- 引擎列 -->
  <rect class="box" x="215" y="192" width="200" height="82" rx="6"/>
  <text class="name" x="315" y="220" text-anchor="middle">WebKit</text>
  <text class="sub" x="315" y="241" text-anchor="middle">Apple 主導</text>
  <text class="sub" x="315" y="258" text-anchor="middle">Safari 同款</text>

  <rect class="box" x="505" y="192" width="200" height="82" rx="6"/>
  <text class="name" x="605" y="220" text-anchor="middle">Blink</text>
  <text class="sub" x="605" y="241" text-anchor="middle">Chromium 專案</text>
  <text class="sub" x="605" y="258" text-anchor="middle">Google 主導</text>

  <rect class="gecko" x="775" y="192" width="200" height="82" rx="6"/>
  <text class="name" x="875" y="220" text-anchor="middle">Gecko</text>
  <text class="sub" x="875" y="241" text-anchor="middle">Mozilla 主導</text>
  <text class="sub" x="875" y="258" text-anchor="middle">與 WebKit 無關</text>

  <!-- WebKit -> Blink -->
  <line class="ln" x1="415" y1="233" x2="505" y2="233" marker-end="url(#ar)"/>
  <text class="lab" x="460" y="211" text-anchor="middle">2013 Google</text>
  <text class="lab" x="460" y="227" text-anchor="middle">分支（fork）</text>

  <!-- 瀏覽器 -> 引擎 -->
  <line class="ln" x1="315" y1="330" x2="315" y2="276" marker-end="url(#ar)"/>
  <line class="ln" x1="605" y1="330" x2="605" y2="276" marker-end="url(#ar)"/>
  <line class="ln" x1="875" y1="330" x2="875" y2="276" marker-end="url(#ar)"/>
  <text class="lab" x="327" y="308">使用</text>
  <text class="lab" x="617" y="308">使用</text>
  <text class="lab" x="887" y="308">使用</text>

  <!-- 瀏覽器群組 -->
  <rect class="grp" x="195" y="332" width="240" height="98" rx="8"/>
  <text class="lab" x="315" y="352" text-anchor="middle">iPhone／iPad 上所有瀏覽器</text>
  <rect class="cp" x="207" y="368" width="68" height="40" rx="5"/>
  <text class="chip" x="241" y="393" text-anchor="middle">Safari</text>
  <rect class="cp" x="283" y="368" width="68" height="40" rx="5"/>
  <text class="chip" x="317" y="393" text-anchor="middle">Chrome</text>
  <rect class="cp" x="359" y="368" width="68" height="40" rx="5"/>
  <text class="chip" x="393" y="393" text-anchor="middle">Firefox</text>

  <rect class="grp" x="480" y="332" width="250" height="98" rx="8"/>
  <text class="lab" x="605" y="352" text-anchor="middle">電腦與 Android</text>
  <rect class="cp" x="499" y="368" width="100" height="40" rx="5"/>
  <text class="chip" x="549" y="393" text-anchor="middle">Chrome</text>
  <rect class="cp" x="611" y="368" width="100" height="40" rx="5"/>
  <text class="chip" x="661" y="393" text-anchor="middle">Edge</text>

  <rect class="grp" x="770" y="332" width="210" height="98" rx="8"/>
  <text class="lab" x="875" y="352" text-anchor="middle">電腦與 Android</text>
  <rect class="cp" x="825" y="368" width="100" height="40" rx="5"/>
  <text class="chip" x="875" y="393" text-anchor="middle">Firefox</text>

  <!-- 殼 -->
  <rect class="red" x="195" y="448" width="785" height="68" rx="8"/>
  <text class="rt" x="212" y="474">殼（各家瀏覽器自己做）：介面、分頁、書籤、帳號整合、擴充功能</text>
  <text class="rt" x="212" y="500">引擎（上面藍色與綠色框）：解析 HTML 與 CSS、排版、繪製</text>

  <text class="src" x="20" y="540">來源：Wikipedia「WebKit」（2001 年 Lisa Melton 在 Apple 內部以 KHTML 與 KJS 分支；2013-04-03 Google 宣布從 WebCore 分支）；</text>
  <text class="src" x="20" y="556">Apple App Review Guidelines 2.5.6（iPhone 上的瀏覽器須用 WebKit；歐盟與日本例外）；MDN Vendor_Prefix。</text>
</svg>
