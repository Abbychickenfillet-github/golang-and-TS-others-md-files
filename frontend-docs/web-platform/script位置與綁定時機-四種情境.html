<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>script 位置與綁定時機：五種情境</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d1d1f;
    --mut: #5f6672;
    --line: #d8dce3;
    --card: #f6f7f9;
    --ok: #0a7d3b;
    --bad: #b42318;
    --btn: #1f4fd8;
    --btn-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8eaed;
      --mut: #a0a6b0;
      --line: #2c3038;
      --card: #1c1f25;
      --ok: #5ad08a;
      --bad: #ff8a80;
      --btn: #7aa2ff;
      --btn-fg: #10131a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 system-ui, "Noto Sans TC", sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--mut); margin: 0 0 20px; }
  .rule {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
  }
  .rule p { margin: 0; }
  .rule p + p { margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 820px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    background: var(--card);
    min-width: 0;
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 2px; }
  .tag { color: var(--mut); font-size: 0.85rem; margin: 0 0 8px; }
  pre {
    margin: 0 0 10px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow-x: auto;
    font: 12.5px/1.5 ui-monospace, Consolas, monospace;
  }
  iframe {
    width: 100%;
    height: 56px;
    border: 1px dashed var(--line);
    border-radius: 6px;
    background: #ffffff;
    display: block;
    margin-bottom: 10px;
  }
  .stat { margin: 0 0 6px; font-weight: 600; }
  .stat.ok { color: var(--ok); }
  .stat.bad { color: var(--bad); }
  ol.log {
    margin: 0 0 10px;
    padding-left: 1.4em;
    font: 12.5px/1.6 ui-monospace, Consolas, monospace;
    min-height: 3.2em;
  }
  ol.log li.err { color: var(--bad); }
  button.reload {
    font: inherit;
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--btn);
    background: transparent;
    color: var(--btn);
    cursor: pointer;
  }
  button.reload:hover { background: var(--btn); color: var(--btn-fg); }
</style>
</head>
<body>
<main>
  <h1>script 位置與綁定時機：五種情境</h1>
  <p class="sub">每張卡片是一個獨立的小網頁，按框裡的「按我」，看右邊的紀錄。</p>

  <div class="rule">
    <p>時間軸 A（載入）：script 本體只跑一次，嘗試把處理函式綁到按鈕上。</p>
    <p>時間軸 B（使用者操作）：每按一次，已綁好的處理函式就被呼叫一次。</p>
    <p>A 決定 B 有沒有函式可呼叫，B 的次數由你按幾次決定。</p>
  </div>

  <div class="grid" id="grid"></div>
</main>

<script>
  var SCENES = [
    {
      id: 'A',
      title: 'A　script 在 head，直接綁定',
      tag: '預期：失敗。script 跑的時候按鈕還不存在',
      where: 'head',
      code:
        "const btn = document.getElementById('btn')\n" +
        "L('script 本體執行：body = ' + document.body + '，btn = ' + btn)\n" +
        "let n = 0\n" +
        "btn.addEventListener('click', () => {\n" +
        "  n++; C(); L('處理函式被呼叫，第 ' + n + ' 次')\n" +
        "})"
    },
    {
      id: 'E',
      title: 'E　script 在 body 一開頭（按鈕之前），直接綁定',
      tag: '預期：失敗，和 head 一樣。按鈕寫在 script 後面，script 跑的時候還沒建好',
      where: 'bodyStart',
      code:
        "const btn = document.getElementById('btn')\n" +
        "L('script 本體執行：btn = ' + btn)\n" +
        "let n = 0\n" +
        "btn.addEventListener('click', () => {\n" +
        "  n++; C(); L('處理函式被呼叫，第 ' + n + ' 次')\n" +
        "})"
    },
    {
      id: 'B',
      title: 'B　script 在 head，等 DOMContentLoaded 再綁',
      tag: '預期：成功。等 DOM 蓋好才去找按鈕',
      where: 'head',
      code:
        "L('script 本體執行：btn = ' + document.getElementById('btn'))\n" +
        "document.addEventListener('DOMContentLoaded', () => {\n" +
        "  const btn = document.getElementById('btn')\n" +
        "  L('DOMContentLoaded：btn = ' + btn)\n" +
        "  let n = 0\n" +
        "  btn.addEventListener('click', () => {\n" +
        "    n++; C(); L('處理函式被呼叫，第 ' + n + ' 次')\n" +
        "  })\n" +
        "})"
    },
    {
      id: 'C',
      title: 'C　script 在 head，事件委派到 document',
      tag: '預期：成功。document 一開始就存在，點擊時才判斷點到誰',
      where: 'head',
      code:
        "L('script 本體執行：body = ' + document.body + '，綁在 document 上')\n" +
        "let n = 0\n" +
        "document.addEventListener('click', (e) => {\n" +
        "  if (e.target.id !== 'btn') return\n" +
        "  n++; C(); L('處理函式被呼叫，第 ' + n + ' 次')\n" +
        "})"
    },
    {
      id: 'D',
      title: 'D　script 在 body 結尾，直接綁定',
      tag: '預期：成功。script 跑的時候按鈕已經在 DOM 裡',
      where: 'bodyEnd',
      code:
        "const btn = document.getElementById('btn')\n" +
        "L('script 本體執行：btn = ' + btn)\n" +
        "let n = 0\n" +
        "btn.addEventListener('click', () => {\n" +
        "  n++; C(); L('處理函式被呼叫，第 ' + n + ' 次')\n" +
        "})"
    }
  ]

  // 每張卡片的 HTML 結構：script 與按鈕誰先誰後，就是成敗的關鍵
  var SHAPE = {
    head: '<head> <script>…<\/script> </head>\n<body> <button id="btn"> </body>',
    bodyStart: '<body> <script>…<\/script> <button id="btn"> </body>',
    bodyEnd: '<body> <button id="btn"> <script>…<\/script> </body>'
  }

  // 每個小網頁都先放一段共用的前置 script：L 寫紀錄、C 通知被呼叫、onerror 抓錯誤
  function buildPage(scene) {
    var prelude =
      '<script>' +
      'var ID=' + JSON.stringify(scene.id) + ';' +
      'function L(t){parent.postMessage({id:ID,type:"log",text:t},"*")}' +
      'function C(){parent.postMessage({id:ID,type:"call"},"*")}' +
      'window.onerror=function(m){parent.postMessage({id:ID,type:"err",text:m},"*")}' +
      '<\/script>'
    var user = '<script>' + scene.code + '<\/script>'
    var head = scene.where === 'head' ? prelude + user : prelude
    var tail = scene.where === 'bodyEnd' ? user : ''
    var top = scene.where === 'bodyStart' ? user : ''
    return (
      '<!doctype html><html><head><meta charset="utf-8">' + head + '</head>' +
      '<body style="font:14px sans-serif;margin:10px">' + top +
      '<button id="btn" style="font:inherit;padding:4px 14px">按我</button>' +
      tail + '</body></html>'
    )
  }

  var grid = document.getElementById('grid')
  var state = {}

  SCENES.forEach(function (s) {
    state[s.id] = { calls: 0, frame: null, log: null, stat: null }
    var card = document.createElement('section')
    card.className = 'card'

    var h = document.createElement('h2')
    h.textContent = s.title
    var tag = document.createElement('p')
    tag.className = 'tag'
    tag.textContent = s.tag
    var pre = document.createElement('pre')
    pre.textContent = '結構：\n' + SHAPE[s.where] + '\n\n<script> 內容\n' + s.code
    var frame = document.createElement('iframe')
    frame.title = '情境 ' + s.id
    var stat = document.createElement('p')
    stat.className = 'stat'
    var log = document.createElement('ol')
    log.className = 'log'
    var btn = document.createElement('button')
    btn.className = 'reload'
    btn.type = 'button'
    btn.textContent = '重新載入這張'
    btn.addEventListener('click', function () { load(s) })

    card.append(h, tag, pre, frame, stat, log, btn)
    grid.append(card)
    state[s.id].frame = frame
    state[s.id].log = log
    state[s.id].stat = stat
    load(s)
  })

  function render(id) {
    var st = state[id]
    st.stat.textContent = '處理函式被呼叫：' + st.calls + ' 次'
    st.stat.className = 'stat ' + (st.calls > 0 ? 'ok' : '')
  }

  function load(s) {
    var st = state[s.id]
    st.calls = 0
    st.log.textContent = ''
    render(s.id)
    st.frame.srcdoc = buildPage(s)
  }

  window.addEventListener('message', function (e) {
    var d = e.data
    if (!d || !state[d.id]) return
    var st = state[d.id]
    if (d.type === 'call') {
      st.calls++
      render(d.id)
      return
    }
    var li = document.createElement('li')
    li.textContent = d.text
    if (d.type === 'err') {
      li.className = 'err'
      st.stat.textContent = '處理函式被呼叫：0 次（綁定失敗，沒有函式可呼叫）'
      st.stat.className = 'stat bad'
    }
    st.log.append(li)
  })
</script>
</body>
</html>
