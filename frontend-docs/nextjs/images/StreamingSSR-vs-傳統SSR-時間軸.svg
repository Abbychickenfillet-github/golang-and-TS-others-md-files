<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="900" height="430" fill="#fbfbfd"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#1f2937">傳統 SSR vs Streaming SSR — 同一個慢 API，使用者看到畫面的時間差</text>
  <text x="24" y="56" font-size="13" fill="#6b7280">橫軸為時間；灰色代表使用者盯著空白畫面的時間</text>

  <!-- axis -->
  <line x1="200" y1="380" x2="860" y2="380" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="860,380 852,376 852,384" fill="#9ca3af"/>
  <text x="836" y="401" font-size="12" fill="#6b7280">時間</text>
  <g font-size="11" fill="#9ca3af">
    <line x1="200" y1="375" x2="200" y2="385" stroke="#9ca3af"/><text x="190" y="399">0s</text>
    <line x1="365" y1="375" x2="365" y2="385" stroke="#9ca3af"/><text x="357" y="399">1s</text>
    <line x1="530" y1="375" x2="530" y2="385" stroke="#9ca3af"/><text x="522" y="399">2s</text>
    <line x1="695" y1="375" x2="695" y2="385" stroke="#9ca3af"/><text x="687" y="399">3s</text>
  </g>

  <!-- row 1: traditional -->
  <text x="24" y="112" font-size="15" font-weight="700" fill="#b91c1c">Pages Router</text>
  <text x="24" y="132" font-size="12" fill="#6b7280">getServerSideProps</text>
  <text x="24" y="149" font-size="12" fill="#6b7280">All-or-Nothing SSR</text>

  <rect x="200" y="96" width="495" height="40" rx="6" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="330" y="121" font-size="13" fill="#6b7280">伺服器等所有 API 跑完 · 瀏覽器一片空白</text>
  <rect x="695" y="96" width="150" height="40" rx="6" fill="#fecdd3" stroke="#fb7185"/>
  <text x="712" y="121" font-size="13" fill="#9f1239">完整 HTML 一次送達</text>
  <line x1="695" y1="146" x2="695" y2="168" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="626" y="182" font-size="12" font-weight="700" fill="#9f1239">TTFB ≈ 3s</text>

  <!-- divider -->
  <line x1="24" y1="205" x2="876" y2="205" stroke="#e5e7eb"/>

  <!-- row 2: streaming -->
  <text x="24" y="252" font-size="15" font-weight="700" fill="#15803d">App Router</text>
  <text x="24" y="272" font-size="12" fill="#6b7280">loading.js / Suspense</text>
  <text x="24" y="289" font-size="12" fill="#6b7280">Streaming SSR</text>

  <rect x="200" y="236" width="60" height="40" rx="6" fill="#bbf7d0" stroke="#4ade80"/>
  <text x="207" y="261" font-size="12" fill="#166534">外框</text>
  <rect x="260" y="236" width="270" height="40" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="290" y="261" font-size="13" fill="#166534">Skeleton 骨架屏已經在畫面上了</text>
  <rect x="530" y="236" width="165" height="40" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="545" y="261" font-size="13" fill="#166534">背景繼續 await 資料</text>
  <rect x="695" y="236" width="150" height="40" rx="6" fill="#bbf7d0" stroke="#4ade80"/>
  <text x="705" y="261" font-size="12.5" fill="#166534">區塊補全 · 換成真內容</text>

  <line x1="260" y1="286" x2="260" y2="312" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="196" y="326" font-size="12" font-weight="700" fill="#15803d">TTFB ≈ 0.2s</text>

  <!-- annotation -->
  <rect x="200" y="336" width="645" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="212" y="355" font-size="12.5" fill="#1e40af">同一條 HTTP 連線（Transfer-Encoding: chunked）分批推送 — 本質仍然是 SSR，只是從「一次給齊」變成「分段給予」</text>
</svg>
